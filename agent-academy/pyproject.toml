[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-academy"
version = "0.1.0"
description = "Isolated learning and repository intelligence service for Agentforge2"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.28",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "GitPython>=3.1.42",
]

[project.optional-dependencies]
llm = ["litellm>=1.30,<1.82.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
