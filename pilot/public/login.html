<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnfragePilot — Anmeldung</title>
<style>
  :root { --bg:#0b0f14; --card:#121a23; --linie:#20303f; --text:#e8eef5; --mute:#93a5b8; --akzent:#25d0a5; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px; }
  .box { width:100%; max-width:430px; background:var(--card); border:1px solid var(--linie); border-radius:16px; padding:28px; }
  .logo { font-weight:700; font-size:18px; margin-bottom:6px; }
  .logo span { color:var(--akzent); }
  p.sub { color:var(--mute); font-size:14px; margin:0 0 22px; }
  label { display:block; font-size:13px; color:var(--mute); margin:14px 0 6px; }
  input { width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--linie); background:#0a1219; color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--akzent); outline-offset:1px; }
  button { width:100%; margin-top:20px; padding:12px; border-radius:9px; border:0; background:var(--akzent); color:#04211a;
           font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:progress; }
  .tab { display:flex; gap:8px; margin-bottom:6px; }
  .tab button { flex:1; margin:0; background:transparent; color:var(--mute); border:1px solid var(--linie); font-weight:500; }
  .tab button.aktiv { background:#0a1219; color:var(--text); border-color:var(--akzent); }
  .msg { margin-top:14px; font-size:14px; min-height:20px; }
  .msg.fehler { color:#ff8f8f; }
  .msg.ok { color:var(--akzent); }
  .fuss { margin-top:18px; font-size:13px; color:var(--mute); text-align:center; }
  a { color:var(--akzent); text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">Anfrage<span>Pilot</span></div>
  <p class="sub" id="unter">Anmelden oder in 30 Sekunden ein Konto anlegen.</p>

  <div class="tab">
    <button id="tabLogin" class="aktiv" type="button">Anmelden</button>
    <button id="tabRegister" type="button">Registrieren</button>
  </div>

  <form id="form">
    <label for="email">E-Mail</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="passwort">Passwort</label>
    <input id="passwort" type="password" autocomplete="current-password" required minlength="8">
    <div id="firmaFeld" style="display:none">
      <label for="firma">Unternehmen (optional)</label>
      <input id="firma" type="text" autocomplete="organization">
    </div>
    <button id="absenden" type="submit">Anmelden</button>
  </form>
  <div class="msg" id="msg"></div>
  <div class="fuss"><a href="./">Zurueck zur Startseite</a></div>
</div>

<script>
const msg = document.getElementById('msg');
const form = document.getElementById('form');
const absenden = document.getElementById('absenden');
const firmaFeld = document.getElementById('firmaFeld');
let modus = 'login';

document.getElementById('tabLogin').onclick = () => setzeModus('login');
document.getElementById('tabRegister').onclick = () => setzeModus('register');

function setzeModus(neu) {
  modus = neu;
  const istLogin = neu === 'login';
  document.getElementById('tabLogin').classList.toggle('aktiv', istLogin);
  document.getElementById('tabRegister').classList.toggle('aktiv', !istLogin);
  firmaFeld.style.display = istLogin ? 'none' : 'block';
  absenden.textContent = istLogin ? 'Anmelden' : 'Konto anlegen';
  document.getElementById('passwort').setAttribute('autocomplete', istLogin ? 'current-password' : 'new-password');
  document.getElementById('unter').textContent = istLogin
    ? 'Anmelden oder in 30 Sekunden ein Konto anlegen.'
    : 'Konto anlegen: 20 Anfragen zum Testen, keine Kreditkarte.';
  msg.textContent = '';
}

form.onsubmit = async (e) => {
  e.preventDefault();
  msg.textContent = ''; msg.className = 'msg';
  absenden.disabled = true;
  try {
    const pfad = modus === 'login' ? '/api/auth/login' : '/api/auth/registrieren';
    const koerper = {
      email: document.getElementById('email').value.trim(),
      passwort: document.getElementById('passwort').value,
    };
    if (modus !== 'login') koerper.firma = document.getElementById('firma').value.trim();
    const res = await fetch(pfad, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(koerper) });
    const daten = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(daten.error || 'Anmeldung fehlgeschlagen');
    msg.className = 'msg ok';
    msg.textContent = modus === 'login' ? 'Angemeldet — weiter zum Dashboard …' : 'Konto angelegt — weiter zum Dashboard …';
    setTimeout(() => { location.href = './app'; }, 500);
  } catch (err) {
    msg.className = 'msg fehler';
    msg.textContent = err.message;
  } finally {
    absenden.disabled = false;
  }
};

// Direkt im Registrieren-Modus starten, wenn die URL /registrieren ist.
if (location.pathname === '/registrieren') setzeModus('register');
</script>
</body>
</html>
