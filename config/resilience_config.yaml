# AgentForge2 — Smart Resilience Router
# Provider-Prioritäten (kleiner = früher), Endpunkte und Cooldowns.
# Keys kommen ausschließlich aus der Umgebung / .env — niemals hier eintragen.

version: 1

defaults:
  timeout_seconds: 45.0

# Cooldown in Sekunden je Fehlerklasse (global, pro Provider überschreibbar)
cooldowns:
  rate_limit: 120      # HTTP 429 Rate Limit
  server_error: 60     # HTTP 5xx / 401 / 403 ohne Quota-Bezug
  quota: 3600          # Quota erschöpft -> Provider eine Stunde schonen
  network: 30          # DNS/Timeout/Verbindungsfehler

providers:
  # 1) Gemini Free — größtes Kontextfenster, gute Qualität
  - name: gemini-free
    kind: gemini
    priority: 10
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.0-flash
    api_key_env: GEMINI_API_KEY
    cooldowns:
      rate_limit: 90

  # 2) Groq Free — stärkstes Tempo, 120B für anspruchsvolle Schritte
  - name: groq-free
    kind: groq
    priority: 20
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: GROQ_API_KEY
    cooldowns:
      rate_limit: 120

  # 3) OpenRouter Free — breite Modellauswahl, eigener Quota-Topf
  - name: openrouter-free
    kind: openrouter
    priority: 30
    base_url: https://openrouter.ai/api/v1
    model: google/gemma-4-31b-it:free
    api_key_env: OPENROUTER_API_KEY
    cooldowns:
      rate_limit: 180

  # 4) Ollama Local — letzter Ausweg, immer verfügbar, kein Key nötig
  - name: ollama-local
    kind: ollama
    priority: 90
    is_local: true
    base_url: http://localhost:11434/v1
    model: llama3.2:3b
    api_key_env: ""
    cooldowns:
      server_error: 30
      network: 15
