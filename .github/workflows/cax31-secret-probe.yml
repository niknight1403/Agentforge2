name: CAX31-Secrets-Diagnose (struktursicher)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Struktur der Secrets ermitteln (keine Werte ausgeben)
        env:
          HETZNER_NODES: ${{ secrets.HETZNER_NODES }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          set -uo pipefail
          echo "== HETZNER_NODES Struktur =="
          echo "Laenge: ${#HETZNER_NODES} Zeichen"
          echo "Zeilen: $(printf '%s' "$HETZNER_NODES" | wc -l)"
          echo "Woerter: $(printf '%s' "$HETZNER_NODES" | wc -w)"
          echo "Enthaelt IPv4: $(printf '%s' "$HETZNER_NODES" | grep -qE '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' && echo JA || echo NEIN)"
          echo "Enthaelt IPv6: $(printf '%s' "$HETZNER_NODES" | grep -qE '[0-9a-f]*:' && echo JA || echo NEIN)"
          echo "Enthaelt hostnamen-artige Tokens: $(printf '%s' "$HETZNER_NODES" | grep -qE '[a-z][a-z0-9-]+\.[a-z]' && echo JA || echo NEIN)"
          if printf '%s' "$HETZNER_NODES" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
            echo "Format: gueltiges JSON"
            printf '%s' "$HETZNER_NODES" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          def walk(o,p=''):
              if isinstance(o,dict):
                  for k,v in o.items(): walk(v, p+'/'+str(k))
              elif isinstance(o,list):
                  for i,v in enumerate(o[:20]): walk(v, p+f'[{i}]')
              else: print(f'  {p} = <{type(o).__name__}>')
          walk(d)"
          else
            echo "Format: kein JSON; erstes Zeichen-Klasse: $(printf '%s' "$HETZNER_NODES" | cut -c1 | sed 's/[a-zA-Z]/BUCHSTABE/; s/[0-9]/ZIFFFER/; s/. /LEERZEICHEN/')"
          fi
          echo ""
          echo "== HETZNER_API_TOKEN Test gegen Hetzner Cloud API =="
          echo "Token-Laenge: ${#HETZNER_API_TOKEN} Zeichen"
          echo "Token-Präfix-Klasse: $(printf '%s' "$HETZNER_API_TOKEN" | cut -c1-4 | sed 's/[A-Za-z]/X/g; s/[0-9]/9/g')"
          CODE=$(curl -s -o /tmp/hz.json -w '%{http_code}' -m 20 -H "Authorization: Bearer $HETZNER_API_TOKEN" "https://api.hetzner.cloud/v1/servers")
          echo "HTTP-Status /v1/servers: $CODE"
          if [ "$CODE" = "200" ]; then
            python3 - <<'PY'
          import json
          d = json.load(open('/tmp/hz.json'))
          for s in d.get('servers', []):
              ip = s['public_net']['ipv4']['ip']
              print(f"  Server: {s['name']} | Typ: {s['server_type']['id'] if isinstance(s['server_type'],dict) else s['server_type']} | Status: {s['status']} | IPv4: {ip}")
          print("Server gesamt:", d.get('meta', {}).get('pagination', {}).get('total_entries', len(d.get('servers', []))))
          PY
          else
            head -c 300 /tmp/hz.json; echo
          fi
          echo ""
          echo "== Token-Test gegen Hetzner Robot (falls Dedicated) =="
          CODE2=$(curl -s -o /tmp/rb.json -w '%{http_code}' -m 20 -H "Authorization: Bearer $HETZNER_API_TOKEN" "https://robot-ws.your-server.de/v1/server" || true)
          echo "HTTP-Status Robot: ${CODE2:-keine Antwort}"
