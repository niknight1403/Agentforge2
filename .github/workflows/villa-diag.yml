name: Villa-Diagnose (Hub-Log + Scheduler-Interna)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hub-Log und Scheduler-Interna pruefen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          echo "== Hub-Prozess aktiv seit / Uptime =="
          systemctl is-active villaforge-hub.service
          ps -o etime= -C node | head -2
          echo "== Letzte Hub-Logzeilen (developLoop/Scheduler) =="
          journalctl -u villaforge-hub.service --since "15 min ago" --no-pager | grep -iE "villa|develop|schedul|runde|aufgab|slot|error|orchestr" | tail -25 || echo "(keine Treffer)"
          echo "== Task-Bewegung letzte 10 Min (je Villa) =="
          python3 - <<'PYV'
          import sqlite3
          con = sqlite3.connect("/opt/villaforge/server/data/villaforge.db")
          cur = con.cursor()
          rows = cur.execute("SELECT villa_id, COUNT(*) FROM tasks WHERE status IN ('PENDING','READY') GROUP BY villa_id ORDER BY villa_id").fetchall()
          print("Offene (PENDING/READY) je Villa:", rows)
          mv = cur.execute("SELECT villa_id, COUNT(*) FROM tasks WHERE updated_at > datetime('now','-10 minutes') GROUP BY villa_id").fetchall()
          print("Bewegung letzte 10 Min:", mv)
          print("Slots-Setting:", cur.execute("SELECT value FROM control_settings WHERE key='villaSlots'").fetchone())
          print("Villen-Status:", cur.execute("SELECT status, COUNT(*) FROM villas GROUP BY status").fetchall())
          PYV
          echo "== LLM-/Kaskaden-Meldungen der letzten 25 Min =="
          journalctl -u villaforge-hub.service --since "25 min ago" --no-pager | grep -iE "LLM|kaskade|route|verfuegbar|unavailable|verbind|ECONN|timeout|pau" | tail -30 || echo "(keine Treffer)"
          echo "== Ollama-Knoten erreichbar? (nur Statuscode) =="
          for node in 2.31.77.72 2.31.45.241 2.31.64.65 2.28.12.63; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 8 http://$node:11434/api/tags || echo "FAIL")
            echo "  $node:11434 -> $code"
          done
          echo "== Villen: Status + Autonomie =="
          python3 - <<'PYV'
          import sqlite3
          con = sqlite3.connect('/opt/villaforge/server/data/villaforge.db')
          cur = con.cursor()
          print('Status/Autonomie:', cur.execute('SELECT status, autonomy, COUNT(*) FROM villas GROUP BY status, autonomy').fetchall())
          PYV
          echo "== VF_Fokus/Slot-Env (redigiert) =="
          systemctl show villaforge-hub.service -p Environment | grep -o 'VF_FOCUS_MODE=[^ ]*' || echo "VF_FOCUS_MODE nicht gesetzt"
          echo "(Env-Ausgabe redigiert: nur VF_FOCUS_MODE sichtbar)"
          EOS
