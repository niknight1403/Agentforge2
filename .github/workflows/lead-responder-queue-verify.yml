name: Lead Responder - Queue Verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Admin-API-Formen pruefen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 ubuntu@92.5.177.159 'sudo bash -s' <<'EOS'
          set -uo pipefail
          KEY=$(grep -m1 "^ADMIN_API_KEY=" /opt/lead-responder/.env | cut -d= -f2-)
          API=http://127.0.0.1:8080/api/v1
          echo "== health keys =="
          curl -sS "$API/health" | python3 -c "import json,sys;d=json.load(sys.stdin);print(list(d.keys()));print(\"delivery:\",d.get(\"delivery\"))"
          C=$(curl -sS -X POST "$API/clients" -H "x-admin-key: $KEY" -H "content-type: application/json" -d '{"name":"Shape Probe","system_prompt":"Test.","webhook_outbound_url":"https://httpbin.org/post"}')
          CID=$(printf "%s" "$C" | python3 -c "import json,sys;print(json.load(sys.stdin)[\"client\"][\"id\"])")
          CK=$(printf "%s" "$C" | python3 -c "import json,sys;print(json.load(sys.stdin)[\"api_key\"])")
          curl -sS -m 40 -o /dev/null -X POST "$API/lead/inbound" -H "x-api-key: $CK" -H "content-type: application/json" -d '{"name":"Shape","email":"s@example.com","inquiry":"Fenster streichen, Aachen."}'
          sleep 2
          echo "== admin/deliveries raw =="; curl -sS "$API/admin/deliveries?limit=3" | head -c 500; echo
          echo "== admin/delivery-jobs raw =="; curl -sS "$API/admin/delivery-jobs?limit=3" | head -c 700; echo
          echo "== stats raw =="; curl -sS "$API/stats" | head -c 400; echo
          echo "== retention/preview raw =="; curl -sS "$API/admin/retention/preview" | head -c 300; echo
          curl -sS -o /dev/null -X DELETE "$API/clients/$CID" -H "x-admin-key: $KEY"; echo "aufgeraeumt"
          EOS
