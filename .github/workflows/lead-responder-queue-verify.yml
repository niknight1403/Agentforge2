name: Lead Responder - Queue Verify
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Admin-Auth eingrenzen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 ubuntu@92.5.177.159 'sudo bash -s' <<'EOS'
          set -uo pipefail
          KEY=$(grep -m1 "^ADMIN_API_KEY=" /opt/lead-responder/.env | cut -d= -f2-)
          API=http://127.0.0.1:8080/api/v1
          echo "key_len=${#KEY} cr=$(printf %s "$KEY" | od -An -c | tr -d " \n" | grep -c "\\r" || true)"
          echo "hint: $(grep -m1 "^ADMIN_API_KEY=" /opt/lead-responder/.env | cut -c1-20)..."
          code() { curl -s -o /tmp/b.json -w "%{http_code}" "$@"; }
          echo "GET  /health                 -> $(code "$API/health")"
          echo "POST /clients (x-admin-key)  -> $(code -X POST "$API/clients" -H "x-admin-key: $KEY" -H "content-type: application/json" -d '{"name":"Auth Probe","system_prompt":"T."}')"
          head -c 200 /tmp/b.json; echo
          CID=$(python3 -c "import json;print(json.load(open(\"/tmp/b.json\"))[\"client\"][\"id\"])" 2>/dev/null || echo none)
          echo "client_id=$CID"
          echo "GET  /deliveries (x-admin-key) -> $(code "$API/admin/deliveries?limit=2" -H "x-admin-key: $KEY")"; head -c 200 /tmp/b.json; echo
          echo "GET  /deliveries (Bearer)      -> $(code "$API/admin/deliveries?limit=2" -H "Authorization: Bearer $KEY")"; head -c 200 /tmp/b.json; echo
          echo "GET  /delivery-jobs (x-admin)  -> $(code "$API/admin/delivery-jobs?limit=2" -H "x-admin-key: $KEY")"; head -c 300 /tmp/b.json; echo
          echo "GET  /stats (x-admin)          -> $(code "$API/stats" -H "x-admin-key: $KEY")"; head -c 300 /tmp/b.json; echo
          [ "$CID" != "none" ] && curl -s -o /dev/null -X DELETE "$API/clients/$CID" -H "x-admin-key: $KEY" && echo aufgeraeumt
          EOS
