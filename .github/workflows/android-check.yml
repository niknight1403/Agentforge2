name: Android PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/check-android-apk-signing*'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-check.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Production-APK-Signaturgate testen
        run: node --test scripts/check-android-apk-signing.test.mjs
      - name: Android lint, unit tests and debug build
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
