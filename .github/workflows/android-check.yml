name: Android PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-check.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Release-Build ohne Produktionsschluessel muss geschlossen scheitern
        shell: bash
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon --stacktrace > "$RUNNER_TEMP/release-signing-check.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Release assembly unexpectedly succeeded without production signing."
            exit 1
          fi
          if ! grep -Fq "Production release signing is not configured." "$RUNNER_TEMP/release-signing-check.log"; then
            cat "$RUNNER_TEMP/release-signing-check.log"
            echo "Release assembly failed for a reason other than the required signing guard."
            exit 1
          fi
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "An APK was produced despite missing production signing."
            exit 1
          fi
      - name: Android lint, unit tests and debug build
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Build and verify release signature with ephemeral CI-only key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/villaforge-ephemeral-ci.keystore"
          release_apk=app/build/outputs/apk/release/app-release.apk
          trap 'rm -f "$keystore" "$release_apk"' EXIT
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$keystore" -storepass "$password" -keypass "$password" \
            -alias ci-ephemeral -dname "CN=VillaForge Ephemeral CI" \
            -keyalg RSA -keysize 2048 -validity 2 >/dev/null 2>&1
          export VILLA_RELEASE_KEYSTORE_PATH="$keystore"
          export VILLA_RELEASE_STORE_PASSWORD="$password"
          export VILLA_RELEASE_KEY_ALIAS=ci-ephemeral
          export VILLA_RELEASE_KEY_PASSWORD="$password"
          gradle :app:assembleRelease --no-daemon --stacktrace
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo "Android SDK root is not configured."
            exit 1
          fi
          apksigner=$(find "$sdk_root/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "Android build-tools apksigner is unavailable."
            exit 1
          fi
          debug_apk=app/build/outputs/apk/debug/app-debug.apk
          cert_digest() {
            "$apksigner" verify --print-certs "$1" | awk -F': ' '
              /certificate SHA-256 digest:/ {
                digest=$2
                gsub(/[^[:xdigit:]]/, "", digest)
                if (length(digest) == 64) { print tolower(digest); exit }
              }
            '
          }
          debug_digest=$(cert_digest "$debug_apk")
          release_digest=$(cert_digest "$release_apk")
          if ! [[ "$debug_digest" =~ ^[0-9a-f]{64}$ && "$release_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not verify Android APK signing certificates."
            exit 1
          fi
          if [ "$debug_digest" = "$release_digest" ]; then
            echo "Release APK unexpectedly uses the debug signing certificate."
            exit 1
          fi
          echo "Release APK signature verified with a CI-only key distinct from the debug signer."
      - uses: actions/upload-artifact@v4
        with:
          name: villaforge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
