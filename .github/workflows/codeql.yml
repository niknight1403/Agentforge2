name: CodeQL Security Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '*.gradle.kts'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '*.gradle.kts'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, java-kotlin]
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'autobuild' || 'none' }}

      - name: CodeQL analysieren
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
