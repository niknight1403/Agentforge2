name: Master-Chat-Probe

on:
  workflow_dispatch: {}
  push:
    paths:
      - server/master-control.mjs
      - server/llm.mjs
      - .github/workflows/master-chat-probe.yml

concurrency:
  group: master-chat-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: Master-Chat direkt testen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login, Chat, History, Health
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          base = 'https://hub.cybersarah-ki.com'

          def call(method, path, token=None, body=None, timeout=240):
              headers = {'Content-Type': 'application/json'}
              if token: headers['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(base + path, method=method, headers=headers,
                                           data=json.dumps(body).encode() if body else None)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read() or b'{}')
                  except Exception: return e.code, {}

          # Let the matching safe deploy finish before probing the new production code.
          import time
          time.sleep(45)

          print('== 1) Login ==')
          st, data = call('POST', '/api/auth/login', body={'email': os.environ['VF_ADMIN_EMAIL'], 'password': os.environ['VF_ADMIN_PASSWORD']})
          print('HTTP', st, '| Token:', 'ja' if data.get('token') else 'NEIN')
          tok = data.get('token')

          print('== 2) Health (LLM-Kaskade) ==')
          st, h = call('GET', '/api/health')
          print('HTTP', st, '| llm:', json.dumps(h.get('llm', {}))[:300])

          print('== 3) Master-Chat ==')
          import time
          started = time.monotonic()
          st, resp = call('POST', '/api/master/chat', tok, {'message': 'Erkläre mir in zwei klaren Sätzen, wie ich eine vorhandene Villa im Dashboard starte. Führe keine Aktion aus.'}, timeout=240)
          print('HTTP', st, '| Dauer:', round(time.monotonic()-started, 1), 's | Response:', json.dumps(resp)[:500])
          answer = str(resp.get('answer') or resp.get('reply') or '')
          assert st == 200 and resp.get('ok') is True and len(answer) >= 30 and 'villa' in answer.lower() and 'start' in answer.lower(), 'Master-Chat liefert keine brauchbare, auftragsbezogene Antwort'

          print('== 4) History (letzte 2) ==')
          st, hist = call('GET', '/api/master/history', tok)
          msgs = hist if isinstance(hist, list) else hist.get('messages', hist.get('history', []))
          if isinstance(msgs, list):
              for m in msgs[-2:]:
                  print(json.dumps({k: str(v)[:150] for k, v in m.items()})[:300])
          else:
              print('History-Form:', json.dumps(hist)[:300])
          PY
