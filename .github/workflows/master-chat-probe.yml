name: Master-Chat-Probe

on:
  workflow_dispatch: {}
  push:
    branches: [main, work/vf500-aurora]
    paths: [.github/workflows/master-chat-probe.yml]
  workflow_run:
    workflows: [Hub-Deploy]
    types: [completed]
    branches: [main]

concurrency:
  group: master-chat-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Master-Chat direkt testen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login, Chat, History, Health
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          base = 'https://hub.cybersarah-ki.com'

          def call(method, path, token=None, body=None, timeout=240):
              headers = {'Content-Type': 'application/json'}
              if token: headers['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(base + path, method=method, headers=headers,
                                           data=json.dumps(body).encode() if body else None)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  try: return e.code, json.loads(e.read() or b'{}')
                  except Exception: return e.code, {}

          # workflow_run waits for the successful production healthcheck.
          import time

          print('== 1) Login ==')
          st, data = call('POST', '/api/auth/login', body={'email': os.environ['VF_ADMIN_EMAIL'], 'password': os.environ['VF_ADMIN_PASSWORD']})
          print('HTTP', st, '| Token:', 'ja' if data.get('token') else 'NEIN')
          tok = data.get('token')

          print('== 2) Health (LLM-Kaskade) ==')
          st, h = call('GET', '/api/health')
          print('HTTP', st, '| llm:', json.dumps(h.get('llm', {}))[:300])

          st, route_status = call('GET', '/api/llm/status', tok)
          routes = route_status.get('routes', []) if isinstance(route_status, dict) else []
          print('HTTP', st, '| eligible/configured:', sum(1 for x in routes if x.get('eligible')), '/', len(routes))
          for route in routes:
              print('Route state:', json.dumps({k: route.get(k) for k in ('name','provider','model','configured','eligible','status','cooldownUntil','circuit')}))
          print('== Product acceptance (read-only) ==')
          st, villas = call('GET', '/api/villas', tok)
          villas = villas if isinstance(villas, list) else villas.get('villas', [])
          for villa in sorted(villas, key=lambda v: int(v.get('tasks_done') or 0), reverse=True)[:10]:
              vid = int(villa['id'])
              ps, product = call('GET', '/api/villas/'+str(vid)+'/product', tok)
              bs, build = call('GET', '/api/villas/'+str(vid)+'/build', tok)
              print('Product gate:', json.dumps({'villaId': vid, 'productHttp': ps, 'verified': product.get('verified'), 'unfinishedTasks': product.get('unfinishedTasks'), 'blockerCount': len(product.get('blockers') or []), 'buildHttp': bs, 'buildStatus': build.get('status')}))
          print('== 3) Master-Chat ==')
          import time
          started = time.monotonic()
          started_epoch_ms = int(time.time()*1000)
          st, resp = call('POST', '/api/master/chat', tok, {'message': 'Erkläre mir in zwei klaren Sätzen, wie ich eine vorhandene Villa im Dashboard starte. Führe keine Aktion aus.'}, timeout=240)
          print('HTTP', st, '| Dauer:', round(time.monotonic()-started, 1), 's | Response:', json.dumps(resp)[:500])
          print('Route attempts:', json.dumps(resp.get('routeAttempts', [])))
          answer = str(resp.get('answer') or resp.get('reply') or '')
          assert st == 200 and resp.get('ok') is True and len(answer) >= 30 and 'villa' in answer.lower() and 'start' in answer.lower(), 'Master-Chat liefert keine brauchbare, auftragsbezogene Antwort'

          hs, after = call('GET', '/api/health', tok)
          fresh = after.get('llm', {})
          assert hs == 200 and fresh.get('freeOnly') is True and int(fresh.get('lastSuccessfulReplyAt') or 0) >= started_epoch_ms-5000 and int(fresh.get('lastSuccessfulReplyAt') or 0) > int(h.get('llm', {}).get('lastSuccessfulReplyAt') or 0), 'Kein frischer Modellnachweis'
          assert resp.get('steps') == [], 'Probe hat Nebenaktionen ausgefuehrt'
          print('REAL_MODEL_VERIFIED:', json.dumps({'version':after.get('version'), 'route':fresh.get('lastSuccessfulRoute'), 'latencySeconds':round(time.monotonic()-started, 1), 'sideEffects':0}))

          print('== 4) History (letzte 2) ==')
          st, hist = call('GET', '/api/master/history', tok)
          msgs = hist if isinstance(hist, list) else hist.get('messages', hist.get('history', []))
          if isinstance(msgs, list):
              for m in msgs[-2:]:
                  print(json.dumps({k: str(v)[:150] for k, v in m.items()})[:300])
          else:
              print('History-Form:', json.dumps(hist)[:300])
          PY
