name: Inferenz-Trennung

on:
  workflow_dispatch:
    inputs:
      task:
        description: "bench | apply | verify | all"
        default: "all"
      runs:
        description: "Anzahl Chat-Anfragen bei verify"
        default: "2"
      dry_run:
        description: "true = nur anzeigen, nichts schreiben"
        default: "false"

permissions:
  contents: read

jobs:
  separation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: SSH-Schluessel ablegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Skript hochladen
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key scripts/ops/inference-separation.py ubuntu@92.5.177.159:/tmp/inference-separation.py
      - name: Inferenz-Trennung ausfuehren
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo python3 /tmp/inference-separation.py ${{ inputs.task }} --runs ${{ inputs.runs }} ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}"
