name: Hub-Diagnose

on:
  workflow_dispatch:
    inputs:
      task:
        description: "bench | tune | both"
        default: "both"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: SSH-Schluessel ablegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Skripte hochladen
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key scripts/ops/inference-tune.py scripts/ops/chat-bench.py ubuntu@92.5.177.159:/tmp/
      - name: Inferenz auf entfernte Knoten legen
        if: ${{ inputs.task == 'both' || inputs.task == 'tune' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'sudo bash -s' <<'DIAG'
          set -uo pipefail
          python3 /tmp/inference-tune.py | tail -6
          systemctl restart villaforge-hub
          for i in $(seq 1 25); do sleep 2; curl -sf --max-time 5 http://127.0.0.1:12000/api/health >/dev/null && { echo "  Hub bereit"; break; }; done
          DIAG
      - name: Hub-Zustand und Chat messen
        if: ${{ inputs.task == 'both' || inputs.task == 'bench' }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'sudo bash -s' <<'DIAG'
          set -uo pipefail
          echo "== Dienst =="
          systemctl is-active villaforge-hub; systemctl show villaforge-hub -p NRestarts --value
          echo "== Abstuerze im Journal =="
          journalctl -u villaforge-hub --since '-20min' --no-pager -o cat | grep -iE 'fatal|out of memory|killed|uncaught|heap' | tail -5
          echo "== Health =="
          curl -s --max-time 10 http://127.0.0.1:12000/api/health | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('  version',d.get('version'),'| llm',d.get('llm',{}).get('state'),'| aktiv',d.get('llm',{}).get('queue',{}).get('active'),'| freie Routen',d.get('llm',{}).get('eligibleRoutes'))
          "
          echo "== Chat =="
          PID=$(ss -ltnp 2>/dev/null | grep ':12000' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          EMAIL=$(tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep '^VF_ADMIN_EMAIL=' | cut -d= -f2-)
          PASS=$(tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep '^VF_ADMIN_PASSWORD=' | cut -d= -f2-)
          VF_ADMIN_EMAIL="$EMAIL" VF_ADMIN_PASSWORD="$PASS" VF_BENCH_RUNS=3 python3 /tmp/chat-bench.py
          DIAG
