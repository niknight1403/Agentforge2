name: Hub-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Schluessel ablegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Dienste neu starten und Master-Chat erneut pruefen
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'sudo bash -s' <<'DIAG'
          set -uo pipefail
          echo "== Neustart beider Dienste =="
          systemctl restart villaforge-hub; systemctl restart villaforge-supervisor
          for i in $(seq 1 20); do sleep 2; curl -sf --max-time 5 http://127.0.0.1:12000/api/health >/dev/null && { echo "  health: ok ($i)"; break; }; done
          PID=$(ss -ltnp 2>/dev/null | grep ':12000' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          echo "  Hub-PID=$PID gestartet: $(ps -o lstart= -p "$PID" 2>/dev/null)"
          EMAIL=$(tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep '^VF_ADMIN_EMAIL=' | cut -d= -f2-)
          PASS=$(tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep '^VF_ADMIN_PASSWORD=' | cut -d= -f2-)
          TOK=$(curl -s --max-time 20 -X POST http://127.0.0.1:12000/api/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))' 2>/dev/null)
          echo "== Master-Chat =="
          curl -s --max-time 180 -X POST http://127.0.0.1:12000/api/master/chat -H 'content-type: application/json' \
            -H "authorization: Bearer $TOK" \
            -d '{"message":"Antworte ausschliesslich mit einem kurzen Satz, dass die Modellverbindung geprueft ist.","requestId":"diag-'"$(date +%s)"'"}' \
            | head -c 700; echo
          echo "== LLM-Diagnose (Hub, neue Form) =="
          journalctl -u villaforge-hub --since '-5min' --no-pager -o cat | grep 'Fehlschlag' | tail -4
          echo "== LLM-Diagnose (Supervisor) =="
          journalctl -u villaforge-supervisor --since '-5min' --no-pager -o cat | grep 'Fehlschlag' | tail -2
          echo "== Speicher =="
          free -m | head -3
          DIAG
