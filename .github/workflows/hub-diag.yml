name: Hub-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Schluessel ablegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Master-Chat reproduzieren und Fehlerursachen lesen
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'sudo bash -s' <<'DIAG'
          set -uo pipefail
          ENVLINE=$(systemctl show villaforge-hub -p Environment --value)
          export $(echo "$ENVLINE" | tr ' ' '\n' | grep -E '^(VF_ADMIN_EMAIL|VF_ADMIN_PASSWORD)=' | tr '\n' ' ')
          echo "== Login =="
          TOK=$(curl -s --max-time 20 -X POST http://127.0.0.1:12000/api/auth/login -H 'content-type: application/json' \
            -d "{\"email\":\"$VF_ADMIN_EMAIL\",\"password\":\"$VF_ADMIN_PASSWORD\"}" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))' 2>/dev/null)
          [ -n "$TOK" ] && echo "  Session: vorhanden" || echo "  Session: FEHLT"
          echo "== Master-Chat =="
          curl -s --max-time 150 -X POST http://127.0.0.1:12000/api/master/chat -H 'content-type: application/json' \
            -H "authorization: Bearer $TOK" \
            -d '{"message":"Antworte ausschliesslich mit einem kurzen Satz, dass die Modellverbindung geprueft ist.","requestId":"diag-'"$(date +%s)"'"}' \
            | head -c 700; echo
          echo "== Diagnosezeilen mit versuchten Routen =="
          journalctl -u villaforge-hub --since '-4min' --no-pager -o cat | grep 'Fehlschlag' | tail -6
          echo "== Speicher =="
          free -m | head -3
          DIAG
