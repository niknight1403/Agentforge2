name: Hub-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Schluessel ablegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Prozesse, Ports und Routen sauber lesen
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'sudo bash -s' <<'DIAG'
          set -uo pipefail
          PID=$(ss -ltnp 2>/dev/null | grep ':12000' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          DB=$(tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep '^VF_DB=' | cut -d= -f2-)
          echo "DB=${DB:-unbekannt}"
          echo "== llama-server / ollama Prozesse =="
          ps -eo pid,etime,rss,cmd --sort=-rss | grep -E 'llama-server|ollama|litellm' | grep -v grep | head -8
          echo "== hoerende LLM-Ports =="
          ss -ltnp 2>/dev/null | grep -E ':(11434|4000|8080|8000|12000)' | head -8
          echo "== aktive lokale Routen =="
          if [ -n "${DB:-}" ] && [ -f "$DB" ]; then
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]); c.row_factory=sqlite3.Row
          rows=c.execute("select name,provider,base_url,model,enabled from routes").fetchall()
          loc=[r for r in rows if r['enabled'] and ('127.0.0.1' in (r['base_url'] or '') or 'localhost' in (r['base_url'] or ''))]
          print(f"  gesamt={len(rows)} aktiv={sum(1 for r in rows if r['enabled'])} lokal_aktiv={len(loc)}")
          for r in loc: print(f"  {r['name'][:40]:40s} {r['model'][:22]:22s} {r['base_url']}")
          PY
          else echo "  DB nicht lesbar"; fi
          echo "== Speicher =="
          free -m | head -3
          DIAG
