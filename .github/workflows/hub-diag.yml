name: Hub-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Schluessel ablegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Knoten inventarisieren, lokale Routen umstellen, Chat pruefen
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'sudo bash -s' <<'DIAG'
          set -uo pipefail
          DB=/opt/villaforge/server/data/villaforge.db
          echo "== Ollama-Endpunkte und ihre Modelle =="
          python3 - "$DB" <<'PY' > /tmp/endpoints.txt
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1])
          for base in sorted({b for (b,) in c.execute("select distinct base_url from routes where enabled=1") if b}):
              print(base)
          PY
          while read -r base; do
            [ -z "$base" ] && continue
            host=$(echo "$base" | sed -E 's#https?://([^:/]+).*#\1#')
            code=$(curl -s -o /tmp/tags.json -w '%{http_code}' --max-time 6 "$base/api/tags" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              models=$(python3 -c "
          import json
          try:
              d=json.load(open('/tmp/tags.json'))
              print(','.join(m['name'] for m in d.get('models',[])[:4]))
          except Exception: print('?')
          ")
              t0=$(date +%s%N)
              lcode=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$base/api/generate" -d "{\"model\":\"$(echo $models | cut -d, -f1)\",\"prompt\":\"ok\",\"stream\":false,\"options\":{\"num_predict\":4}}" 2>/dev/null || echo 000)
              t1=$(date +%s%N)
              echo "  $base  http=$code warm=$lcode $(( (t1-t0)/1000000 ))ms  modelle=$models"
            else
              echo "  $base  http=$code (nicht erreichbar)"
            fi
          done < /tmp/endpoints.txt
          echo "== lokale Routen (vorher) =="
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1])
          for rid,name,base,model in c.execute("select id,name,base_url,model from routes where enabled=1 and (base_url like '%127.0.0.1%' or base_url like '%localhost%')"):
              print(f"  #{rid} {name[:32]:32s} {model}")
          PY
          echo "== lokale Routen auf qwen2.5-coder:7b stellen =="
          python3 - "$DB" <<'PY'
          import sqlite3,sys
          c=sqlite3.connect(sys.argv[1]); n=0
          for rid,model,base in c.execute("select id,model,base_url from routes where enabled=1").fetchall():
              if not ('127.0.0.1' in (base or '') or 'localhost' in (base or '')): continue
              if model in ('qwen2.5-coder:7b','llama3.2:3b'): continue
              c.execute("update routes set model=? where id=?",('qwen2.5-coder:7b',rid)); n+=1
              print(f"  #{rid}: {model} -> qwen2.5-coder:7b")
          c.commit(); print(f"  geaendert={n}")
          PY
          systemctl restart villaforge-hub
          for i in $(seq 1 20); do sleep 2; curl -sf --max-time 5 http://127.0.0.1:12000/api/health >/dev/null && break; done
          curl -s --max-time 100 http://127.0.0.1:11434/api/generate -d '{"model":"qwen2.5-coder:7b","prompt":"ok","stream":false,"options":{"num_predict":4}}' -o /dev/null -w '== Vorwaermen: http=%{http_code} %{time_total}s\n'
          PID=$(ss -ltnp 2>/dev/null | grep ':12000' | grep -oE 'pid=[0-9]+' | head -1 | cut -d= -f2)
          EMAIL=$(tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep '^VF_ADMIN_EMAIL=' | cut -d= -f2-)
          PASS=$(tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep '^VF_ADMIN_PASSWORD=' | cut -d= -f2-)
          TOK=$(curl -s --max-time 20 -X POST http://127.0.0.1:12000/api/auth/login -H 'content-type: application/json' -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("token",""))' 2>/dev/null)
          echo "== Master-Chat dreimal =="
          for n in 1 2 3; do
            curl -s --max-time 120 -X POST http://127.0.0.1:12000/api/master/chat -H 'content-type: application/json' -H "authorization: Bearer $TOK" -d '{"message":"Antworte ausschliesslich mit einem kurzen Satz, dass die Modellverbindung geprueft ist.","requestId":"diag-'"$(date +%s)-$n"'"}' | python3 -c "
          import json,sys
          d=json.load(sys.stdin); att=d.get('routeAttempts') or []
          print(f\"  $n: ok={d.get('ok')} code={d.get('code','-')} versuche={[ (a['route'][:22], a['code']) for a in att[:3] ]}\")
          "
          done
          free -m | head -2
          DIAG
