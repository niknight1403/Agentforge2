name: Hub-Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Schluessel ablegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
      - name: Ollama-Dienste und Speicher pruefen
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'sudo bash -s' <<'DIAG'
          echo "== Ollama-Dienste =="
          systemctl list-units --type=service --all --no-legend 2>/dev/null | grep -i ollama
          echo "== ollama-Prozesse =="
          ps -eo pid,etime,rss,cmd | grep -E 'ollama serve' | grep -v grep
          echo "== Modelle im Speicher =="
          curl -s --max-time 10 http://127.0.0.1:11434/api/ps | python3 -c "
          import json,sys
          for m in json.load(sys.stdin).get('models',[]): print('  ',m['name'],round(m.get('size',0)/1e9,1),'GB')
          "
          echo "== Speicher =="
          free -m | head -3
          DIAG
