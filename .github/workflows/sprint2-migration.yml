name: Sprint2-Migration (AI Influenza Geschäftsobjekte)
on:
  workflow_dispatch: {}
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Migration auf revenue_os anwenden und verifizieren
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          echo "===== VORHER ====="
          sudo -u postgres psql -d revenue_os -At -c "SELECT count(*) FROM subscription_plans"
          echo "===== MIGRATION ====="
          sudo -u postgres psql -d revenue_os -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS kunden (
            id serial PRIMARY KEY,
            email varchar(320) NOT NULL UNIQUE,
            name varchar(255),
            firma varchar(255),
            telefon varchar(64),
            quelle varchar(64) NOT NULL DEFAULT 'inbound',
            status varchar(32) NOT NULL DEFAULT 'interessent',
            dsgvo_einwilligung timestamptz,
            notizen text,
            metadaten jsonb DEFAULT '{}',
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS kunden_status_idx ON kunden (status);

          CREATE TABLE IF NOT EXISTS angebote (
            id serial PRIMARY KEY,
            kunde_id integer REFERENCES kunden(id) ON DELETE SET NULL,
            lead_id integer REFERENCES leads(id) ON DELETE SET NULL,
            plan_id integer REFERENCES subscription_plans(id) ON DELETE SET NULL,
            paket varchar(32) NOT NULL,
            titel varchar(255) NOT NULL,
            leistungsumfang text NOT NULL,
            preis numeric(10,2) NOT NULL,
            waehrung varchar(3) NOT NULL DEFAULT 'EUR',
            intervall varchar(16) NOT NULL DEFAULT 'month',
            status varchar(32) NOT NULL DEFAULT 'entwurf',
            gueltig_bis timestamptz,
            freigegeben_von varchar(255),
            freigegeben_am timestamptz,
            erstellt_von varchar(64) NOT NULL DEFAULT 'agent',
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS angebote_status_idx ON angebote (status);
          CREATE INDEX IF NOT EXISTS angebote_kunde_idx ON angebote (kunde_id);

          CREATE TABLE IF NOT EXISTS auftraege (
            id serial PRIMARY KEY,
            angebot_id integer REFERENCES angebote(id) ON DELETE SET NULL,
            kunde_id integer REFERENCES kunden(id) ON DELETE SET NULL,
            subscription_id integer,
            paket varchar(32) NOT NULL,
            status varchar(32) NOT NULL DEFAULT 'onboarding',
            fortschritt integer NOT NULL DEFAULT 0,
            start_am timestamptz NOT NULL DEFAULT now(),
            faellig_am timestamptz,
            abgeschlossen_am timestamptz,
            umsatz_cent integer NOT NULL DEFAULT 0,
            kosten_cent integer NOT NULL DEFAULT 0,
            zustaendiger_agent varchar(64) NOT NULL DEFAULT 'customer-success',
            ereignisse jsonb DEFAULT '[]',
            metadaten jsonb DEFAULT '{}',
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now()
          );
          CREATE INDEX IF NOT EXISTS auftraege_status_idx ON auftraege (status);
          CREATE INDEX IF NOT EXISTS auftraege_kunde_idx ON auftraege (kunde_id);

          INSERT INTO subscription_plans (name, beschreibung, preis, waehrung, intervall, reihenfolge, aktiv, features, highlight_features, populaer)
          SELECT * FROM (VALUES
            ('AI Influenza Starter', 'KI-Marketing-Einstieg: 12 Beiträge, 4 KI-Bilder, Content-Plan', 299.00, 'EUR', 'month', 100, true,
             '["12 Beiträge/Monat","4 KI-Bilder/Monat","Content-Plan"]'::jsonb, '[]'::jsonb, false),
            ('AI Influenza Growth', 'KI-Marketing mit Video: 12 Kurzvideos, 20 Beiträge, Monatsreport', 999.00, 'EUR', 'month', 101, true,
             '["12 Kurzvideos/Monat","20 Beiträge/Monat","Monatsreport"]'::jsonb, '[]'::jsonb, true),
            ('AI Influenza Business', 'Individuelles KI-Marketing-Team mit vereinbartem Leistungsumfang', 2499.00, 'EUR', 'month', 102, true,
             '["Individuelles Team","Vereinbarter Leistungsumfang","Wöchentliches Reporting"]'::jsonb, '[]'::jsonb, false)
          ) AS v(name, beschreibung, preis, waehrung, intervall, reihenfolge, aktiv, features, highlight_features, populaer)
          WHERE NOT EXISTS (SELECT 1 FROM subscription_plans sp WHERE sp.name = v.name);
          SQL
          echo "===== NACHHER ====="
          echo "-- Neue Tabellen (Spaltenzahl) --"
          for T in kunden angebote auftraege; do
            C=$(sudo -u postgres psql -d revenue_os -At -c "SELECT count(*) FROM information_schema.columns WHERE table_name='$T' AND table_schema='public'")
            R=$(sudo -u postgres psql -d revenue_os -At -c "SELECT count(*) FROM $T")
            echo "  $T: $C Spalten, $R Zeilen"
          done
          echo "-- AI-Influenza-Plaene --"
          sudo -u postgres psql -d revenue_os -c "SELECT id, name, preis, intervall, aktiv FROM subscription_plans WHERE name LIKE 'AI Influenza%' ORDER BY preis"
          echo "-- Idempotenz-Test (zweiter Lauf) --"
          sudo -u postgres psql -d revenue_os -At -c "SELECT count(*) FROM subscription_plans WHERE name LIKE 'AI Influenza%'"
          echo "===== ANGEBOTS-GATE LIVE-TEST (Insert + Constraint) ====="
          sudo -u postgres psql -d revenue_os -At -c "INSERT INTO kunden (email, name, quelle) VALUES ('test-gate@example.invalid','Gate-Test','inbound') ON CONFLICT (email) DO NOTHING; SELECT id FROM kunden WHERE email='test-gate@example.invalid'" | tail -1 > /tmp/kid
          KID=$(cat /tmp/kid)
          sudo -u postgres psql -d revenue_os -At -c "INSERT INTO angebote (kunde_id, paket, titel, leistungsumfang, preis, status) VALUES ($KID,'starter','Gate-Test','Test',299.00,'freigabe_offen') RETURNING id" | tail -1 > /tmp/aid
          AID=$(cat /tmp/aid)
          echo "Test-Angebot ID: $AID (Status freigabe_offen)"
          sudo -u postgres psql -d revenue_os -At -c "UPDATE angebote SET status='freigegeben', freigegeben_von='workflow-test', freigegeben_am=now() WHERE id=$AID; SELECT status, freigegeben_von IS NOT NULL FROM angebote WHERE id=$AID"
          echo "-- Testdaten wieder entfernen --"
          sudo -u postgres psql -d revenue_os -At -c "DELETE FROM angebote WHERE id=$AID; DELETE FROM kunden WHERE email='test-gate@example.invalid'"
          echo "===== ABSCHLUSS ====="
          sudo -u postgres psql -d revenue_os -At -c "SELECT count(*) || ' Plaene gesamt, ' || (SELECT count(*) FROM subscription_plans WHERE name LIKE 'AI Influenza%') || ' davon AI Influenza' FROM subscription_plans"
          EOS
