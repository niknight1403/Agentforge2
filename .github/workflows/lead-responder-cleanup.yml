name: Lead Responder - Cleanup
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH cleanup
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 ubuntu@92.5.177.159 'bash -s' <<'EOS'
          set -uo pipefail
          KEY=$(grep -m1 '^ADMIN_API_KEY=' /opt/lead-responder/.env | cut -d= -f2- | tr -d '\r')
          API=http://127.0.0.1:8080/api/v1
          LIST=$(curl -sS "$API/clients" -H "x-admin-key: $KEY")
          printf '%s' "$LIST" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          items=d.get("clients") or d.get("items") or []
          print("vorher:", len(items))
          for c in items:
              print("  ", c.get("slug"))
          '
          DUPS=$(printf '%s' "$LIST" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          items=d.get("clients") or d.get("items") or []
          print(" ".join(c["id"] for c in items if c.get("name")=="Demo (Musterbetrieb)" and c.get("slug")!="demo-musterbetrieb"))
          ')
          for id in $DUPS; do
            curl -sS -o /dev/null -X DELETE "$API/clients/$id" -H "x-admin-key: $KEY"
          done
          echo "geloescht: $(echo $DUPS | wc -w)"
          KEEP=$(printf '%s' "$LIST" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          items=d.get("clients") or d.get("items") or []
          hit=[c for c in items if c.get("slug")=="demo-musterbetrieb"]
          print(hit[0]["id"] if hit else "")
          ')
          curl -sS -o /dev/null -X PATCH "$API/clients/$KEEP" -H "x-admin-key: $KEY" -H 'content-type: application/json' -d '{"system_prompt": "Beispielbetrieb einer Dachdeckerei und Zimmerei in Heinsberg. Leistungen: Dachsanierung, Flachdach, Terrassenpflasterung, Balkonabdichtung, Dachfenster. Einzugsgebiet Heinsberg, Aachen, Erkelenz, Wegberg. Meisterbetrieb, Rueckruf Mo-Sa 8-19 Uhr, kostenlose Erstbesichtigung vor Ort, Angebot innerhalb von zwei Werktagen.", "business_context": "Beispielbetrieb einer Dachdeckerei und Zimmerei in Heinsberg. Leistungen: Dachsanierung, Flachdach, Terrassenpflasterung, Balkonabdichtung, Dachfenster. Einzugsgebiet Heinsberg, Aachen, Erkelenz, Wegberg. Meisterbetrieb, Rueckruf Mo-Sa 8-19 Uhr, kostenlose Erstbesichtigung vor Ort, Angebot innerhalb von zwei Werktagen."}'
          echo "demo-kontext aktualisiert fuer $KEEP"
          AFTER=$(curl -sS "$API/clients" -H "x-admin-key: $KEY")
          printf '%s' "$AFTER" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          items=d.get("clients") or d.get("items") or []
          print("nachher:", len(items))
          for c in items:
              print("  ", c.get("slug"), "|", c.get("demo_path"))
          '
          EOS
