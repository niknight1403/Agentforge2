name: Lead Responder - Retry Ende pruefen
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Automatischer Cron-Retry ohne manuellen Scan
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ServerAliveInterval=20 ubuntu@92.5.177.159 'sudo bash -s' <<'EOS'
          set -uo pipefail
          APP=/opt/lead-responder
          KEY=$(grep -m1 '^ADMIN_API_KEY=' "$APP/.env" | cut -d= -f2-)
          API=http://127.0.0.1:8080/api/v1
          j() { python3 -c "import json,sys;d=json.load(sys.stdin);print($1)" 2>/dev/null || echo PARSE_ERROR; }
          echo "== T0 =="
          curl -sS "$API/health" | j '"cycles="+str(d["scheduler"]["cycles"])+" last_run="+str(d["scheduler"]["last_run"])'
          C=$(curl -sS -X POST "$API/clients" -H "x-admin-key: $KEY" -H 'content-type: application/json' -d '{"name":"Retry Auto","system_prompt":"Testbetrieb.","webhook_outbound_url":"https://httpbin.org/status/500"}')
          CID=$(printf '%s' "$C" | j 'd["client"]["id"]')
          CK=$(printf '%s' "$C" | j 'd["api_key"]')
          L=$(curl -sS -m 40 -X POST "$API/lead/inbound" -H "x-api-key: $CK" -H 'content-type: application/json' -d '{"name":"Auto Retry","email":"auto@example.com","inquiry":"Dachrinne erneuern, Aachen."}')
          LID=$(printf '%s' "$L" | j 'd["lead_id"]')
          printf '%s' "$L" | j '"lead="+d["lead_id"]+" | status="+str(d.get("status"))+" delivered="+str(d.get("delivered"))'
          curl -sS "$API/admin/deliveries?lead_id=$LID&limit=2" -H "x-admin-key: $KEY" | j '"erwartet: "+str([(e["type"],e["detail"].get("next_attempt_at")) for e in d["events"]][:1])'
          echo "== warte 11 Minuten auf automatische Cron-Zyklen (KEIN admin/scan in dieser Zeit) =="
          sleep 660
          echo "== T0+11min =="
          curl -sS "$API/health" | j '"cycles="+str(d["scheduler"]["cycles"])+" last_run="+str(d["scheduler"]["last_run"])+" last_error="+str(d["scheduler"]["last_error"])'
          curl -sS "$API/leads/$LID" -H "x-admin-key: $KEY" | j '"status="+str(d["lead"]["status"])+" attempts="+str(d["lead"].get("attempts"))+" next_attempt_at="+str(d["lead"].get("next_attempt_at"))'
          echo "== Ereignisverlauf (ohne manuellen Scan) =="
          curl -sS "$API/admin/deliveries?lead_id=$LID&limit=10" -H "x-admin-key: $KEY" | j '"total="+str(d["total"])+"\n"+"\n".join("  "+e["type"]+" @"+e["created_at"]+" wait="+str(e["detail"].get("wait_ms")) for e in d["events"])'
          curl -sS -o /dev/null -X DELETE "$API/clients/$CID" -H "x-admin-key: $KEY"; echo "verify-client geloescht"
          EOS
