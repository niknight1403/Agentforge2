name: Verified Reference APK

on:
  push:
    branches: [main]
    paths:
      - 'reference-product/**'
      - 'villa-apk-template/**'
      - '.github/workflows/reference-apk.yml'
  pull_request:
    paths:
      - 'reference-product/**'
      - 'villa-apk-template/**'
      - '.github/workflows/reference-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test offline product model
        run: node --test reference-product/tests/*.test.mjs
      - name: Validate actual product entry point
        run: |
          test -s reference-product/www/index.html
          test -s reference-product/www/model.mjs
          test -s reference-product/www/app.mjs
          grep -q 'task-form' reference-product/www/index.html
          grep -q 'localStorage' reference-product/www/app.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
      - name: Package actual offline app into Android WebView
        run: |
          node reference-product/bundle.mjs
          node --check reference-product/www/app.bundle.js
          cp -R reference-product/www/. villa-apk-template/app/src/main/assets/www/
          sed -i 's/VILLA_APP_NAME/Villa Tasks/g' villa-apk-template/app/src/main/res/values/strings.xml
          test -s villa-apk-template/app/src/main/assets/www/index.html
          test -s villa-apk-template/app/src/main/assets/www/app.bundle.js
      - name: Build installable APK
        run: gradle -p villa-apk-template :app:assembleDebug --no-daemon --console=plain -PvillaId=9001
      - name: Verify APK archive, Android manifest, bytecode and local assets
        run: |
          python3 - <<'PY'
          import zipfile, os
          f='villa-apk-template/app/build/outputs/apk/debug/app-debug.apk'
          assert os.path.getsize(f)>10000, 'APK empty or too small'
          with zipfile.ZipFile(f) as z:
              names=set(z.namelist())
              required={'AndroidManifest.xml','classes.dex','assets/www/index.html','assets/www/app.bundle.js'}
              missing=required-names
              assert not missing, f'Missing real APK entries: {missing}'
              assert z.testzip() is None, 'APK ZIP integrity failure'
              assert b'task-form' in z.read('assets/www/index.html'), 'Product UI missing'
              assert b'function addTask' in z.read('assets/www/app.bundle.js'), 'Functional bundled app missing'
          print('APK verified:',os.path.getsize(f),'bytes')
          PY
          sha256sum villa-apk-template/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable hardware acceleration for Android emulator
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; else echo 'KVM unavailable; emulator may use software acceleration'; fi
      - name: Install and launch APK in a real Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_3a
          script: |
            set -e
            adb install -r villa-apk-template/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n dev.villaforge.villa9001/dev.villaforge.wrapper.MainActivity
            sleep 8
            adb shell pidof dev.villaforge.villa9001 | grep -Eq '^[0-9]+'
            echo 'ANDROID_EMULATOR_SMOKE_PASSED'
      - uses: actions/upload-artifact@v7
        with:
          name: villa-tasks-reference-apk
          path: villa-apk-template/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish independently verifiable reference APK as durable GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=villa-apk-template/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          TAG="villa-tasks-reference-${GITHUB_RUN_ID}"
          OUT="VillaTasks-Reference-${GITHUB_RUN_ID}.apk"
          cp "$APK" "$OUT"
          cat > /tmp/reference-notes.md <<EOF
          Offlinefaehige Villa Tasks Referenz-App mit lokaler Datenspeicherung.
          Gebaut und ueberprueft im GitHub Actions Workflow ${GITHUB_RUN_ID}.
          SHA-256: ${SHA}

          Nachgewiesen: Unit-Tests, Gradle-Build, APK-Archiv, Manifest, DEX und eingebettete Produktdateien.
          Nachgewiesen: Emulator-Installation und Start der Hauptaktivitaet.
          Nicht nachgewiesen: autonomer Prompt-zu-Villa-Live-Lauf oder Test auf einem physischen Android-Geraet.
          Debug-signierte Test-APK; kein Play-Store-Produktionsrelease.
          EOF
          gh release create "$TAG" "$OUT" --title "Villa Tasks – verifizierte Referenz-APK (${GITHUB_RUN_ID})" --notes-file /tmp/reference-notes.md

