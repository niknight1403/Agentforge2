name: Villa-APK Baustrasse

# Phase 2 des Studio-Konzepts (AgentForge docs/studio-konzept.md):
# Baut das Web-Produkt einer Villa in ein installierbares Android-APK.
# Nutzt das Hub-Build-Artefakt (GET /api/villas/{id}/build/download),
# richtet einen lauffaehigen Web-Root, generiert ein App-Icon via
# Pollinations und wrapped alles im villa-apk-template (WebView-Shell).
# Ergebnis: Debug-signiertes APK als Workflow-Artefakt + GitHub-Release.

on:
  workflow_dispatch:
    inputs:
      villa_id:
        description: "Villa-ID im Hub (z. B. 12)"
        required: true
      app_name:
        description: "Anzeigename der App (leer = Villa-Name aus dem Hub)"
        required: false

permissions:
  contents: write

jobs:
  villa-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Villa-Daten vom Hub laden (Login, Name, Build-Artefakt)
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
          VILLA_ID: ${{ inputs.villa_id }}
        run: node scripts/fetch-villa-build.mjs

      - name: Web-Root fuer das APK herrichten
        run: |
          WWW=villa-apk-template/app/src/main/assets/www
          rm -f $WWW/index.html
          if [ -f /tmp/villa.zip ] && [ "$(stat -c%s /tmp/villa.zip)" -gt 100 ]; then
            mkdir -p /tmp/art && unzip -qo /tmp/villa.zip -d /tmp/art
            IDX=$(find /tmp/art -maxdepth 3 -name index.html | head -1)
            if [ -n "$IDX" ]; then
              echo "Nutze Web-Root: $IDX"
              cp -r "$(dirname "$IDX")"/. $WWW/
            else
              PKG=$(find /tmp/art -maxdepth 2 -name package.json | head -1)
              if [ -n "$PKG" ]; then
                cd "$(dirname "$PKG")"
                echo "Baue npm-Projekt: $(pwd)"
                npm install --no-audit --no-fund >/dev/null 2>&1 || true
                npm run build >/dev/null 2>&1 || true
                DIST=$(find . -maxdepth 3 -type d -name dist | head -1)
                [ -z "$DIST" ] && DIST=$(find . -maxdepth 3 -type d -name build | head -1)
                if [ -n "$DIST" ] && [ -f "$DIST/index.html" ]; then
                  echo "Nutze Build-Output: $DIST"
                  cp -r "$DIST"/. "$GITHUB_WORKSPACE/$WWW/"
                fi
              fi
            fi
          fi
          test -s "$WWW/index.html" || { echo "Kein lauffaehiges Villa-Webprodukt; APK-Release blockiert"; exit 1; }
          ls "$WWW" | head -5

      - name: App-Name setzen, Icon-URL und Landing-Fallback vorbereiten
        env:
          VILLA_NAME: ${{ env.VILLA_NAME }}
          APP_NAME: ${{ inputs.app_name }}
        run: python3 scripts/villa_apk_prepare.py

      - name: App-Icon generieren (Pollinations)
        run: |
          curl -s -m 60 -o /tmp/icon.png "$(cat /tmp/icon_url.txt)" || true
          if [ -s /tmp/icon.png ] && file /tmp/icon.png 2>/dev/null | grep -qiE "PNG|JPEG"; then
            cp /tmp/icon.png villa-apk-template/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "Pollinations-Icon gesetzt ($(stat -c%s /tmp/icon.png) Bytes)"
          else
            echo "Pollinations nicht erreichbar - Neon-Platzhalter-Icon bleibt"
          fi

      - name: APK bauen (WebView-Wrapper, Debug-signiert)
        env:
          VILLA_ID: ${{ inputs.villa_id }}
        run: |
          cd villa-apk-template
          gradle :app:assembleDebug --no-daemon --stacktrace -PvillaId=$VILLA_ID
          ls app/build/outputs/apk/debug/

      - name: APK umbenennen
        env:
          APP_NAME: ${{ inputs.app_name }}
          VILLA_ID: ${{ inputs.villa_id }}
          VILLA_NAME: ${{ env.VILLA_NAME }}
        run: |
          APP="$APP_NAME"; [ -z "$APP" ] && APP="$VILLA_NAME"
          export APP
          SLUG=$(python3 -c "import re,os; print(re.sub(r'[^a-z0-9]+','-',os.environ['APP'].lower()).strip('-')[:30])")
          TAG="villa-$VILLA_ID-$(date +%Y%m%d)"
          OUT="Villa${VILLA_ID}-${SLUG}.apk"
          cp villa-apk-template/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "OUT=$OUT" >> $GITHUB_ENV
          echo "APK: $OUT ($(stat -c%s $OUT) Bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: villa-apk-${{ inputs.villa_id }}
          path: Villa${{ inputs.villa_id }}-*.apk
          if-no-files-found: error

      - name: GitHub-Release mit APK anlegen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.TAG }}
          OUT: ${{ env.OUT }}
          VILLA_NAME: ${{ env.VILLA_NAME }}
        run: |
          gh release create "$TAG" "$OUT" --title "Villa ${{ inputs.villa_id }}: $VILLA_NAME" --notes "Installierbares APK des Villa-Produkts '$VILLA_NAME' aus dem VillaForge Studio (Phase 2). WebView-Wrapper, Debug-signiert." || echo "Release vorhanden oder fehlgeschlagen - APK liegt als Workflow-Artefakt"
