name: Villa-Prompt-Agent (Ideen -> Qualitaets-Prompts)
on:
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Bestehende Missionsvorschlaege erneuern (Originalidee und Vision bleiben erhalten)'
        required: false
        default: 'false'
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: villa-prompt-refinement
  cancel-in-progress: false
jobs:
  prompt_agent:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Missionsvorschlaege ueber bestehende Hub-Kaskade verfeinern
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          REFRESH: ${{ github.event.inputs.refresh_all || 'false' }}
        run: |
          set -euo pipefail
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -i "$keyfile" ubuntu@92.5.177.159 "sudo REFRESH='$REFRESH' bash -s" <<'EOS'
          set -euo pipefail
          cd /opt/villaforge
          test -f server/scripts/refine-villa-prompts.mjs || { echo 'Prompt-Modul noch nicht deployed; keine direkte Ersatzkaskade gestartet.'; exit 1; }
          args=()
          [ "$REFRESH" = true ] && args+=(--refresh)
          node server/scripts/refine-villa-prompts.mjs "${args[@]}"
          EOS
