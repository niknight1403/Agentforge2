name: villa31-Team-SQL

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Team und Aufgaben per SQL
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'echo "" | base64 -d > /tmp/v31.sql; sudo sqlite3 /opt/villaforge/server/data/villaforge.db < /tmp/v31.sql; echo "--- Agenten:"; sudo sqlite3 /opt/villaforge/server/data/villaforge.db "SELECT role||\":\"||COUNT(*) FROM agents WHERE villa_id=31 GROUP BY role"; echo "--- Aufgaben:"; sudo sqlite3 /opt/villaforge/server/data/villaforge.db "SELECT status||\"=\"||COUNT(*) FROM tasks WHERE villa_id=31 GROUP BY status"; sudo systemctl restart villaforge-hub; sleep 6; echo "--- Hub:"; systemctl is-active villaforge-hub'
