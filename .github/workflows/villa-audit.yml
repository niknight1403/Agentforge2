name: Villa-Audit v3 (Task-Status + Spammer)
on:
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Task-Verteilung und Spammer-Identifikation
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          echo "== Spammer-Prozess 2900428 =="
          systemctl status 2900428 2>/dev/null | head -3 || ps -p 2900428 -o pid,cmd --no-headers 2>/dev/null || echo "Prozess weg"
          echo "== Letzte Syslog-Zeilen (Muster) =="
          tail -c 200000 /var/log/syslog | grep "node\[" | tail -3 | cut -c1-200
          echo "== Task-Status-Verteilung =="
          python3 - <<'PYV'
          import sqlite3
          con = sqlite3.connect("/opt/villaforge/server/data/villaforge.db")
          cur = con.cursor()
          print("TASKS:", cur.execute("SELECT status, COUNT(*) FROM tasks GROUP BY status ORDER BY 2 DESC").fetchall())
          print("VILLAS:", cur.execute("SELECT id, name, status, autonomy FROM villas ORDER BY id").fetchall())
          print("PROPOSALS:", cur.execute("SELECT status, COUNT(*) FROM villa_proposals GROUP BY status").fetchall())
          print("TASKS-ALTER: <24h aktiv:", cur.execute("SELECT COUNT(*) FROM tasks WHERE updated_at > datetime('now','-1 day')").fetchone()[0])
          print("OFFEN ALT>48h:", cur.execute("SELECT COUNT(*) FROM tasks WHERE status IN ('pending','in_progress','assigned') AND updated_at < datetime('now','-2 days')").fetchone()[0])
          PYV
          echo "== Loop-Guard Zwangs-Lauf =="
          bash -c 'STATE_DIR=/var/lib/loop-guard LOG=/var/log/loop-guard.log; echo "manueller Check um $(date -u +%FT%TZ)" >> $LOG; df -h / | tail -1'
          echo "== Syslog-Groesse =="
          ls -la /var/log/syslog | awk '{print $5}'
          EOS
