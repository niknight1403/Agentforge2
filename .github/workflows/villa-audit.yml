name: Villa-Audit (Alle Villen + Aufgaben)
on:
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Villen-Stand auf der VM pruefen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          echo "== Hub-Layout =="
          ls /opt/villaforge/server/src 2>/dev/null | head -12 || ls /opt/villaforge/server 2>/dev/null | head -12
          echo "== API-Routen =="
          grep -rhoE '"/api/[a-z0-9/_:-]+"' /opt/villaforge/server/src 2>/dev/null | tr -d '"' | sort -u | head -40
          grep -rhoE "'/api/[a-z0-9/_:-]+'" /opt/villaforge/server/src 2>/dev/null | tr -d "'" | sort -u | head -40
          echo "== Villa-DB =="
          ls -la /opt/villaforge/server/data/ 2>/dev/null | head -8
          find /opt/villaforge -maxdepth 3 -name "*.db" -o -maxdepth 3 -name "*.sqlite*" 2>/dev/null | head -5
          echo "== Hub-Login-Test =="
          TOK=$(curl -s -m 10 -X POST http://127.0.0.1:12000/api/auth/login -H "Content-Type: application/json" -d '{"email":"niko.oeben@gmail.com","password":"Niko6529!"}' | head -c 400)
          printf "%s" "$TOK" | head -c 200; echo
          echo "== Scheduler-Status =="
          curl -s -m 10 http://127.0.0.1:12000/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({k:d[k] for k in list(d)[:8]}, indent=1)[:600])" 2>/dev/null || true
          echo "== Hub-Version =="
          curl -s -m 8 http://127.0.0.1:12000/api/version 2>/dev/null | head -c 200; echo
          echo "== Syslog-Rate (10s) =="
          S1=$(stat -c %s /var/log/syslog); sleep 10; S2=$(stat -c %s /var/log/syslog); echo "Delta: $(( S2 - S1 )) Bytes"
          EOS
