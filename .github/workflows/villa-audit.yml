name: Villa-Audit v2 (Spam + DB + LLM)
on:
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Tiefenpruefung
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          echo "== SPAMMER JETZT =="
          tail -c 400000 /var/log/syslog | grep -oE "[A-Za-z0-9._-]+\[[0-9]+\]" | sort | uniq -c | sort -rn | head -4
          tail -1 /var/log/syslog | cut -c1-260
          echo "== Loop-Guard-Log (letzte 5) =="
          tail -5 /var/log/loop-guard.log 2>/dev/null || echo "kein Guard-Log"
          echo "== cybersarah-ccc Restarts =="
          systemctl show cybersarah-ccc -p NRestarts -p ExecMainStartTimestamp
          echo "== Hub ExecStart =="
          systemctl cat villaforge-hub 2>/dev/null | grep -E "ExecStart|WorkingDirectory" | head -3
          echo "== Hub-API-Routen =="
          HUBJS=$(systemctl cat villaforge-hub 2>/dev/null | grep ExecStart | grep -oE "/[^ ]+\.js" | head -1)
          [ -n "$HUBJS" ] && grep -ohE "/api/[a-z0-9/_:-]+" "$HUBJS" 2>/dev/null | sort -u | head -30 || true
          echo "== Villa-DB: Tabellen =="
          python3 - <<'PYV'
          import sqlite3
          con = sqlite3.connect("/opt/villaforge/server/data/villaforge.db")
          cur = con.cursor()
          tabs = [r[0] for r in cur.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").fetchall()]
          print("Tabellen:", ", ".join(tabs))
          for t in tabs:
              if any(k in t.lower() for k in ("villa", "task", "agent", "draft", "job", "queue")):
                  n = cur.execute("SELECT COUNT(*) FROM " + t).fetchone()[0]
                  print("-- " + t + ": " + str(n) + " Zeilen")
                  cols = [d[1] for d in cur.execute("PRAGMA table_info(" + t + ")").fetchall()]
                  print("   Spalten:", ", ".join(cols[:14]))
                  for row in cur.execute("SELECT * FROM " + t + " ORDER BY rowid DESC LIMIT 4").fetchall():
                      print("   ", str(row)[:240])
          PYV
          EOS
