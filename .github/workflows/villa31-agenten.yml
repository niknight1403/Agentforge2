name: villa31-Agenten

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Agenten anlegen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'echo "" | base64 -d > /tmp/a31.sql; sudo sqlite3 -bail /opt/villaforge/server/data/villaforge.db < /tmp/a31.sql; echo AGENTEN; sudo sqlite3 /opt/villaforge/server/data/villaforge.db "SELECT COUNT(*) FROM agents WHERE villa_id=31"; echo AUFGABEN; sudo sqlite3 /opt/villaforge/server/data/villaforge.db "SELECT status, COUNT(*) FROM tasks WHERE villa_id=31 GROUP BY status"'
