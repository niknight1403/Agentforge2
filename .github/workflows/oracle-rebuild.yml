name: Oracle Rebuild
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'files oder api'
        default: 'files'
        required: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Setup
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd

      - name: Dateien und Dienste (files)
        if: ${{ github.event.inputs.mode == 'files' }}
        env:
          VF_HUBENV: ${{ secrets.VF_HUBENV }}
          VF_SYNCSRC: ${{ secrets.VF_SYNCSRC }}
        run: |
          printf '%s' "$VF_HUBENV" > /tmp/hub.env
          printf '%s' "$VF_SYNCSRC" > /tmp/villa-sync.mjs
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/hub.env /tmp/villa-sync.mjs ubuntu@92.5.177.159:/tmp/
          cat > /tmp/setup.sh <<'SETUP'
          set -e
          DEST=/opt/villaforge
          mkdir -p $DEST/workspace
          mv /tmp/hub.env $DEST/hub.env && chmod 600 $DEST/hub.env
          mv /tmp/villa-sync.mjs $DEST/villa-sync.mjs
          GT=$(grep ^GITHUB_TOKEN= $DEST/hub.env | cut -d= -f2)
          if [ ! -d $DEST/server ]; then
            VFSRC=$(mktemp -d)
            git clone -q https://x-access-token:${GT}@github.com/niknight1403/Agentforge2.git $VFSRC
            (cd $VFSRC && git archive origin/main server | tar -x -C $DEST)
          fi
          REPO=$DEST/workspace/cybersarah-control-center
          if [ ! -d $REPO/.git ]; then
            git clone -q https://x-access-token:${GT}@github.com/niknight1403/CyberSarah-Control-Center.git $REPO
          fi
          git -C $REPO config user.email villa@villaforge.local
          git -C $REPO config user.name "CyberSarah Villa"
          if [ ! -d $REPO/node_modules ] || [ ! -f $REPO/node_modules/.package-lock.json ]; then
            (cd $REPO && npm install --no-audit --no-fund >/tmp/npm.log 2>&1) || tail -n 20 /tmp/npm.log
          fi
          cat > /etc/systemd/system/villaforge-sync.service <<UNIT2
          [Unit]
          Description=VillaForge AutoDev Sync
          After=villaforge.service network-online.target
          [Service]
          Type=oneshot
          ExecStart=$(command -v node) $DEST/villa-sync.mjs
          TimeoutStartSec=25min
          UNIT2
          cat > /etc/systemd/system/villaforge-sync.timer <<UNIT3
          [Unit]
          Description=VillaForge AutoDev Sync Takt
          [Timer]
          OnBootSec=3min
          OnUnitActiveSec=10min
          [Install]
          WantedBy=timers.target
          UNIT3
          systemctl daemon-reload
          systemctl restart villaforge
          OK=0
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:12000/api/health >/dev/null 2>&1 && OK=1 && break
            sleep 2
          done
          if [ "$OK" = 1 ]; then echo HUB-LOKAL-OK; else echo HUB-NICHT-DA; systemctl status villaforge --no-pager -l | head -20; exit 1; fi
          systemctl enable --now villaforge-sync.timer
          echo FILES-FERTIG
          SETUP
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/setup.sh ubuntu@92.5.177.159:/tmp/setup.sh
          bash /tmp/sshcmd "sudo bash /tmp/setup.sh"

      - name: Hub-Code aktualisieren (update)
        if: ${{ github.event.inputs.mode == 'update' }}
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd
          cat > /tmp/hubupdate.sh <<'UPD'
          set -e
          # Hub-Verzeichnis aus der systemd-Unit bestimmen (ExecStart-Pfad).
          EXEC=$(systemctl show villaforge -p ExecStart --value 2>/dev/null | grep -oE '/[^ ]*server\.mjs' | head -1 || true)
          HUBDIR=$(dirname "${EXEC:-/opt/villaforge/server/server.mjs}")
          # Unit-Namen ermitteln (heisst nicht überall villaforge.service).
          UNIT=$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -iE '^(hub|villaforge)' | head -1 || true)
          UNIT=${UNIT:-villaforge.service}
          echo "== Unit: $UNIT =="
          cd "$(dirname "$HUBDIR")"
          if [ -d .git ]; then
            echo "== git pull in $PWD =="
            # Fix 2026-10-19: AgentForge ist PRIVAT - der Pull ohne Token scheiterte
            # still ('could not read Username'), der Restart lief auf ALTEN Code und
            # der Workflow meldete HUB-UPDATE-OK (Falsch-Gruen). Remote je Lauf mit
            # frischem PAT versehen und bei Pull-Fehler ABBERECHNEN statt false-green.
            git remote set-url origin "https://x-access-token:${GT}@github.com/niknight1403/AgentForge.git" 2>/dev/null || true
            if git fetch -q origin && git reset -q --hard origin/main && git log -1 --oneline; then
              echo "PULL-OK"
            else
              echo "PULL-FEHLER: Update abgebrochen (kein false-green Restart auf altem Code)."
              exit 1
            fi
          else
            echo "== kein Git-Klon in $PWD - Server-Code aus AgentForge ersetzen =="
            VFNEW=$(mktemp -d)
            git clone -q https://x-access-token:${GT}@github.com/niknight1403/AgentForge.git "$VFNEW/repo"
            rsync -a --delete --exclude data --exclude node_modules "$VFNEW/repo/server/" ./server/
          fi
          echo "== Lastbegrenzung fuer 4 Kerne / ein Ollama (Drop-in) =="
          mkdir -p "/etc/systemd/system/${UNIT}.d"
          cat > "/etc/systemd/system/${UNIT}.d/zz-load.conf" <<'LOADCONF'
          [Service]
          Environment="VF_LLM_MAX_CONCURRENT=2"
          Environment="VF_VILLA_SLOTS=5"
          Environment="VF_CMD_MAX_CONCURRENT=1"
          LOADCONF
          systemctl daemon-reload
          echo "== Hub neu starten =="
          systemctl restart "$UNIT"
          OK=0
          for i in $(seq 1 45); do
            sleep 2
            curl -sf -m 2 http://127.0.0.1:12000/api/health >/dev/null 2>&1 && OK=1 && break
          done
          if [ "$OK" = 1 ]; then echo HUB-UPDATE-OK; else
            echo HUB-NICHT-DA
            journalctl -u "$UNIT" -n 25 --no-pager || true
            systemctl status "$UNIT" --no-pager -l | head -20
            exit 1
          fi
          UPD
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/hubupdate.sh ubuntu@92.5.177.159:/tmp/hubupdate.sh
          bash /tmp/sshcmd "sudo GT=$GT bash /tmp/hubupdate.sh"
      - name: Ollama neu starten (ollama-restart)
        if: ${{ github.event.inputs.mode == 'ollama-restart' }}
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          cat > /tmp/ollrestart.sh <<'RST'
          echo "== Ollama-Dienst auf 4 ARM-Kerne abstimmen (1 parallel, ein Modell geladen) =="
          mkdir -p /etc/systemd/system/ollama.service.d
          cat > /etc/systemd/system/ollama.service.d/zz-tuning.conf <<'DROPIN'
          [Service]
          Environment="OLLAMA_NUM_PARALLEL=1"
          Environment="OLLAMA_MAX_LOADED_MODELS=1"
          Environment="OLLAMA_KEEP_ALIVE=30m"
          Environment="OLLAMA_MAX_QUEUE=8"
          DROPIN
          systemctl daemon-reload
          echo "== Vorher: ollama ps =="; ollama ps 2>&1 | head -5
          echo "== Haengende Runner beenden und Dienst neu starten =="
          systemctl stop ollama || true
          pkill -9 -f llama-server || true
          sleep 3
          systemctl start ollama
          for i in $(seq 1 30); do curl -sf -m 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break; sleep 2; done
          echo "== Modell warm laden + Antwortzeit =="
          curl -s -m 120 -w "\nHTTP %{http_code} in %{time_total}s\n" http://127.0.0.1:11434/api/generate -d '{"model":"llama3.2:3b","prompt":"Sag nur: ok","stream":false,"keep_alive":"30m","options":{"num_predict":6}}' | tail -c 300
          echo "== Zweite Anfrage (warm) =="
          curl -s -m 60 -w "\nHTTP %{http_code} in %{time_total}s\n" http://127.0.0.1:11434/api/generate -d '{"model":"llama3.2:3b","prompt":"Nenne eine Farbe.","stream":false,"keep_alive":"30m","options":{"num_predict":10}}' | tail -c 300
          echo "== Nachher: Last =="; uptime
          RST
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/ollrestart.sh ubuntu@92.5.177.159:/tmp/ollrestart.sh
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash /tmp/ollrestart.sh"
      - name: LLM-Kette reparieren (llm-fix)
        if: ${{ github.event.inputs.mode == 'llm-fix' }}
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          VF_GEMINI_KEY: ${{ secrets.VF_GEMINI_KEY }}
          VF_HFTOKEN: ${{ secrets.VF_HFTOKEN }}
          VF_OPENROUTER_KEY: ${{ secrets.VF_OPENROUTER_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd
          cat > /tmp/llmfix.mjs << 'EOF'
          import { DatabaseSync } from 'node:sqlite';
          import { readFileSync } from 'node:fs';
          const K = JSON.parse(readFileSync('/tmp/vfkeys.json', 'utf8'));
          const db = new DatabaseSync('/opt/villaforge/server/data/villaforge.db');
          const t = Date.now();
          for (const [name, value] of Object.entries(K)) {
            if (!value) continue;
            db.prepare('INSERT INTO secrets (name, value, updated_at) VALUES (?,?,?) ON CONFLICT(name) DO UPDATE SET value=excluded.value, updated_at=excluded.updated_at').run(name, value, t);
          }
          const gem = db.prepare("SELECT id FROM routes WHERE name LIKE '%Gemini%' OR provider='gemini'").get();
          if (gem) {
            db.prepare('UPDATE routes SET base_url=?, model=?, key_env=?, provider=?, priority=2, enabled=1, fail=0, cooldown_until=0, status=? WHERE id=?')
              .run('https://generativelanguage.googleapis.com/v1beta/openai', 'gemini-flash-lite-latest', 'GEMINI_API_KEY', 'gemini', 'ACTIVE', gem.id);
          } else {
            db.prepare('INSERT INTO routes (name, provider, base_url, model, key_env, is_free, enabled, priority, status) VALUES (?,?,?,?,?,1,1,2,?)')
              .run('Gemini Flash Lite (free tier)', 'gemini', 'https://generativelanguage.googleapis.com/v1beta/openai', 'gemini-flash-lite-latest', 'GEMINI_API_KEY', 'ACTIVE');
          }
          if (K.HF_TOKEN) {
            const hf = db.prepare("SELECT id FROM routes WHERE provider='huggingface' OR name LIKE '%Hugging%'").get();
            if (hf) db.prepare('UPDATE routes SET key_env=?, enabled=1, fail=0, cooldown_until=0, status=? WHERE id=?').run('HF_TOKEN', 'ACTIVE', hf.id);
          }
          db.prepare('UPDATE routes SET cooldown_until=0, fail=0').run();
          const rows = db.prepare('SELECT id, name, provider, model, priority, key_env, enabled, fail FROM routes ORDER BY priority').all();
          const stored = db.prepare('SELECT name FROM secrets').all().map(r => r.name);
          console.log('ROUTES ' + JSON.stringify(rows));
          console.log('SECRETS ' + JSON.stringify(stored));
          EOF
          python3 -c 'import json,os; json.dump({"GEMINI_API_KEY":os.environ.get("VF_GEMINI_KEY",""),"HF_TOKEN":os.environ.get("VF_HFTOKEN",""),"OPENROUTER_API_KEY":os.environ.get("VF_OPENROUTER_KEY","")}, open("/tmp/vfkeys.json","w"))'
          scp -q -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/llmfix.mjs /tmp/vfkeys.json ubuntu@92.5.177.159:/tmp/
          chmod +x /tmp/sshcmd && /tmp/sshcmd "sudo node /tmp/llmfix.mjs"
          echo "LLM-FIX-DURCH"
      - name: Ollama-Ist-Zustand (ollama-peek)
        if: ${{ github.event.inputs.mode == 'ollama-peek' }}
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd
          bash /tmp/sshcmd "sudo bash -c '
            echo \"== Ollama-Units ==\"; systemctl list-units \"*ollama*\" --no-legend --all 2>/dev/null
            echo \"== Unit-Env ==\"; cat /etc/systemd/system/ollama.service.d/*.conf 2>/dev/null | grep -v PASSWORD
            echo \"== Ports ==\"; ss -ltnp | grep -E \"11434|11435\" || echo keine
            echo \"== Nginx Ollama-Site ==\"; grep -rn \"11434\|ollama\|proxy_pass\|limit_req\" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null | grep -v \"#\" | head -30
            echo \"== RAM/Modelle ==\"; free -h | head -2; curl -s -m 5 http://127.0.0.1:11434/api/tags | head -c 600
          '"
      - name: Ollama-Isolation (ollama-isolate)
        if: ${{ github.event.inputs.mode == 'ollama-isolate' }}
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd

          cat > /tmp/isolate.sh << 'ISO'
          #!/bin/bash
          set -e
          echo "== 1) Externe Ollama-Instanz (Port 11435) anlegen =="
          cat > /etc/systemd/system/ollama-ext.service << 'UNIT'
          [Unit]
          Description=Ollama fuer EXTERNE Projekte (isoliert, Port 11435, nur llama3.2:3b)
          After=network-online.target
          [Service]
          ExecStart=/usr/local/bin/ollama serve
          User=ollama
          Group=ollama
          Environment=OLLAMA_HOST=127.0.0.1:11435
          Environment=OLLAMA_MODELS=/usr/share/ollama/.ollama-ext
          Environment=OLLAMA_NUM_PARALLEL=1
          Environment=OLLAMA_MAX_QUEUE=8
          Environment=OLLAMA_MAX_LOADED_MODELS=1
          Environment=OLLAMA_KEEP_ALIVE=15m
          Environment=OLLAMA_FLASH_ATTENTION=1
          Restart=always
          RestartSec=5
          MemoryMax=6G
          [Install]
          WantedBy=multi-user.target
          UNIT
          echo "== 2) Modell-Store der externen Instanz: NUR llama3.2:3b kopieren =="
          M=/usr/share/ollama/.ollama/models
          E=/usr/share/ollama/.ollama-ext
          mkdir -p $E/blobs $E/manifests/registry.ollama.ai/library
          cp -r $M/manifests/registry.ollama.ai/library/llama3.2 $E/manifests/registry.ollama.ai/library/ 2>/dev/null || true
          for MF in $(find $E/manifests/registry.ollama.ai/library/llama3.2 -type f 2>/dev/null); do
            for D in $(grep -o 'sha256:[a-f0-9]*' "$MF" | sort -u); do
              BLOB=$(echo "$D" | sed 's/sha256:/sha256-/')
              cp -n "$M/blobs/$BLOB" "$E/blobs/" 2>/dev/null || echo "Blob fehlt: $BLOB"
            done
            ls -la $E/blobs/ | head -8
          done
          chown -R ollama:ollama $E
          systemctl daemon-reload
          systemctl enable --now ollama-ext.service
          sleep 8
          echo "== 3) Nginx: ollama.cybersarah-ki.com auf die externe Instanz umleiten =="
          SITE=$(grep -rl 'ollama.cybersarah-ki.com' /etc/nginx 2>/dev/null | head -1)
          echo "Site-Datei: $SITE"
          if [ -n "$SITE" ]; then
            cp "$SITE" "$SITE.bak-11435"
            sed -i 's|127.0.0.1:11434|127.0.0.1:11435|g' "$SITE"
            nginx -t
            systemctl reload nginx
          else
            echo "WARNUNG: keine Nginx-Site-Datei gefunden - Proxy unveraendert!"
          fi
          echo "== 4) Watchdog: verklemmte Instanzen automatisch neu starten =="
          cat > /usr/local/bin/ollama-guard.sh << 'GUARD'
          #!/bin/bash
          # Ollama-Guard: Probe je Instanz; zwei Fehlschlaege nacheinander => Neustart.
          probe() {
            local PORT=$1 UNIT=$2 R
            R=$(curl -s -m 40 -o /dev/null -w '%{http_code}' http://127.0.0.1:$PORT/api/generate \
              -d '{"model":"llama3.2:3b","prompt":"ping","stream":false,"options":{"num_predict":1}}' 2>/dev/null)
            local ST=/tmp/ollama-guard.$PORT
            if [ "$R" = "200" ]; then echo 0 > "$ST"; return; fi
            echo $(( $(cat "$ST" 2>/dev/null || echo 0) + 1 )) > "$ST"
            if [ "$(cat "$ST")" -ge 2 ]; then
              logger -t ollama-guard "Port $PORT haengt (Probe: '$R') - Neustart $UNIT"
              systemctl restart "$UNIT"; echo 0 > "$ST"
            fi
          }
          probe 11434 ollama.service
          probe 11435 ollama-ext.service
          GUARD
          chmod +x /usr/local/bin/ollama-guard.sh
          cat > /etc/systemd/system/ollama-guard.service << 'GSVC'
          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/ollama-guard.sh
          GSVC
          cat > /etc/systemd/system/ollama-guard.timer << 'GTIM'
          [Timer]
          OnBootSec=5min
          OnUnitActiveSec=5min
          [Install]
          WantedBy=timers.target
          GTIM
          systemctl daemon-reload
          systemctl enable --now ollama-guard.timer
          echo "== 5) Hub-Routen: beide Ollama-Routen strikt lokal binden =="
          node -e "const {DatabaseSync}=require('node:sqlite');const db=new DatabaseSync('/opt/villaforge/server/data/villaforge.db');db.prepare(\"UPDATE routes SET base_url='http://127.0.0.1:11434/v1' WHERE provider='ollama'\").run();console.log('Hub-Ollama-Routen lokal gebunden')"
          echo "== 6) Verifikation =="
          systemctl is-active ollama.service ollama-ext.service ollama-guard.timer
          sleep 2; ss -ltn | grep -E '11434|11435'
          echo "Probe 11434:"; curl -s -m 60 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' http://127.0.0.1:11434/api/generate -d '{"model":"llama3.2:3b","prompt":"ping","stream":false,"options":{"num_predict":1}}'
          echo "Probe 11435:"; curl -s -m 60 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s\n' http://127.0.0.1:11435/api/generate -d '{"model":"llama3.2:3b","prompt":"ping","stream":false,"options":{"num_predict":1}}'
          echo "Modelle extern (nur 3b erlaubt):"; curl -s -m 10 http://127.0.0.1:11435/api/tags | head -c 300
          echo; echo "OLLAMA-ISOLATION-FERTIG"
          ISO

          scp -q -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/isolate.sh ubuntu@92.5.177.159:/tmp/isolate.sh
          bash /tmp/sshcmd "sudo bash /tmp/isolate.sh"

      - name: Villa-Wartung (villa-maint)
        if: ${{ github.event.inputs.mode == 'villa-maint' }}
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          cat > /tmp/maint.mjs << 'MAINT'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/opt/villaforge/server/data/villaforge.db');
          const norm = (x) => String(x || '').toLowerCase().replace(/\s+/g, ' ').trim();
          const villas = db.prepare('SELECT v.id, v.name, v.status, v.autonomy, v.created_at, substr(v.idea,1,90) pre, (SELECT COUNT(*) FROM tasks t WHERE t.villa_id = v.id AND t.status = \'DONE\') done, (SELECT COUNT(*) FROM tasks t WHERE t.villa_id = v.id) total FROM villas v ORDER BY v.id').all();
          console.log('VORHER:', JSON.stringify(villas.map(v => ({ id: v.id, name: v.name.slice(0,30), st: v.status, done: v.done, total: v.total }))));
          // Duplikate: gleicher normalisierter Name ODER identischer Idea-Anfang
          const groups = new Map();
          for (const v of villas) {
            const key1 = 'N:' + norm(v.name);
            const key2 = 'I:' + norm(v.pre);
            for (const k of [key1, key2]) {
              if (!groups.has(k)) groups.set(k, []);
              groups.get(k).push(v);
            }
          }
          const seen = new Set();
          const toDelete = new Set();
          for (const [key, list] of groups) {
            if (list.length < 2 || key.startsWith('I:') && norm(list[0].pre).length < 15) continue;
            const unique = list.filter(v => !seen.has(v.id));
            if (unique.length < 2) continue;
            // Behalten: fortschrittlichste Villa (done desc, dann aeltere id); Rest loeschen
            unique.sort((a, b) => b.done - a.done || b.total - a.total || a.id - b.id);
            const keep = unique[0];
            unique.slice(1).forEach(v => { toDelete.add(v.id); seen.add(v.id); });
            console.log('DUP-GRUPPE', JSON.stringify({ key: key.slice(0,40), keep: keep.id + ' (' + keep.done + ' done)', delete: unique.slice(1).map(v => v.id + ' (' + v.done + ' done)') }));
          }
          // Loeschen: ueber alle Tabellen mit villa_id-Spalte kaskadieren
          const tables = db.prepare("SELECT name FROM sqlite_master WHERE type='table'").all().map(r => r.name);
          for (const id of [...toDelete]) {
            for (const t of tables) {
              if (t === 'villas') continue;
              const cols = db.prepare('PRAGMA table_info(' + t + ')').all().map(c => c.name);
              if (cols.includes('villa_id')) db.prepare('DELETE FROM ' + t + ' WHERE villa_id = ?').run(id);
            }
            db.prepare('DELETE FROM villas WHERE id = ?').run(id); // die Villa-Zeile selbst
            console.log('GELOESCHT Villa', id);
          }
          const after = db.prepare('SELECT id, name, status FROM villas ORDER BY id').all();
          console.log('NACHHER:', JSON.stringify(after.map(v => ({ id: v.id, name: v.name.slice(0,30), st: v.status }))));
          MAINT
          scp -q -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/maint.mjs ubuntu@92.5.177.159:/tmp/maint.mjs

          cat > /tmp/slots.sh << 'SLOT'
          #!/bin/bash
          set -e
          HUBENV=/opt/villaforge/hub.env
          touch $HUBENV
          # 5 Villen parallel, je max 2 gleichzeitige LLM-Anfragen (bleibt unter Free-Tier-Budget)
          sed -i '/^VF_VILLA_SLOTS=/d; /^VF_MAX_CONCURRENCY=/d' $HUBENV
          echo "VF_VILLA_SLOTS=5" >> $HUBENV
          echo "VF_MAX_CONCURRENCY=2" >> $HUBENV
          chmod 600 $HUBENV
          grep -E "VF_VILLA_SLOTS|VF_MAX_CONCURRENCY" $HUBENV
          UNIT=$(ls /etc/systemd/system | grep -iE 'villaforge|hub' | grep service | head -1 | sed 's/.service$//')
          systemctl restart "$UNIT"
          sleep 6
          curl -sf -m 5 http://127.0.0.1:12000/api/health >/dev/null && echo SLOTS-NEUSTART-OK
          SLOT
          scp -q -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/slots.sh ubuntu@92.5.177.159:/tmp/slots.sh
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd
          bash /tmp/sshcmd "sudo node --input-type=module -e 'import(\"/tmp/maint.mjs\")'" || true
          bash /tmp/sshcmd "sudo bash /tmp/slots.sh"
      - name: Modelle + Fast-Route (pull)
        if: ${{ github.event.inputs.mode == 'pull' }}
        env:
          VF_HUBTOKEN: ${{ secrets.VF_HUBTOKEN }}
        run: |
          TOK="$VF_HUBTOKEN"
          ORACLE=http://92.5.177.159:12000
          echo "== Modell-Pulls starten (detached) =="
          bash /tmp/sshcmd "sudo bash -c 'nohup ollama pull llama3.1:8b >/tmp/pull-llama.log 2>&1 & nohup ollama pull qwen2.5-coder:3b >/tmp/pull-3b.log 2>&1 & echo PULLS-GESTARTET'"
          echo "== Fast-Route 3b registrieren =="
          cat > /tmp/r3.json <<'R3'
          {"name":"Ollama-Oracle-Fast (3b)","baseUrl":"http://127.0.0.1:11434/v1","model":"qwen2.5-coder:3b","keyEnv":"","priority":5}
          R3
          curl -s -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' --data @/tmp/r3.json $ORACLE/api/routes; echo
          echo "== Sync-Dienst-Status =="
          bash /tmp/sshcmd "sudo systemctl list-timers villaforge-sync.timer --no-pickle 2>/dev/null | head -3; sudo systemctl status villaforge-sync.service --no-pager -n 5 2>&1 | head -12"
          echo PULL-FERTIG
      - name: Korrekturen (fix)
        if: ${{ github.event.inputs.mode == 'fix' }}
        env:
          VF_HUBTOKEN: ${{ secrets.VF_HUBTOKEN }}
        run: |
          TOK="$VF_HUBTOKEN"
          ORACLE=http://92.5.177.159:12000
          NEW=http://167.233.118.190:12000
          echo "== Neue VPS-Villa stoppen =="
          curl -s -m 15 -X POST -H "Authorization: Bearer $TOK" $NEW/api/villas/1/stop; echo
          echo "== Ollama-Routen prio 5 =="
          curl -s -X DELETE -H "Authorization: Bearer $TOK" $ORACLE/api/routes/8; echo " (alte Offline-Route weg)"
          cat > /tmp/r1.json <<'R1'
          {"name":"Ollama-Oracle","baseUrl":"http://127.0.0.1:11434/v1","model":"qwen2.5-coder:7b","keyEnv":"","priority":5}
          R1
          cat > /tmp/r2.json <<'R2'
          {"name":"Ollama-Oracle-2 (llama)","baseUrl":"http://127.0.0.1:11434/v1","model":"llama3.1:8b","keyEnv":"","priority":5}
          R2
          curl -s -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' --data @/tmp/r1.json $ORACLE/api/routes; echo
          curl -s -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' --data @/tmp/r2.json $ORACLE/api/routes; echo
          echo "== Kontrolle Routen =="
          curl -s -H "Authorization: Bearer $TOK" $ORACLE/api/routes | python3 -c "import json,sys; [print(r['id'], r['name'][:40], 'prio', r['priority'], 'key', r['hasKey']) for r in json.load(sys.stdin)]"
          echo "== Kontrolle Villen =="
          curl -s -H "Authorization: Bearer $TOK" $ORACLE/api/villas | head -c 300; echo
          curl -s -H "Authorization: Bearer $TOK" $NEW/api/villas | head -c 300; echo
          echo FIX-FERTIG
      - name: Villa-Import und Start (api)
        if: ${{ github.event.inputs.mode == 'api' }}
        env:
          VF_HUBTOKEN: ${{ secrets.VF_HUBTOKEN }}
        run: |
          TOK="$VF_HUBTOKEN"
          ORACLE=http://92.5.177.159:12000
          NEW=http://167.233.118.190:12000
          echo "== 1) Neue VPS pausieren =="
          curl -s -m 15 -X PATCH -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{"status":"PAUSED"}' $NEW/api/villas/1 || echo PAUSE-VPS-FEHLER
          echo
          echo "== 2) Backup ziehen =="
          curl -sf -m 60 -H "Authorization: Bearer $TOK" $NEW/api/backup -o /tmp/backup.json && echo BACKUP-OK || { echo BACKUP-FEHLER; exit 1; }
          echo "== 3) Villa importieren =="
          VID=$(python3 - <<'PY'
          import json, urllib.request, os
          tok = os.environ['VF_HUBTOKEN']
          data = json.load(open('/tmp/backup.json'))
          last = None
          for el in data.get('villas', []):
              body = json.dumps(el).encode()
              req = urllib.request.Request('http://92.5.177.159:12000/api/villas/import', data=body, method='POST',
                  headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
              r = urllib.request.urlopen(req)
              res = json.load(r)
              last = res.get('villaId')
              print('importiert villa', el.get('villa', {}).get('name'), '-> id', last)
          open('/tmp/vid', 'w').write(str(last))
          PY
          )
          ID=$(cat /tmp/vid)
          echo "Neue Villa-ID: $ID"
          echo "== 4) Ollama-Route prio 5 =="
          curl -s -X POST -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' \
            -d '{"name":"Ollama-Oracle","base_url":"http://127.0.0.1:11434/v1","key_env":"","model":"qwen2.5-coder:7b","priority":5}' \
            $ORACLE/api/routes
          echo
          echo "== 5) villas.json + Start =="
          bash /tmp/sshcmd "sudo bash -c 'echo \"[{\\\"id\\\":$ID,\\\"repo\\\":\\\"/opt/villaforge/workspace/cybersarah-control-center\\\",\\\"testMs\\\":900000}]\" > /opt/villaforge/villas.json; echo $ID > /opt/villaforge/villa.id; cat /opt/villaforge/villas.json; echo; du -sh /opt/villaforge/workspace/cybersarah-control-center/node_modules 2>&1 | tail -1; ls /opt/villaforge/workspace/cybersarah-control-center/package.json'"
          curl -s -X PATCH -H "Authorization: Bearer $TOK" -H 'Content-Type: application/json' -d '{"status":"RUNNING"}' $ORACLE/api/villas/$ID
          echo
          curl -s -X POST -H "Authorization: Bearer $TOK" $ORACLE/api/villas/$ID/orchestrate
          echo
          echo "== 6) Kontrolle =="
          curl -s -H "Authorization: Bearer $TOK" $ORACLE/api/routes | head -c 600
          echo
          curl -s -H "Authorization: Bearer $TOK" $ORACLE/api/stats | head -c 400
          echo
          echo API-FERTIG
