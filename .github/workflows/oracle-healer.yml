name: Oracle-Healer
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oracle-healer
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Heilen (Hub-Check + Ollama-Prioritaet)
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STATE="down"
          VER="-"
          TUNE="-"
          # Login am Hub (Session-Token, v1.10-Auth) ueber HTTPS-Domain
          VF=$(curl -s -m 30 -X POST -H "Content-Type: application/json" \
            -d "{\"email\":\"$VF_ADMIN_EMAIL\",\"password\":\"$VF_ADMIN_PASSWORD\"}" \
            https://hub.cybersarah-ki.com/api/auth/login \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' 2>/dev/null || echo "")
          if [ -n "$VF" ]; then
            HEALTH=$(curl -s -m 60 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/health || true)
          else
            HEALTH=""
          fi
          if [ -n "$HEALTH" ]; then
            STATE="up"
            VER=$(echo "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version","?"))' 2>/dev/null || echo "?")
            ROUTES=$(curl -s -m 60 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/routes || true)
            IDS=$(echo "$ROUTES" | python3 -c 'import json,sys; rs=json.load(sys.stdin); print(" ".join(str(r["id"]) for r in rs if ("ollama" in r.get("base_url","").lower() or "11434" in r.get("base_url","") or "ollama" in r.get("name","").lower()) and r.get("priority",0) < 40))' 2>/dev/null || true)
            if [ -n "$IDS" ]; then
              for ID in $IDS; do
                curl -s -m 60 -X PATCH -H "Authorization: Bearer $VF" -H "Content-Type: application/json" -d '{"priority": 40}' "https://hub.cybersarah-ki.com/api/routes/$ID" > /dev/null || true
              done
              TUNE="getuned"
            else
              TUNE="ok"
            fi
            # Hinweis: Hub-Updates kommen per git pull beim Instanz-Bootstrap
            # (Cloud-Init klon AgentForge main); kein Rebuild-Dispatch mehr noetig.
          fi
          echo "HEALTH=$STATE VER=$VER TUNE=$TUNE"
          printf '{"checked_at":"%s","state":"%s","version":"%s","routes":"%s"}\n' "$TS" "$STATE" "$VER" "$TUNE" > HEALER.json

      - name: Status committen
        run: |
          if git diff --quiet HEALER.json 2>/dev/null && [ -f HEALER.json ]; then :; fi
          git config user.name "oracle-healer"
          git config user.email "healer@users.noreply.github.com"
          git add HEALER.json
          git commit -m "healer: $(python3 -c 'import json; d=json.load(open("HEALER.json")); print(d["state"], d["version"], d["routes"])' 2>/dev/null || echo status)" || echo "nichts zu committen"
          git push origin HEAD:main || echo "Push-Konflikt ignoriert"
