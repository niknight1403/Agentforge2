name: Oracle-Healer
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oracle-healer
  cancel-in-progress: false

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Heilen (Version + Ollama-Prioritaet)
        env:
          VF: ${{ secrets.VF_HUBTOKEN }}
          GT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STATE="down"
          VER="-"
          TUNE="-"
          HEALTH=$(curl -s -m 60 -H "Authorization: Bearer $VF" http://152.70.8.227:12000/api/health || true)
          if [ -n "$HEALTH" ]; then
            STATE="up"
            VER=$(echo "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version","?"))' 2>/dev/null || echo "?")
            ROUTES=$(curl -s -m 60 -H "Authorization: Bearer $VF" http://152.70.8.227:12000/api/routes || true)
            IDS=$(echo "$ROUTES" | python3 -c 'import json,sys; rs=json.load(sys.stdin); print(" ".join(str(r["id"]) for r in rs if "ollama" in r.get("base_url","").lower() and r.get("priority",0) < 40))' 2>/dev/null || true)
            if [ -n "$IDS" ]; then
              for ID in $IDS; do
                curl -s -m 60 -X PATCH -H "Authorization: Bearer $VF" -H "Content-Type: application/json" -d '{"priority": 40}' "http://152.70.8.227:12000/api/routes/$ID" > /dev/null || true
              done
              TUNE="getuned"
            else
              TUNE="ok"
            fi
            if python3 -c 'import sys; sys.exit(0 if sys.argv[1].startswith("1.11") else 1)' "$VER" 2>/dev/null; then
              : # Hub v1.11.x bereits live
            else
              echo "Hub $VER < 1.11.0 -> Deploy anstossen"
              curl -s -m 30 -X POST -H "Authorization: Bearer $GT" -H "Content-Type: application/json" -d '{"ref":"main","inputs":{"mode":"files"}}' https://api.github.com/repos/niknight1403/Agentforge2/actions/workflows/oracle-rebuild.yml/dispatches || true
              TUNE="$TUNE+deploy"
            fi
          fi
          echo "HEALTH=$STATE VER=$VER TUNE=$TUNE"
          printf '{"checked_at":"%s","state":"%s","version":"%s","routes":"%s"}\n' "$TS" "$STATE" "$VER" "$TUNE" > HEALER.json

      - name: Status committen
        run: |
          if git diff --quiet HEALER.json 2>/dev/null && [ -f HEALER.json ]; then :; fi
          git config user.name "oracle-healer"
          git config user.email "healer@users.noreply.github.com"
          git add HEALER.json
          git commit -m "healer: $(python3 -c 'import json; d=json.load(open("HEALER.json")); print(d["state"], d["version"], d["routes"])' 2>/dev/null || echo status)" || echo "nichts zu committen"
          git push origin HEAD:main || echo "Push-Konflikt ignoriert"
