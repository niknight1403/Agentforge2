name: Agent JSON Route Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-json-route-diagnostics.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: JSON route probe on production Hub
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/key ubuntu@92.5.177.159 "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/villaforge
          node --input-type=module <<'NODE'
          import { chat } from './server/llm.mjs';
          import { db } from './server/db.mjs';
          const agent = db.prepare('SELECT role, system_prompt FROM agents WHERE villa_id=34 AND is_root=1').get();
          if (!agent) throw new Error('Villa root agent not found');
          const messages = [
            { role: 'system', content: agent.system_prompt },
            { role: 'user', content: 'Antworte ausschließlich als JSON: {"final":"ok"}' }
          ];
          try {
            const result = await chat(messages, {
              role: agent.role, json: true, maxTokens: 1500,
              timeoutMs: 8000, totalTimeoutMs: 45000
            });
            console.log('AGENT_JSON_RESULT', JSON.stringify({
              ok: true, route: result.route || null, model: result.model || null,
              answerLength: String(result.content || '').length
            }));
          } catch (error) {
            console.log('AGENT_JSON_RESULT', JSON.stringify({
              ok: false, code: error.code || 'LLM_ERROR',
              attempts: Array.isArray(error.attempts) ? error.attempts : []
            }));
            process.exitCode = 1;
          }
          NODE
          REMOTE