name: Agent JSON Route Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-json-route-diagnostics.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Agent JSON route trace on production Hub
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/key ubuntu@92.5.177.159 "sudo bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/villaforge
          node --input-type=module <<'NODE'
          import { db } from './server/db.mjs';
          const originalFetch = globalThis.fetch;
          globalThis.fetch = async (input, init = {}) => {
            const url = typeof input === 'string' || input instanceof URL ? String(input) : input.url;
            const response = await originalFetch(input, init);
            if (url.includes('/chat/completions')) {
              let model = 'unknown';
              try { model = JSON.parse(init.body || '{}').model || model; } catch {}
              console.log('PROVIDER_HTTP', JSON.stringify({host: new URL(url).host, model, status: response.status}));
            }
            return response;
          };
          const agent = db.prepare('SELECT * FROM agents WHERE villa_id=34 AND is_root=1').get();
          if (!agent) throw new Error('Villa root agent not found');
          const { runAgent } = await import('./server/agents.mjs');
          const result = await runAgent(agent, 'Antworte nur mit ok. Keine Werkzeuge verwenden.', {
            maxSteps: 1, maxTokens: 1500, villaId: 34, reflect: false
          });
          console.log('AGENT_RUN_RESULT', JSON.stringify({
            ok: !result.error, code: result.code || null,
            route: result.route || null, model: result.model || null,
            error: result.error || null, trace: result.trace || []
          }));
          NODE
          REMOTE