name: AnfragePilot deployen (Oracle-VM, Unterpfad /pilot/)

on:
  workflow_dispatch:
    inputs:
      neu_starten:
        description: 'Dienst nach dem Deploy neu starten (true/false)'
        required: true
        default: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: SSH-Zugang einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          printf '%s\n' 'exec scp -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key "$@"' > /tmp/scpcmd
          chmod +x /tmp/sshcmd /tmp/scpcmd
          tar -czf /tmp/pilot.tgz -C pilot package.json package-lock.json src public tests

      - name: Dateien uebertragen
        run: |
          /tmp/scpcmd /tmp/pilot.tgz ubuntu@92.5.177.159:/tmp/pilot.tgz
          /tmp/scpcmd ops/pilot-deploy.sh ubuntu@92.5.177.159:/tmp/pilot-deploy.sh
          /tmp/sshcmd "ls -l /tmp/pilot.tgz /tmp/pilot-deploy.sh"

      - name: Deploy-Skript auf der VM ausfuehren
        env:
          RESTART: ${{ github.event.inputs.neu_starten }}
        run: |
          /tmp/sshcmd "sudo RESTART='$RESTART' bash /tmp/pilot-deploy.sh"

      - name: Live-Verifikation
        run: |
          sleep 3
          echo "--- Health ---"
          curl -s -m 20 https://hub.cybersarah-ki.com/pilot/api/health; echo ""
          echo "--- Startseite ---"
          curl -s -m 20 -o /tmp/pilot-start.html -w "HTTP %{http_code}, %{size_download} Bytes\n" https://hub.cybersarah-ki.com/pilot/
          grep -o "<title>[^<]*</title>" /tmp/pilot-start.html || true
          echo "--- Tarife ---"
          curl -s -m 20 https://hub.cybersarah-ki.com/pilot/api/plans | head -c 320; echo ""
          echo "--- Bestandsschutz CCC ---"
          curl -s -m 20 -o /dev/null -w "CCC-Health: HTTP %{http_code}\n" https://hub.cybersarah-ki.com/ccc/api/health
