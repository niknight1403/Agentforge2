name: villa-revenue-plan
on:
  workflow_dispatch:
    inputs:
      villa_name:
        description: 'Villa-Name (LIKE-Suche)'
        required: false
        default: 'CyberSarah'
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Umsatz-Plan anstossen
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
          VILLA: ${{ github.event.inputs.villa_name }}
        run: |
          H=https://hub.cybersarah-ki.com
          TOK=$(curl -s -m 30 -H "Content-Type: application/json" \
            -d "{\"email\":\"$VF_ADMIN_EMAIL\",\"password\":\"$VF_ADMIN_PASSWORD\"}" "$H/api/auth/login" | jq -r .token)
          if [ -z "$TOK" ] || [ "$TOK" = "null" ]; then echo "Login fehlgeschlagen"; exit 1; fi
          echo "== Villa suchen: $VILLA =="
          ID=$(curl -s -m 30 -H "Authorization: Bearer $TOK" "$H/api/villas" \
            | jq -r --arg v "$VILLA" 'first(.[] | select((.name // "") | ascii_downcase | contains($v | ascii_downcase)) | .id) // empty')
          if [ -z "$ID" ]; then echo "Villa nicht gefunden"; exit 1; fi
          echo "Villa-ID: $ID"
          echo "== REVENUE-Vorschlag anstossen =="
          curl -s -m 150 -X POST -H "Authorization: Bearer $TOK" -H "Content-Type: application/json" \
            -d '{"kind":"REVENUE"}' "$H/api/evolution/villas/$ID/propose" | head -c 600
          echo ""
          echo "== Vision der Villa =="
          curl -s -m 30 -H "Authorization: Bearer $TOK" "$H/api/villas/$ID" | jq -r '.vision // ""' | head -c 300
