name: Agent Academy CI

on:
  push:
    branches: [main]
    paths:
      - "agent-academy/**"
      - ".github/workflows/agent-academy-ci.yml"
  pull_request:
    paths:
      - "agent-academy/**"
      - ".github/workflows/agent-academy-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-academy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-academy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-academy/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app tests
      - name: Test
        run: pytest -q
