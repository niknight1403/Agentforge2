name: Hub-Lage

# Read-only Gesamtbild des Produktions-Hubs: Version, Auslastung, LLM-Status,
# Dead-Letter-Queue, Villen und OpenHands-Bruecke. Aendert nichts.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lage abrufen
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          BASE = 'https://hub.cybersarah-ki.com'

          def hol(pfad, token=None, timeout=25):
              hdr = {'Content-Type': 'application/json'}
              if token:
                  hdr['Authorization'] = 'Bearer ' + token
              try:
                  with urllib.request.urlopen(urllib.request.Request(BASE + pfad, headers=hdr), timeout=timeout) as r:
                      return json.load(r)
              except Exception as e:
                  return {'_fehler': str(e)}

          def zeig(name, daten, felder=None, laenge=500):
              if isinstance(daten, dict) and '_fehler' in daten:
                  print(f'{name}: nicht abrufbar ({daten["_fehler"]})')
                  return
              if felder and isinstance(daten, dict):
                  daten = {k: daten.get(k) for k in felder if k in daten}
              print(f'{name}: ' + json.dumps(daten, ensure_ascii=False)[:laenge])

          zeig('HEALTH', hol('/api/health'), ['name', 'version', 'ok', 'database', 'uptime'])

          login = urllib.request.Request(
              BASE + '/api/auth/login',
              data=json.dumps({'email': os.environ.get('VF_ADMIN_EMAIL', ''),
                               'password': os.environ.get('VF_ADMIN_PASSWORD', '')}).encode(),
              headers={'Content-Type': 'application/json'})
          try:
              with urllib.request.urlopen(login, timeout=25) as r:
                  token = json.load(r).get('token')
          except Exception as e:
              print('LOGIN fehlgeschlagen:', e)
              raise SystemExit(0)
          if not token:
              print('LOGIN ohne Token')
              raise SystemExit(0)

          zeig('SCHEDULER', hol('/api/scheduler', token), ['slots', 'active', 'queued', 'paused'])

          roh = hol('/api/llm/status', token)
          print('LLM-ROH: ' + json.dumps(roh, ensure_ascii=False)[:1200])
          routen = hol('/api/routes', token)
          if isinstance(routen, dict) and '_fehler' not in routen:
              liste = routen.get('routes') or routen.get('routen') or []
              print('ROUTEN-ANZAHL:', len(liste))
              for r in liste[:3]:
                  print('ROUTE-ROH:', json.dumps(r, ensure_ascii=False)[:400])
          else:
              print('ROUTEN: ' + json.dumps(routen, ensure_ascii=False)[:300])

          llm = hol('/api/llm/status', token)
          if isinstance(llm, dict) and '_fehler' not in llm:
              kurz = {}
              for k, v in list(llm.items())[:8]:
                  if isinstance(v, list):
                      kurz[k] = {'anzahl': len(v),
                                 'bereit': sum(1 for x in v if isinstance(x, dict) and (x.get('ready') or x.get('ok')))}
                  else:
                      kurz[k] = v
              zeig('LLM', kurz, laenge=600)
          else:
              zeig('LLM', llm)

          zeig('DLQ', hol('/api/dlq/dashboard', token), laenge=400)

          diag = hol('/api/admin/villa-diagnostics', token)
          if isinstance(diag, dict) and '_fehler' not in diag:
              zeig('VILLEN-SUMME', diag, [k for k in diag if not isinstance(diag.get(k), list)], laenge=400)
              villen = diag.get('villas') or diag.get('items') or []
              for v in villen[:4]:
                  print('VILLA-ROH: ' + json.dumps(v, ensure_ascii=False)[:450])
          else:
              zeig('VILLEN', diag)

          zeig('OPENHANDS', hol('/api/integrations/openhands', token), laenge=400)
          PY
