name: Knotenvergleich

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  k:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vergleich
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'echo "" | base64 -d > /tmp/kv2.cjs && node /tmp/kv2.cjs'
