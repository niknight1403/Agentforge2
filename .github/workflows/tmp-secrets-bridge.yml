# Einmalige Bruecke: spiegelt Modellschluessel aus diesem Repository in die
# OpenHands-Devbox. GitHub kann Secret-Werte nicht ueber die API lesen, deshalb
# muss der Schritt dort laufen, wo die Werte schon als Secret liegen. Nach dem
# Lauf wird diese Datei wieder entfernt. Ausgabe zeigt nur Namen, nie Werte.
name: temp-secrets-bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.AGENTFORGE_PAT }}
      ZIEL: niknight1403/openhands-devbox
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      VF_GEMINI_KEY: ${{ secrets.VF_GEMINI_KEY }}
      VF_HFTOKEN: ${{ secrets.VF_HFTOKEN }}
    steps:
      - name: Schluessel uebernehmen
        run: |
          set -uo pipefail
          fehler=0
          uebertrage() { # $1 Zielname, $2 Wert, $3 Quellname
            if [ -z "${2:-}" ]; then
              echo "::warning::${3} ist leer und wird uebersprungen."
              return 0
            fi
            if gh secret set "$1" --repo "$ZIEL" --body "$2" >/dev/null; then
              echo "uebernommen: ${3} -> ${1}"
            else
              echo "::error::${3} konnte nicht als ${1} geschrieben werden."
              fehler=$((fehler + 1))
            fi
          }
          uebertrage GROQ_API_KEY "${GROQ_API_KEY:-}" GROQ_API_KEY
          uebertrage CEREBRAS_API_KEY "${CEREBRAS_API_KEY:-}" CEREBRAS_API_KEY
          uebertrage GEMINI_API_KEY "${VF_GEMINI_KEY:-}" VF_GEMINI_KEY
          uebertrage HF_TOKEN "${VF_HFTOKEN:-}" VF_HFTOKEN
          echo "Fertig, Fehler: ${fehler}"
          exit "$fehler"
