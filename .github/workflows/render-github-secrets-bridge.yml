name: Render Runtime via Agentforge2 GitHub Secrets

on:
  workflow_dispatch:
    inputs:
      apply_to_render:
        description: "Vorhandene LLM-Secrets sicher an den bestehenden Render-Dienst übertragen und neu deployen"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agentforge2-render-secret-bridge
  cancel-in-progress: false

jobs:
  secret-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Secret-Verfügbarkeit prüfen (niemals Werte ausgeben)
        shell: bash
        run: |
          set -euo pipefail
          present() { local name="$1"; if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=missing"; fi; }
          present RENDER_API_KEY
          present GROQ_API_KEY
          present GEMINI_API_KEY
          present OPENROUTER_API_KEY
          present HF_TOKEN
          if [ -z "${GROQ_API_KEY:-}${GEMINI_API_KEY:-}${OPENROUTER_API_KEY:-}${HF_TOKEN:-}" ]; then
            echo "::error::Kein unterstütztes LLM-Secret in GitHub Actions verfügbar."
            exit 1
          fi

      - name: Bestehende Render-Umgebung nur bei ausdrücklicher Workflow-Freigabe aktualisieren
        if: ${{ inputs.apply_to_render }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::RENDER_API_KEY fehlt. Es wurde nichts an Render geändert."
            exit 1
          fi
          SERVICE_ID="srv-dc0angd9el5s73fg0e9g"
          API="https://api.render.com/v1"
          # Refuse to transfer credentials or deploy if the existing Render service
          # is not tracking the production main branch.
          umask 077
          preflight_tmp="$(mktemp -d)"
          trap 'rm -rf "$preflight_tmp"' EXIT
          preflight_config="$preflight_tmp/render.curlrc"
          printf 'header = "Authorization: Bearer %s"\\nheader = "Accept: application/json"\\n' "$RENDER_API_KEY" > "$preflight_config"
          service_json=$(curl --config "$preflight_config" --silent --show-error --fail "$API/services/$SERVICE_ID")
          service_branch=$(printf '%s' "$service_json" | jq -r '.branch // .serviceDetails.branch // empty')
          service_repo=$(printf '%s' "$service_json" | jq -r '.repo // .serviceDetails.repo // empty')
          if [ "$service_branch" != "main" ]; then
            echo "::error::Render-Service verfolgt Branch '$service_branch' statt 'main'. Keine Secrets übertragen, kein Deployment gestartet."
            exit 1
          fi
          if [ -n "$service_repo" ] && [[ "$service_repo" != *"niknight1403/Agentforge2"* ]]; then
            echo "::error::Render-Service ist mit einem unerwarteten Repository verbunden. Keine Änderung vorgenommen."
            exit 1
          fi
          rm -rf "$preflight_tmp"
          trap - EXIT
          umask 077
          secret_tmp="$(mktemp -d)"
          trap 'rm -rf "$secret_tmp"' EXIT
          curl_config="$secret_tmp/render.curlrc"
          payload_file="$secret_tmp/payload.json"
          # Credentials live only in a mode-600 temporary curl config, never in curl argv/logs.
          printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/json"\n' "$RENDER_API_KEY" > "$curl_config"
          curl_render() { curl --config "$curl_config" --silent --show-error "$@"; }
          update_one() {
            local key="$1"
            local value="$2"
            local code
            # Pipe the secret through stdin to jq; it is not passed as a process argument.
            printf '%s' "$value" | jq -Rs '{value: .}' > "$payload_file"
            code=$(curl_render --output /dev/null --write-out '%{http_code}' \
              --request PUT "$API/services/$SERVICE_ID/env-vars/$key" \
              --header "Content-Type: application/json" \
              --data-binary "@$payload_file")
            if [ "$code" != "200" ]; then
              echo "::error::Render konnte $key nicht aktualisieren (HTTP $code)."
              return 1
            fi
            echo "$key updated"
          }
          count=0
          if [ -n "${GROQ_API_KEY:-}" ]; then update_one GROQ_API_KEY "$GROQ_API_KEY"; count=$((count+1)); fi
          if [ -n "${GEMINI_API_KEY:-}" ]; then update_one GEMINI_API_KEY "$GEMINI_API_KEY"; count=$((count+1)); fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then update_one OPENROUTER_API_KEY "$OPENROUTER_API_KEY"; count=$((count+1)); fi
          if [ -n "${HF_TOKEN:-}" ]; then update_one HF_TOKEN "$HF_TOKEN"; count=$((count+1)); fi
          if [ "$count" -lt 1 ]; then
            echo "::error::Keine LLM-Secrets übertragen."
            exit 1
          fi
          echo "Übertragene Secret-Anzahl: $count (Werte bleiben verborgen)."
          response=$(curl_render --fail \
            --request POST "$API/services/$SERVICE_ID/deploys" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}')
          deploy_id=$(printf '%s' "$response" | jq -r '.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "::error::Render hat keine Deployment-ID zurückgegeben."
            exit 1
          fi
          echo "Render deployment queued: $deploy_id"
          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"

      - name: Render-Deployment und Health-Endpunkt prüfen
        if: ${{ inputs.apply_to_render }}
        shell: bash
        run: |
          set -euo pipefail
          SERVICE_ID="srv-dc0angd9el5s73fg0e9g"
          API="https://api.render.com/v1"
          # Each GitHub Actions step is a separate shell; recreate the private curl config here.
          umask 077
          secret_tmp="$(mktemp -d)"
          trap 'rm -rf "$secret_tmp"' EXIT
          curl_config="$secret_tmp/render.curlrc"
          printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/json"\n' "$RENDER_API_KEY" > "$curl_config"
          status=""
          for attempt in $(seq 1 60); do
            response=$(curl --config "$curl_config" --silent --show-error --fail \
              "$API/services/$SERVICE_ID/deploys/$DEPLOY_ID")
            status=$(printf '%s' "$response" | jq -r '.status // "unknown"')
            echo "Deployment status: $status"
            case "$status" in
              live) break ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "::error::Render-Deployment endete mit $status."
                exit 1 ;;
            esac
            sleep 10
          done
          if [ "$status" != "live" ]; then
            echo "::error::Render-Deployment wurde nicht innerhalb des Zeitfensters live."
            exit 1
          fi
          health_code=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' \
            --max-time 20 https://agentforge2-neural-smoke.onrender.com/api/health)
          echo "Health HTTP: $health_code"
          if [ "$health_code" != "200" ] || ! jq -e '.ok == true' /tmp/health.json >/dev/null; then
            echo "::error::Health-Endpunkt hat keine bestätigte ok=true-Antwort geliefert."
            exit 1
          fi
          echo "RENDER_HEALTH_OK"
          llm_code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 20 https://agentforge2-neural-smoke.onrender.com/api/llm/status || true)
          echo "LLM status endpoint HTTP: $llm_code"
          echo "LLM endpoint wurde abgefragt; Modellantwort/Agentenlauf ist damit noch nicht bestätigt."

      - name: Dry-run-Hinweis
        if: ${{ !inputs.apply_to_render }}
        run: |
          echo "Dry-run abgeschlossen. Es wurden nur Secret-Namen auf Verfügbarkeit geprüft."
          echo "Für die Übertragung muss dieser Workflow manuell mit apply_to_render=true gestartet werden."
