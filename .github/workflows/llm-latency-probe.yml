name: LLM-Latenz-Probe (Kaskaden-Knoten einzeln messen)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Jeden Ollama-Knoten mit kurzem Prompt messen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          cat > /tmp/lat.py <<'PYV'
          import json, sys, time, urllib.request
          node, model = sys.argv[1], sys.argv[2]
          print("-- %s %s --" % (node, model))
          try:
              ps = json.load(urllib.request.urlopen("http://%s:11434/api/ps" % node, timeout=8))
              print("geladen:", [m["name"] for m in ps.get("models", [])])
          except Exception as e:
              print("api/ps nicht lesbar:", e)
          body = json.dumps({"model": model, "prompt": "Antworte nur mit dem Wort OK.", "stream": False, "options": {"num_predict": 8}}).encode()
          req = urllib.request.Request("http://%s:11434/api/generate" % node, data=body, headers={"Content-Type": "application/json"})
          t0 = time.time()
          try:
              d = json.load(urllib.request.urlopen(req, timeout=240))
              print("Antwort:", repr(d.get("response", "")[:40]), "| load_ms:", round(d.get("load_duration", 0) / 1e6), "| gen_ms:", round(d.get("eval_duration", 0) / 1e6))
          except Exception as e:
              print("Fehler/Timeout:", e)
          print("Gesamtdauer: %.1f s" % (time.time() - t0))
          PYV
          python3 /tmp/lat.py 2.28.12.63 qwen2.5-coder:3b
          python3 /tmp/lat.py 2.31.45.241 qwen2.5-coder:7b
          python3 /tmp/lat.py 2.31.64.65 qwen2.5-coder:7b
          python3 /tmp/lat.py 2.31.77.72 qwen2.5-coder:32b
          echo "== Hub-Routen aus DB =="
          cat > /tmp/routes.py <<'PYV'
          import sqlite3
          con = sqlite3.connect('/opt/villaforge/server/data/villaforge.db')
          cur = con.cursor()
          cols = [r[1] for r in cur.execute("PRAGMA table_info(routes)").fetchall()]
          print("Spalten:", cols)
          keep = ('id', 'name', 'model', 'priority', 'enabled', 'status', 'fail_count')
          for r in cur.execute("SELECT * FROM routes ORDER BY priority DESC LIMIT 12").fetchall():
              d = dict(zip(cols, r))
              print({k: d[k] for k in cols if k in keep})
          PYV
          python3 /tmp/routes.py
          EOS
