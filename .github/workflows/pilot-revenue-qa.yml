name: AnfragePilot – Revenue Product QA
on:
  push:
    paths:
      - 'pilot/**'
      - 'ops/pilot-deploy.sh'
      - '.github/workflows/pilot-revenue-qa.yml'
  pull_request:
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-revenue-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pilot/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Run project tests and retain evidence
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results.log
      - name: Validate server syntax
        run: npm run check
      - name: Validate deployment shell syntax
        working-directory: .
        run: bash -n ops/pilot-deploy.sh
      - name: Upload test evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anfragepilot-test-results
          path: pilot/test-results.log
          if-no-files-found: warn
          retention-days: 7
