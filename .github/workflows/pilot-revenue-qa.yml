name: AnfragePilot – Revenue Product QA
on:
  push:
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-revenue-qa.yml'
  pull_request:
    paths:
      - 'pilot/**'
      - '.github/workflows/pilot-revenue-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pilot/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Run project tests
        run: npm test
      - name: Validate server syntax
        run: npm run check
