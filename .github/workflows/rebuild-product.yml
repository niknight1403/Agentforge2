name: Produkt neu bauen

on:
  workflow_dispatch:
    inputs:
      villa_id:
        description: Villa-ID
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build anstossen und Ergebnis pruefen
        env:
          VF_SMOKE_BASE_URL: https://hub.cybersarah-ki.com
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
          VILLA: ${{ inputs.villa_id }}
        run: |
          cat > /tmp/rebuild.mjs <<'JS'
          const base=process.env.VF_SMOKE_BASE_URL.replace(/\/$/,'');
          const villa=Number(process.env.VILLA);
          const signal=AbortSignal.timeout(600000);
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          let token='';
          async function call(path,body){
            const response=await fetch(base+path,{method:body?'POST':'GET',
              headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},
              ...(body?{body:JSON.stringify(body)}:{}),signal});
            const text=await response.text();
            let data={}; try{data=JSON.parse(text);}catch{}
            if(!response.ok)throw Error(`${path} HTTP ${response.status} ${String(text).slice(0,160)}`);
            return data;
          }
          function listZip(b){
            if(b.subarray(0,4).toString('latin1')!=='PK\u0003\u0004')return {zip:false};
            let eocd=-1;
            for(let i=b.length-22;i>=0&&i>b.length-66000;i--)if(b.readUInt32LE(i)===0x06054b50){eocd=i;break;}
            if(eocd<0)return {zip:false};
            const count=b.readUInt16LE(eocd+10),start=b.readUInt32LE(eocd+16),entries=[];
            let offset=start;
            for(let n=0;n<count;n++){
              if(b.readUInt32LE(offset)!==0x02014b50)break;
              const unpacked=b.readUInt32LE(offset+24);
              const nameLen=b.readUInt16LE(offset+28),extraLen=b.readUInt16LE(offset+30),commentLen=b.readUInt16LE(offset+32);
              entries.push({name:b.subarray(offset+46,offset+46+nameLen).toString('utf8'),size:unpacked});
              offset+=46+nameLen+extraLen+commentLen;
            }
            return {zip:true,count,entries};
          }
          const required=/^(?:.*\/)?(?:index\.html|package\.json|AndroidManifest\.xml)$/;

          const login=await call('/api/auth/login',{email:process.env.VF_ADMIN_EMAIL,password:process.env.VF_ADMIN_PASSWORD});
          token=login.token;
          console.log('Start-Build fuer Villa',villa);
          const started=await call(`/api/villas/${villa}/build`,{});
          console.log('Antwort:',JSON.stringify(started).slice(0,200));
          let state=started;
          for(let i=0;i<60;i++){
            await sleep(15000);
            state=await call(`/api/villas/${villa}/build`);
            console.log(`[${i+1}] status=${state.status} ${state.error?('error='+String(state.error).slice(0,120)):''}`);
            if(state.status==='ready'||state.status==='unverified'||state.status==='failed')break;
          }
          console.log('Build-Log (letzte Zeilen):');
          for(const line of (state.log||[]).slice(-12))console.log('  '+line);
          const response=await fetch(base+`/api/villas/${villa}/build/download`,{headers:{authorization:'Bearer '+token},signal});
          console.log('Download HTTP',response.status);
          if(!response.ok)process.exit(1);
          const bytes=Buffer.from(await response.arrayBuffer());
          const info=listZip(bytes);
          console.log(`Archiv: ${bytes.length} Bytes, ${info.zip?info.count+' Eintraege':'KEIN ZIP'}`);
          if(info.zip){
            for(const entry of info.entries.slice(0,40))console.log(`  ${String(entry.size).padStart(8)}  ${entry.name}`);
            const hits=info.entries.filter(e=>required.test(e.name)).map(e=>e.name);
            console.log('Pflichtdateien:',hits.length?hits.join(', '):'KEINE');
            if(!hits.length)process.exit(1);
          }
          JS
          node /tmp/rebuild.mjs
