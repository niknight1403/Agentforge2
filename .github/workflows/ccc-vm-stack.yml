name: CCC-VM-Stack

# CyberSarah Control Center: vollstaendiges Backend auf der Oracle-VM
# (Nutzerdirektive 2026-10-21: kostenlose Neon-Alternative, autonom).
# Postgres (localhost) + Express/tRPC (Port 13000) + nginx-Route /ccc/.
# Danach ist CCC unabhaengig von der Neon-Quota.
#
# Aufruf: workflow_dispatch (optional input stripe_secret_key).
# Der Key wird nur als Env-Datei an die VM uebergeben, nie im Repo gespeichert.

on:
  workflow_dispatch:
    inputs:
      stripe_secret_key:
        description: "Stripe Live-Key (sk_live_...) — optional, nur fuer Billing aktiv"
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: SSH-Key einrichten
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}

      - name: Env-Datei (Werte nie im Log)
        run: |
          umask 077
          {
            echo "CCC_TOKEN=${CCC_TOKEN}"
            echo "STRIPE_KEY=${STRIPE_KEY}"
            echo "OPENROUTER_KEY=${OPENROUTER_KEY}"
          } > /tmp/ccc.env
          echo "Env-Datei erstellt."
        env:
          CCC_TOKEN: ${{ secrets.CCC_ACCESS_TOKEN }}
          STRIPE_KEY: ${{ github.event.inputs.stripe_secret_key }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Setup-Skript erzeugen
        run: cat > /tmp/cccstack.sh <<'SETUPEOF'
          #!/usr/bin/env bash
          # CCC-VM-Stack: Postgres + Server + nginx auf der Oracle-VM. Idempotent.
          set -euo pipefail
          source /tmp/ccc.env

          CCC_DIR=/opt/ccc
          mkdir -p "$CCC_DIR"

          echo "== [1/7] Postgres installieren (falls fehlt) =="
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq postgresql postgresql-contrib
          fi
          sudo systemctl enable --now postgresql

          echo "== [2/7] Rolle + Datenbank anlegen (idempotent) =="
          if [ ! -f "$CCC_DIR/.dbpass" ]; then
            openssl rand -hex 16 > "$CCC_DIR/.dbpass.tmp"
            sudo chown ubuntu:ubuntu "$CCC_DIR/.dbpass.tmp"
            chmod 600 "$CCC_DIR/.dbpass.tmp"
            mv "$CCC_DIR/.dbpass.tmp" "$CCC_DIR/.dbpass"
          fi
          DBPASS=$(cat "$CCC_DIR/.dbpass")
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='ccc'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE ROLE ccc LOGIN PASSWORD '$DBPASS';"
          sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='cybersarah'" | grep -q 1 || \
            sudo -u postgres createdb -O ccc cybersarah
          echo "DB bereit."

          echo "== [3/7] CCC-Repo klonen/aktualisieren =="
          if [ ! -d "$CCC_DIR/repo/.git" ]; then
            git clone -q "https://x-access-token:${CCC_TOKEN}@github.com/niknight1403/CyberSarah-Control-Center.git" "$CCC_DIR/repo"
          else
            (cd "$CCC_DIR/repo" && git remote set-url origin "https://x-access-token:${CCC_TOKEN}@github.com/niknight1403/CyberSarah-Control-Center.git")
          fi
          cd "$CCC_DIR/repo"
          git fetch -q origin
          git reset -q --hard origin/main
          echo "Stand: $(git log -1 --oneline)"

          echo "== [4/7] Abhaengigkeiten + Server-Build =="
          if [ ! -f "$CCC_DIR/.npmci-ok" ] || ! git diff --quiet HEAD@{1} 2>/dev/null; then
            npm ci --no-audit --no-fund
            touch "$CCC_DIR/.npmci-ok"
          fi
          npm run build
          echo "Server gebaut (dist/)."

          echo "== [5/7] Drizzle-Migrationen =="
          DATABASE_URL="postgresql://ccc:${DBPASS}@127.0.0.1:5432/cybersarah" npx drizzle-kit migrate
          echo "Schema aktuell."

          echo "== [6/7] systemd-Unit =="
          if [ ! -f "$CCC_DIR/.jwt" ]; then
            openssl rand -hex 32 > "$CCC_DIR/.jwt.tmp"
            chmod 600 "$CCC_DIR/.jwt.tmp"
            mv "$CCC_DIR/.jwt.tmp" "$CCC_DIR/.jwt"
          fi
          JWT=$(cat "$CCC_DIR/.jwt")
          STRIPE_ENV=""
          if [ -n "${STRIPE_KEY}" ]; then
            STRIPE_ENV="Environment=STRIPE_SECRET_KEY=${STRIPE_KEY}"
          fi
          OR_ENV=""
          if [ -n "${OPENROUTER_KEY}" ]; then
            OR_ENV="Environment=OPENROUTER_API_KEY=${OPENROUTER_KEY}"
          fi
          sudo tee /etc/systemd/system/cybersarah-ccc.service >/dev/null <<UNIT
          [Unit]
          Description=CyberSarah Control Center API (Postgres auf VM, Port 13000)
          After=network.target postgresql.service
          Wants=postgresql.service

          [Service]
          Type=simple
          WorkingDirectory=${CCC_DIR}/repo
          Environment=NODE_ENV=production
          Environment=PORT=13000
          Environment=DATABASE_URL=postgresql://ccc:${DBPASS}@127.0.0.1:5432/cybersarah
          Environment=JWT_SECRET=${JWT}
          Environment=ADMIN_EMAIL=niko.oeben@gmail.com
          Environment=APP_BASE_URL=https://hub.cybersarah-ki.com/ccc
          Environment=APP_ALLOWED_ORIGINS=https://app.cybersarah-ki.com,https://hub.cybersarah-ki.com,capacitor://localhost,https://localhost,exp://localhost,http://localhost
          ${STRIPE_ENV}
          ${OR_ENV}
          ExecStart=$(which node) dist/index.js
          Restart=always
          RestartSec=5
          User=ubuntu

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo systemctl daemon-reload
          sudo systemctl enable --now cybersarah-ccc
          sleep 4
          if curl -sf http://127.0.0.1:13000/api/health >/dev/null; then
            echo "Lokale Health OK."
          else
            echo "Lokale Health FEHLGESCHLAGEN — letzte Logs:"
            sudo journalctl -u cybersarah-ccc -n 30 --no-pager || true
            exit 1
          fi

          echo "== [7/7] nginx-Route /ccc/ (443, bestehender Host) =="
          sudo python3 - <<'PYEOF'
          import re, glob

          files = []
          for pat in ('/etc/nginx/sites-enabled/*', '/etc/nginx/conf.d/*.conf', '/etc/nginx/nginx.conf'):
              files += [f for f in glob.glob(pat)]
          target = None
          for f in files:
              try:
                  txt = open(f).read()
              except Exception:
                  continue
              if 'hub.cybersarah-ki.com' in txt and 'location /ccc/' not in txt:
                  target = (f, txt)
                  break
          if target is None:
              print('nginx: Route existiert bereits oder Host nicht gefunden — nichts zu tun.')
          else:
              f, txt = target
              idx = txt.find('hub.cybersarah-ki.com')
              # einschliessenden server{ finden
              start = txt.rfind('server', 0, idx)
              while start != -1 and txt[start:start+8] != 'server {':
                  start = txt.rfind('server', 0, start)
              if start == -1:
                  raise SystemExit('server-Block nicht gefunden')
              depth, i = 0, None
              j = txt.find('{', start)
              k = j
              while k < len(txt):
                  if txt[k] == '{':
                      depth += 1
                  elif txt[k] == '}':
                      depth -= 1
                      if depth == 0:
                          i = k
                          break
                  k += 1
              if i is None:
                  raise SystemExit('server-Block-Klammer nicht ausgeglichen')
              location = """
              # CCC-VM-Stack (2026-10-21): CyberSarah API auf der VM, Neon-unabhaengig.
              location /ccc/ {
                  proxy_pass http://127.0.0.1:13000/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300s;
                  proxy_send_timeout 300s;
              }
          """
              newtxt = txt[:i] + location + txt[i:]
              open(f, 'w').write(newtxt)
              print(f'nginx: Route in {f} eingefuegt.')
          PYEOF
          sudo nginx -t
          sudo systemctl reload nginx

          echo "== Externe Verifikation =="
          sleep 2
          curl -sf https://hub.cybersarah-ki.com/ccc/api/health || { echo "Externe Health FEHLGESCHLAGEN"; exit 1; }
          echo ""
          echo "CCC-VM-STACK OK"
          SETUPEOF

      - name: Aufräumen
        if: always()
        run: rm -f /tmp/ccc.env /tmp/cccstack.sh ~/.ssh/oracle_key
