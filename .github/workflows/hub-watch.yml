name: Hub-Watch 24/7
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hub-Verbindung und Sync pruefen
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, datetime
          ghauth = {'Authorization': 'Bearer ' + os.environ['GH']}
          def get(url, hdr, tmo):
              try:
                  return urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=tmo), None
              except Exception as e:
                  return None, str(e)
          # 0) Login am Hub (Session-Token, v1.10-Auth)
          login_body = json.dumps({'email': os.environ['VF_ADMIN_EMAIL'],
                                   'password': os.environ['VF_ADMIN_PASSWORD']}).encode()
          req = urllib.request.Request('https://hub.cybersarah-ki.com/api/auth/login',
                                       data=login_body, headers={'Content-Type': 'application/json'})
          try:
              tok = json.load(urllib.request.urlopen(req, timeout=15))['token']
          except Exception as e:
              tok = None
          now = datetime.datetime.now(datetime.timezone.utc)
          # 1) Hub von aussen (HTTPS via hub.cybersarah-ki.com)
          hub = {}
          villas = []
          if tok:
              r, err = get('https://hub.cybersarah-ki.com/api/health',
                          {'Authorization': 'Bearer ' + tok}, 12)
              if r:
                  s = json.load(r)
                  rv, rv_err = get('https://hub.cybersarah-ki.com/api/villas',
                                   {'Authorization': 'Bearer ' + tok}, 12)
                  villas = json.load(rv) if rv else []
                  running = sum(1 for v in villas if v.get('executing') or v.get('queued') or str(v.get('status', '')).lower() in ('running', 'aktiv', 'active', 'waiting_for_model'))
                  agents = sum(int(v.get('agents_count') or v.get('agent_count') or 0) for v in villas)
                  hub = {'state': 'UP', 'version': s.get('version'), 'routes': s.get('routes'),
                         'villas': len(villas), 'running': running, 'agents': agents,
                         'executing': sum(1 for v in villas if v.get('executing')),
                         'queued': sum(1 for v in villas if v.get('queued')),
                         'open_tasks': sum(int(v.get('openCount') or 0) for v in villas)}
              else:
                  hub = {'state': 'DOWN', 'error': err[:120]}
          else:
              hub = {'state': 'DOWN', 'error': 'Login fehlgeschlagen'}

          # 2) Echte Arbeitsaktivitaet aus Tasks/Agents/Messages/Audit.
          # Villa.updated_at und stats.ts sind explizit keine Aktivitaetsbelege.
          activity = {}
          activity_state = 'UNKNOWN'
          activity_age_min = None
          if tok:
              ra, err_a = get('https://hub.cybersarah-ki.com/api/system/activity',
                              {'Authorization': 'Bearer ' + tok}, 12)
              if ra:
                  try:
                      activity = json.load(ra)
                      activity_state = activity.get('activityState', 'UNKNOWN')
                      age_ms = activity.get('activityAgeMs')
                      if isinstance(age_ms, (int, float)) and age_ms >= 0:
                          activity_age_min = int(age_ms / 60000)
                  except Exception:
                      activity = {'activityState': 'UNKNOWN', 'error': 'invalid activity response'}

          status = {'checked_at': now.isoformat(), 'hub': hub, 'activity': activity,
                    'activity_state': activity_state, 'activity_age_min': activity_age_min}
          state = hub.get('state', 'DOWN')
          if state == 'UP' and activity_state != 'ACTIVE':
              state = 'DEGRADED'
          status['state'] = state
          print(json.dumps(status, indent=2))

          # 3) Status nur bei Aenderung in HUB-WATCH.json schreiben
          r, _ = get('https://api.github.com/repos/niknight1403/Agentforge2/contents/HUB-WATCH.json', ghauth, 15)
          sha = None
          old_data = {}
          if r:
              res_obj = json.load(r)
              sha = res_obj.get('sha')
              if 'content' in res_obj:
                  try:
                      old_data = json.loads(base64.b64decode(res_obj['content']).decode('utf-8'))
                  except Exception:
                      old_data = {}
          if old_data.get('state') == state and 'sync_age_min' not in old_data and (state == 'DOWN' or (old_data.get('hub', {}).get('running') == hub.get('running') and old_data.get('activity_state') == activity_state and old_data.get('activity_age_min') == activity_age_min)):
              print('Zustand unveraendert:', state, '- kein Update.')
              raise SystemExit(0 if state == 'UP' else 1)

          body = json.dumps({'message': f'hub-watch: {state}', 'branch': 'main',
                             'sha': sha,
                             'content': base64.b64encode(json.dumps(status, indent=2).encode()).decode()}).encode()
          req = urllib.request.Request('https://api.github.com/repos/niknight1403/Agentforge2/contents/HUB-WATCH.json',
                                       data=body, method='PUT', headers=ghauth)
          urllib.request.urlopen(req)
          print('HUB-WATCH.json aktualisiert:', state)
          raise SystemExit(0 if state == 'UP' else 1)
          PY
