name: Hub-Watch 24/7
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hub-Verbindung und Sync pruefen
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, datetime
          ghauth = {'Authorization': 'Bearer ' + os.environ['GH']}
          def get(url, hdr, tmo):
              try:
                  return urllib.request.urlopen(urllib.request.Request(url, headers=hdr), timeout=tmo), None
              except Exception as e:
                  return None, str(e)
          # 0) Login am Hub (Session-Token, v1.10-Auth)
          login_body = json.dumps({'email': os.environ['VF_ADMIN_EMAIL'],
                                   'password': os.environ['VF_ADMIN_PASSWORD']}).encode()
          req = urllib.request.Request('https://hub.cybersarah-ki.com/api/auth/login',
                                       data=login_body, headers={'Content-Type': 'application/json'})
          try:
              tok = json.load(urllib.request.urlopen(req, timeout=15))['token']
          except Exception as e:
              tok = None
          now = datetime.datetime.now(datetime.timezone.utc)
          # 1) Hub von aussen (HTTPS via hub.cybersarah-ki.com)
          hub = {}
          villas = []
          if tok:
              r, err = get('https://hub.cybersarah-ki.com/api/health',
                          {'Authorization': 'Bearer ' + tok}, 12)
              if r:
                  s = json.load(r)
                  rv, rv_err = get('https://hub.cybersarah-ki.com/api/villas',
                                   {'Authorization': 'Bearer ' + tok}, 12)
                  villas = json.load(rv) if rv else []
                  running = sum(1 for v in villas if str(v.get('status', '')).lower() in ('running', 'aktiv', 'active'))
                  agents = sum(int(v.get('agent_count') or v.get('agents') or 0) for v in villas)
                  hub = {'state': 'UP', 'version': s.get('version'), 'routes': s.get('routes'),
                         'villas': len(villas), 'running': running, 'agents': agents}
              else:
                  hub = {'state': 'DOWN', 'error': err[:120]}
          else:
              hub = {'state': 'DOWN', 'error': 'Login fehlgeschlagen'}

          # 2) Hub-interne Aktivitaetsmetrik (Minuten seit max(updated_at) aller Villen)
          # Option 1 (bevorzugt): GET /api/villas updated_at auswerten
          villa_activity_min = None
          max_updated_dt = None

          for v in villas:
              val = v.get('updated_at')
              if val is None:
                  continue
              dt_val = None
              if isinstance(val, (int, float)):
                  ts_sec = val / 1000.0 if val > 1e11 else float(val)
                  try:
                      dt_val = datetime.datetime.fromtimestamp(ts_sec, datetime.timezone.utc)
                  except Exception:
                      pass
              elif isinstance(val, str):
                  val_s = val.strip()
                  if val_s.isdigit():
                      v_num = float(val_s)
                      ts_sec = v_num / 1000.0 if v_num > 1e11 else v_num
                      try:
                          dt_val = datetime.datetime.fromtimestamp(ts_sec, datetime.timezone.utc)
                      except Exception:
                          pass
                  else:
                      try:
                          dt_val = datetime.datetime.fromisoformat(val_s.replace('Z', '+00:00'))
                          if dt_val.tzinfo is None:
                              dt_val = dt_val.replace(tzinfo=datetime.timezone.utc)
                      except Exception:
                          pass
              if dt_val:
                  if max_updated_dt is None or dt_val > max_updated_dt:
                      max_updated_dt = dt_val

          if max_updated_dt:
              villa_activity_min = int((now - max_updated_dt).total_seconds() / 60)

          # Option 2 (Fallback): GET /api/stats nutzen, falls updated_at unbrauchbar/fehlt
          if villa_activity_min is None and tok:
              rs, err_s = get('https://hub.cybersarah-ki.com/api/stats',
                              {'Authorization': 'Bearer ' + tok}, 12)
              if rs:
                  try:
                      stats_data = json.load(rs)
                      ts_val = stats_data.get('ts')
                      if ts_val:
                          ts_sec = ts_val / 1000.0 if ts_val > 1e11 else float(ts_val)
                          stats_dt = datetime.datetime.fromtimestamp(ts_sec, datetime.timezone.utc)
                          villa_activity_min = int((now - stats_dt).total_seconds() / 60)
                  except Exception:
                      pass

          status = {'checked_at': now.isoformat(), 'hub': hub, 'villa_activity_min': villa_activity_min}
          state = hub.get('state', 'DOWN')
          if state == 'UP' and (villa_activity_min is None or villa_activity_min > 90):
              state = 'DEGRADED'
          status['state'] = state
          print(json.dumps(status, indent=2))

          # 3) Status nur bei Aenderung in HUB-WATCH.json schreiben
          r, _ = get('https://api.github.com/repos/niknight1403/Agentforge2/contents/HUB-WATCH.json', ghauth, 15)
          sha = None
          old_data = {}
          if r:
              res_obj = json.load(r)
              sha = res_obj.get('sha')
              if 'content' in res_obj:
                  try:
                      old_data = json.loads(base64.b64decode(res_obj['content']).decode('utf-8'))
                  except Exception:
                      old_data = {}
          if old_data.get('state') == state and 'sync_age_min' not in old_data and (state == 'DOWN' or (old_data.get('hub', {}).get('running') == hub.get('running') and old_data.get('villa_activity_min') == villa_activity_min)):
              print('Zustand unveraendert:', state, '- kein Update.')
              raise SystemExit(0 if state == 'UP' else 1)

          body = json.dumps({'message': f'hub-watch: {state}', 'branch': 'main',
                             'sha': sha,
                             'content': base64.b64encode(json.dumps(status, indent=2).encode()).decode()}).encode()
          req = urllib.request.Request('https://api.github.com/repos/niknight1403/Agentforge2/contents/HUB-WATCH.json',
                                       data=body, method='PUT', headers=ghauth)
          urllib.request.urlopen(req)
          print('HUB-WATCH.json aktualisiert:', state)
          raise SystemExit(0 if state == 'UP' else 1)
          PY
