name: APEX Omega CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/apex-omega-ultra-agent]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integration tests
        run: npm test
      - name: Secret scan
        run: npm run check:secrets
      - name: Web build
        run: npm run build:web
      - name: Hub syntax/startup check
        run: node server/server.mjs --check
