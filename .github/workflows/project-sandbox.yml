name: Project Sandbox Integration
on:
  pull_request:
    paths: ['server/project-execution.mjs','server/project-process.mjs','server/project-stage.mjs','server/fs-tools.mjs','scripts/test-project-sandbox.mjs','server/tests/deploy.test.mjs','.github/workflows/hub-deploy.yml','.github/workflows/project-sandbox.yml','docker/project-sandbox/Dockerfile']
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare disposable CI image and resolve immutable digest
        run: |
          docker pull node:24-bookworm-slim
          docker build --pull=false -t villaforge-project-sandbox:ci -f docker/project-sandbox/Dockerfile .
          node_image=$(docker image inspect node:24-bookworm-slim --format '{{.Id}}')
          rust_image=$(docker image inspect villaforge-project-sandbox:ci --format '{{.Id}}')
          echo "VF_SANDBOX_TEST_IMAGE=$node_image" >> "$GITHUB_ENV"
          echo "VF_SANDBOX_TEST_RUST_IMAGE=$rust_image" >> "$GITHUB_ENV"
      - name: Execute isolation and timeout tests in real Docker
        run: node scripts/test-project-sandbox.mjs
      - name: Verify root host still uses an unprivileged writable isolated copy
        run: sudo env VF_SANDBOX_TEST_IMAGE="$VF_SANDBOX_TEST_IMAGE" VF_SANDBOX_TEST_RUST_IMAGE="$VF_SANDBOX_TEST_RUST_IMAGE" "$(command -v node)" scripts/test-project-sandbox.mjs
