name: Hub-Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '!server/tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'app/src/main/java/dev/villaforge/app/ui/**'
      - 'app/build.gradle.kts'
      - 'docs/releases/**'
      - '.github/workflows/hub-deploy.yml'

concurrency:
  group: villaforge-production-hub
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hub live updaten (git pull + Restart + Version pruefen)
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          GT: ${{ secrets.GITHUB_TOKEN }}
          GTP: ${{ secrets.AGENTFORGE_PAT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          cat > /tmp/deploy.sh <<'DEP'
          set -euo pipefail
          echo "== Hub-Verzeichnis und Dienst aus systemd ermitteln =="
          UNIT=$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -iE '^(hub|villaforge)' | head -1 || true)
          [ -n "$UNIT" ] || UNIT=hub
          echo "UNIT=$UNIT"
          WD=$(systemctl show "$UNIT" -p WorkingDirectory --value 2>/dev/null | tr -d '"' || true)
          EXEC=$(systemctl show "$UNIT" -p ExecStart --value 2>/dev/null || true)
          MJS=$(echo "$EXEC" | grep -oE '[^ ;"=]*server\.mjs' | head -1 || true)
          if [ -n "$MJS" ] && [ "${MJS:0:1}" = "/" ]; then HUBDIR=$(dirname "$MJS")
          elif [ -n "$WD" ] && [ -n "$MJS" ]; then HUBDIR=$(dirname "$WD/$MJS")
          else HUBDIR=/opt/villaforge/server; fi
          echo "HUBDIR=$HUBDIR (WD=$WD, MJS=$MJS)"
          echo "== Git-Stand vorher =="
          git -C "$HUBDIR/.." log --oneline -1 2>/dev/null || git -C "$HUBDIR" log --oneline -1 2>/dev/null || true
          echo "== git pull (origin main) =="
          HUBROOT=$(cd "$HUBDIR/.." 2>/dev/null && pwd || echo "$HUBDIR")
          cd "$HUBROOT"
          # Remote-URL mit frischem Token versehen, falls der alte
          # eingebettete Token abgelaufen ist (Exit-5-Ursache).
          RC=0
          git fetch -q origin main || RC=$?
          if [ "$RC" != "0" ]; then
            echo "Fetch mit bestehendem Remote fehlgeschlagen (rc=$RC) - setze PAT-Remote."
            git remote set-url origin "https://x-access-token:${GTP}@github.com/niknight1403/Agentforge2.git" 2>/dev/null || true
            RC=0
            git fetch -q origin main || RC=$?
          fi
          if [ "$RC" != "0" ]; then
            git remote set-url origin "https://github.com/niknight1403/Agentforge2.git" 2>/dev/null || true
            echo "FETCH-FEHLGESCHLAGEN rc=$RC (Remote-URL aus Sicherheitsgruenden nicht ausgegeben)"
            exit 3
          fi
          # PAT nicht dauerhaft in .git/config speichern oder in spaeteren Logs zeigen.
          git remote set-url origin "https://github.com/niknight1403/Agentforge2.git" 2>/dev/null || true
          PREVIOUS_SHA=$(git rev-parse HEAD)
          SOURCE_UPDATED=0
          ROLLBACK_REQUIRED=0
          rollback_on_error() {
            status=$?
            trap - ERR
            if [ "$ROLLBACK_REQUIRED" = "1" ]; then
              echo "Deploy-Health fehlgeschlagen; stelle vorherigen Stand wieder her."
              git reset --hard "$PREVIOUS_SHA" || true
              systemctl restart "$UNIT" || true
            elif [ "$SOURCE_UPDATED" = "1" ]; then
              echo "Freigabepruefung fehlgeschlagen; stelle vorherigen Quellstand wieder her."
              git reset --hard "$PREVIOUS_SHA" || true
            fi
            exit "$status"
          }
          trap rollback_on_error ERR
          git reset --hard origin/main 2>&1 | head -3
          SOURCE_UPDATED=1
          git log --oneline -1
          echo "== Abhaengigkeiten aktualisieren (falls noetig) =="
          if [ -f package-lock.json ]; then
            npm ci --omit=dev --no-audit --no-fund
          elif [ -f package.json ] && node -e 'const p=require("./package.json");process.exit(Object.keys(p.dependencies||{}).length?0:1)'; then
            npm install --omit=dev --no-audit --no-fund
          else
            echo "Keine Laufzeit-Abhaengigkeiten zu installieren."
          fi
          echo "== Vollstaendige Backend-Tests vor Freigabe =="
          cd "$HUBROOT"
          TEST_LOG=$(mktemp)
          if ! VF_TEST=1 timeout 300 node --test server/tests/*.test.mjs >"$TEST_LOG" 2>&1; then
            tail -n 80 "$TEST_LOG"
            rm -f "$TEST_LOG"
            echo "Backend-Tests fehlgeschlagen; Deploy wird abgebrochen."
            git reset --hard "$PREVIOUS_SHA"
            SOURCE_UPDATED=0
            exit 4
          fi
          tail -n 12 "$TEST_LOG"
          rm -f "$TEST_LOG"
          echo "== Neustart mit gespeicherten Villen-Entscheidungen =="
          ROLLBACK_REQUIRED=1
          systemctl daemon-reload || true
          systemctl restart "$UNIT"
          sleep 6
          echo "== Dienststatus =="
          systemctl is-active "$UNIT"
          echo "== Health/Version lokal =="
          PORT=$(systemctl show "$UNIT" -p Environment --value 2>/dev/null | grep -oE 'PORT=[0-9]+' | cut -d= -f2 || true)
          [ -n "$PORT" ] || PORT=3000
          HEALTH_FILE=$(mktemp)
          curl --fail --silent --show-error --max-time 30 "http://127.0.0.1:${PORT}/api/health" -o "$HEALTH_FILE"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); assert d.get("ok") is True; assert d.get("masterControl")==1; assert "master-control-v1" in d.get("capabilities",[]); print("Lokaler Health-Check: Master-Control aktiv, Version",d.get("version"))' "$HEALTH_FILE"
          rm -f "$HEALTH_FILE"
          ROLLBACK_REQUIRED=0
          SOURCE_UPDATED=0
          trap - ERR
          echo "DEPLOY-ENDE"
          DEP
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/deploy.sh ubuntu@92.5.177.159:/tmp/deploy.sh
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo GT='$GT' GTP='$GTP' bash -c 'export GT GTP; bash /tmp/deploy.sh'"

      - name: Kostenlose LLM-Secrets in den Hub synchronisieren
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          GTP: ${{ secrets.AGENTFORGE_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo GTOKEN='$GTP' GROQ_API_KEY='$GROQ_API_KEY' OPENROUTER_API_KEY='$OPENROUTER_API_KEY' GEMINI_API_KEY='$GEMINI_API_KEY' bash -s" <<'SEED'
          set -euo pipefail
          DBP=$(systemctl show villaforge-hub -p Environment --value 2>/dev/null | grep -oE 'VF_DB=[^ ]+' | cut -d= -f2 || true)
          [ -n "$DBP" ] || DBP=/opt/villaforge/server/data/villaforge.db
          NODEBIN=$(command -v node)
          sudo env GTOKEN="$GTOKEN" GROQ_API_KEY="$GROQ_API_KEY" OPENROUTER_API_KEY="$OPENROUTER_API_KEY" GEMINI_API_KEY="$GEMINI_API_KEY" "$NODEBIN" -e '
          const { DatabaseSync } = require("node:sqlite");
          const db = new DatabaseSync(process.argv[1]);
          const values = {
            GITHUB_TOKEN: process.env.GTOKEN,
            GROQ_API_KEY: process.env.GROQ_API_KEY,
            OPENROUTER_API_KEY: process.env.OPENROUTER_API_KEY,
            GEMINI_API_KEY: process.env.GEMINI_API_KEY
          };
          const synced = [];
          for (const [name, value] of Object.entries(values)) {
            if (typeof value !== "string" || value.length < 8) continue;
            const updated = db.prepare("UPDATE secrets SET value = ?, updated_at = ? WHERE name = ?").run(value, Date.now(), name);
            if (!updated.changes) db.prepare("INSERT INTO secrets (name, value, updated_at) VALUES (?,?,?)").run(name, value, Date.now());
            synced.push(name);
          }
          console.log("Hub-Secret-Namen synchronisiert:", synced.join(", ") || "keine gesetzten LLM-Secrets");
          ' "$DBP"
          SEED

      - name: Hub von aussen verifizieren
        run: |
          sleep 5
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 2 --max-time 15 \
            -o /tmp/h.json -w "health: HTTP %{http_code} in %{time_total}s\n" \
            https://hub.cybersarah-ki.com/api/health
          python3 -c '
          import json
          with open("/tmp/h.json", encoding="utf-8") as f:
              d = json.load(f)
          assert d.get("ok") is True, "Health meldet ok=false"
          assert d.get("masterControl") == 1, "Master-Control ist nicht aktiv"
          assert "master-control-v1" in d.get("capabilities", []), "Master-API-Faehigkeit fehlt"
          print("LIVE-DEPLOY-OK:", d.get("version"), "· Master-Control aktiv ·", d.get("routes"), "Routen")'
