name: Hub-Deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/Tag, der auf die VM soll (Standard main)'
        required: false
        default: 'main'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hub live updaten (git pull + Restart + Version pruefen)
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          GT: ${{ secrets.GITHUB_TOKEN }}
          GTP: ${{ secrets.AGENTFORGE_PAT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          cat > /tmp/deploy.sh <<'DEP'
          set -e
          echo "== Hub-Verzeichnis und Dienst aus systemd ermitteln =="
          UNIT=$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -iE '^(hub|villaforge)' | head -1 || true)
          [ -n "$UNIT" ] || UNIT=hub
          echo "UNIT=$UNIT"
          WD=$(systemctl show "$UNIT" -p WorkingDirectory --value 2>/dev/null | tr -d '"' || true)
          EXEC=$(systemctl show "$UNIT" -p ExecStart --value 2>/dev/null || true)
          MJS=$(echo "$EXEC" | grep -oE '[^ ;"=]*server\.mjs' | head -1 || true)
          if [ -n "$MJS" ] && [ "${MJS:0:1}" = "/" ]; then HUBDIR=$(dirname "$MJS")
          elif [ -n "$WD" ] && [ -n "$MJS" ]; then HUBDIR=$(dirname "$WD/$MJS")
          else HUBDIR=/opt/villaforge/server; fi
          echo "HUBDIR=$HUBDIR (WD=$WD, MJS=$MJS)"
          echo "== Git-Stand vorher =="
          git -C "$HUBDIR/.." log --oneline -1 2>/dev/null || git -C "$HUBDIR" log --oneline -1 2>/dev/null || true
          echo "== git pull (origin main) =="
          HUBROOT=$(cd "$HUBDIR/.." 2>/dev/null && pwd || echo "$HUBDIR")
          cd "$HUBROOT"
          # Remote-URL mit frischem Token versehen, falls der alte
          # eingebettete Token abgelaufen ist (Exit-5-Ursache).
          RC=0
          git fetch -q origin main || RC=$?
          if [ "$RC" != "0" ]; then
            echo "Fetch mit bestehendem Remote fehlgeschlagen (rc=$RC) - setze PAT-Remote."
            git remote set-url origin "https://x-access-token:${GTP}@github.com/niknight1403/AgentForge.git" 2>/dev/null || true
            RC=0
            git fetch -q origin main || RC=$?
          fi
          [ "$RC" = "0" ] || { echo "FETCH-FEHLGESCHLAGEN rc=$RC"; git remote -v | head -2; exit 3; }
          git reset --hard origin/main 2>&1 | head -3
          git log --oneline -1
          echo "== Abhaengigkeiten aktualisieren (falls noetig) =="
          if [ -f package.json ]; then
            npm install --omit=dev --no-audit --no-fund 2>&1 | tail -2 || true
          fi
          echo "== Neustart =="
          systemctl daemon-reload || true
          systemctl restart "$UNIT"
          sleep 6
          echo "== Dienststatus =="
          systemctl is-active "$UNIT"
          echo "== Health/Version lokal =="
          PORT=$(systemctl show "$UNIT" -p Environment --value 2>/dev/null | grep -oE 'PORT=[0-9]+' | cut -d= -f2 || true)
          [ -n "$PORT" ] || PORT=3000
          curl -s -m 30 "http://127.0.0.1:${PORT:-3000}/api/health" | head -c 600; echo
          echo "== Tests auf der VM (Bestandsschutz) =="
          cd "$HUBDIR" && (VF_TEST=1 timeout 300 node --test tests/*.test.mjs 2>&1 | tail -4) || true
          echo "DEPLOY-ENDE"
          DEP
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/deploy.sh ubuntu@92.5.177.159:/tmp/deploy.sh
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo GT='$GT' GTP='$GTP' bash -c 'export GT GTP; bash /tmp/deploy.sh'"

      - name: GitHub-Token fuer Produkt-Repos in den Hub synchronisieren
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          GTP: ${{ secrets.AGENTFORGE_PAT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo GTOKEN='$GTP' bash -s" <<'SEED'
          DBP=$(systemctl show villaforge-hub -p Environment --value 2>/dev/null | grep -oE 'VF_DB=[^ ]+' | cut -d= -f2 || true)
          [ -n "$DBP" ] || DBP=/opt/villaforge/server/data/villaforge.db
          echo "Hub-DB: $DBP"
          NODEBIN=$(command -v node)
          sudo GTOKEN="$GTOKEN" "$NODEBIN" -e "
          const { DatabaseSync } = require('node:sqlite');
          const db = new DatabaseSync('$DBP');
          const v = process.env.GTOKEN;
          const r = db.prepare('UPDATE secrets SET value = ?, updated_at = ? WHERE name = ?').run(v, 0, 'GITHUB_TOKEN');
          if (r.changes === 0) db.prepare('INSERT INTO secrets (name, value, updated_at) VALUES (?,?,?)').run('GITHUB_TOKEN', v, 0);
          console.log('GITHUB_TOKEN im Hub hinterlegt.');
          "
          SEED

      - name: Hub von aussen verifizieren
        run: |
          sleep 5
          curl -s -m 60 -o /tmp/h.json -w "health: HTTP %{http_code} in %{time_total}s\n" https://hub.cybersarah-ki.com/api/health
          python3 -c "
          import json
          d = json.load(open('/tmp/h.json'))
          print('LIVE-VERSION:', d.get('version'), '| Agenten:', d.get('agents'), '| Villen:', d.get('villas'))
          assert '1.41' in str(d.get('version','')), 'Live-Version ist nicht 1.41.x!'
          print('LIVE-DEPLOY-OK')"
