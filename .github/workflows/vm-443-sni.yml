name: VM 443 SNI Routing (Postgres)

# Postgres-TLS ueber Port 443 per SNI-Routing — umgeht die geschlossene
# OCI-Security-List. hub.* -> Web (127.0.0.1:9443), alles andere -> Postgres.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: SSH-Key einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: SNI-Setup auf VM ausfuehren
        env:
          SNI_B64: 
          VM_PG_PW: ${{ secrets.VM_PG_PW }}
        run: |
          printf '%s' "$SNI_B64" | base64 -d > /tmp/sni-setup.sh
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/sni-setup.sh ubuntu@92.5.177.159:/tmp/sni-setup.sh
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo VM_PG_PW='$VM_PG_PW' bash /tmp/sni-setup.sh"

      - name: Externer Render-Sicht-Test (Postgres via 443)
        env:
          VM_PG_PW: ${{ secrets.VM_PG_PW }}
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          PGPASSWORD="$VM_PG_PW" psql "host=www.cybersarah-ki.com port=443 user=ccc_app dbname=cybersarah sslmode=require" -tAc "SELECT 'EXTERN-PG-443: '||current_database()" && echo "RENDER-SICHT: POSTGRES UEBER 443 ERREICHBAR" || echo "FEHLER: extern nicht erreichbar"
