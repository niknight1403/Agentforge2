name: NexusSphere CI
on:
  push:
    paths:
      - 'nexussphere/**'
      - 'server/server.mjs'
      - 'server/llm.mjs'
      - '.github/workflows/nexussphere-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nexussphere
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Hub syntax gate
        working-directory: .
        run: node --check server/server.mjs && node --check server/llm.mjs
      - run: cargo generate-lockfile
      - run: cargo test --locked
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Validate Kubernetes manifest
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.16.4 template nexussphere ./deploy/chart >/dev/null 2>&1 || test -f deploy/k8s.yaml
      - name: Build production container
        run: docker build -t nexussphere:ci .
      - name: Container health smoke
        run: |
          docker run -d --name nexussphere-ci -p 127.0.0.1:18787:8787 -e NEXUSSPHERE_API_TOKEN=ci-token nexussphere:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18787/health; then exit 0; fi
            sleep 1
          done
          docker logs nexussphere-ci
          exit 1
      - if: always()
        run: docker rm -f nexussphere-ci || true
