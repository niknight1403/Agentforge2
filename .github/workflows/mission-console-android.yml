name: Mission Console Android candidate
on:
  push:
    branches: [codex/mission-console-android-release]
    paths:
      - 'mission-console-android/**'
      - '.github/workflows/mission-console-android.yml'
  pull_request:
    paths:
      - 'mission-console-android/**'
      - '.github/workflows/mission-console-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - run: gradle -p mission-console-android :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mission-console-v1.0.0-debug-apk
          path: mission-console-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
