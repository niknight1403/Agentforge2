name: VM DB Seed (CyberSarah)

# Wendet die Drizzle-Migrationen auf dem VM-Postgres an (localhost, kein
# externer Port noetig) und provisioniert das Admin-Konto idempotent.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  db-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: CyberSarah-Repo auschecken
        uses: actions/checkout@v7
        with:
          repository: niknight1403/CyberSarah-Control-Center
          token: ${{ secrets.AGENTFORGE_PAT }}
          path: ccc

      - name: SSH-Key einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Bundle bauen (Migrationen + Seed-Skript)
        env:
          SEED_B64: 
        run: |
          mkdir -p bundle
          cp ccc/drizzle/*.sql bundle/
          printf '%s' "$SEED_B64" | base64 -d > bundle/db-seed.sh
          tar -czf /tmp/db-bundle.tgz -C bundle .
          echo "Bundle: $(ls bundle | wc -l) Dateien"

      - name: Auf VM ausfuehren
        env:
          VM_PG_PW: ${{ secrets.VM_PG_PW }}
          CCC_ADMIN_PW: ${{ secrets.CCC_ADMIN_PW }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/db-bundle.tgz ubuntu@92.5.177.159:/tmp/db-bundle.tgz
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo mkdir -p /tmp/dbseed && sudo tar -xzf /tmp/db-bundle.tgz -C /tmp/dbseed && sudo VM_PG_PW='$VM_PG_PW' CCC_ADMIN_PW='$CCC_ADMIN_PW' bash /tmp/dbseed/db-seed.sh"
