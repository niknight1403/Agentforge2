name: Free LLM acceptance
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/free-llm-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-llm-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VF_LLM_FREE_ONLY: '1'
      VF_REQUIRE_LIVE_LLM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run test:llm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
