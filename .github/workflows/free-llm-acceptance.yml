name: Free LLM acceptance
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/free-llm-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-llm-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VF_LLM_FREE_ONLY: '1'
      VF_REQUIRE_LIVE_LLM: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:syntax
      - run: npm test
      - run: npm run build:web
      - run: npm run test:llm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:live
      - run: npm run test:design
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/live-e2e/
            artifacts/design-audit/
          retention-days: 3
  production:
    needs: [acceptance, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/live-llm-smoke.mjs
        env:
          VF_SMOKE_BASE_URL: https://hub.cybersarah-ki.com
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
