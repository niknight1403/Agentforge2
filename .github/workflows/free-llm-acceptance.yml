name: Free LLM acceptance
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/free-llm-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: free-llm-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VF_LLM_FREE_ONLY: '1'
      VF_REQUIRE_LIVE_LLM: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:syntax
      - run: npm test
      - run: npm run build:web
      - name: Verify free provider credentials are configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          found=0
          for key in GEMINI_API_KEY GROQ_API_KEY OPENROUTER_API_KEY; do
            if [ -n "${!key}" ]; then
              echo "$key: configured"
              found=1
            else
              echo "$key: missing"
            fi
          done
          test "$found" = 1
      - run: npm run test:llm
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:live
      - run: npm run test:design
        if: success() || failure()
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/live-e2e/
            artifacts/design-audit/
          retention-days: 3
  production:
    needs: [acceptance, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/live-llm-smoke.mjs
        env:
          VF_SMOKE_BASE_URL: https://hub.cybersarah-ki.com
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
