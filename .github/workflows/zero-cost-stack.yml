name: Zero-Cost Stack Validation

on:
  pull_request:
    paths:
      - "infrastructure/zero-cost-stack/**"
      - ".github/workflows/zero-cost-stack.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/zero-cost-stack/**"
      - ".github/workflows/zero-cost-stack.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          find infrastructure/zero-cost-stack/scripts infrastructure/zero-cost-stack/config/postgres/init -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate JSON
        run: |
          find infrastructure/zero-cost-stack -type f -name '*.json' -print0 | xargs -0 -r -n1 jq empty
      - name: Validate local AI workflow safety and output contract
        run: |
          workflow=infrastructure/zero-cost-stack/workflows/webhook-to-llm-pipeline.json
          jq -e '
            .active == false and
            ([.nodes[] | select(.name == "Incoming AI Task") | (.parameters.authentication // "none")] == ["none"]) and
            ([.nodes[] | select(.name == "Validate Input") | .parameters.jsCode] | any(contains("task.length > 12000"))) and
            ([.nodes[] | select(.name == "Validate JSON Result") | .parameters.jsCode] | any(contains("required") and contains("recommendations"))) and
            ([.nodes[] | select(.name == "Local Ollama") | .parameters.url] | any(. == "http://ollama:11434/api/generate"))
          ' "$workflow" >/dev/null
          echo "Workflow remains inactive until an authentication credential is configured; input/output contracts validated."
      - name: Enforce local-only exposure and trusted-flow boundary
        run: |
          compose=infrastructure/zero-cost-stack/docker-compose.yml
          env_example=infrastructure/zero-cost-stack/.env.example
          caddy=infrastructure/zero-cost-stack/config/Caddyfile
          grep -Fq '127.0.0.1:11434:11434' "$compose"
          grep -Fq '127.0.0.1:5678:5678' "$compose"
          grep -Fq '127.0.0.1:8080:80' "$compose"
          grep -Fq '127.0.0.1:8010:8010' "$compose"
          grep -Fq 'HTTP_BIND=127.0.0.1' "$env_example"
          grep -Fq 'HTTPS_BIND=127.0.0.1' "$env_example"
          grep -Fq 'AP_EXECUTION_MODE: UNSANDBOXED' "$compose"
          site_blocks="$(grep -E '^[[:space:]]*https?://' "$caddy" | sed -E 's/^[[:space:]]*//; s/[[:space:]]*\{$//')"
          expected_site_blocks="$(cat <<'EOF'
http://automation.localhost
http://n8n.localhost
EOF
)"
          if [[ "$site_blocks" != "$expected_site_blocks" ]]; then
            echo "Unexpected Caddy site address; only the two local hostnames are allowed." >&2
            printf '%s\n' "Found:" "$site_blocks" >&2
            exit 1
          fi
          echo "Loopback default binds, exact local Caddy host allowlist and unsandboxed Activepieces warning boundary validated."
      - name: Validate Compose configuration
        run: |
          cd infrastructure/zero-cost-stack
          cp .env.example .env
          docker compose config --quiet
