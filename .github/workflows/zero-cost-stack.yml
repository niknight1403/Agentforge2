name: Zero-Cost Stack Validation

on:
  pull_request:
    paths:
      - "infrastructure/zero-cost-stack/**"
      - ".github/workflows/zero-cost-stack.yml"
  push:
    branches: [main]
    paths:
      - "infrastructure/zero-cost-stack/**"
      - ".github/workflows/zero-cost-stack.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          find infrastructure/zero-cost-stack/scripts infrastructure/zero-cost-stack/config/postgres/init -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Validate JSON
        run: |
          find infrastructure/zero-cost-stack -type f -name '*.json' -print0 | xargs -0 -r -n1 jq empty
      - name: Validate local AI workflow safety and output contract
        run: |
          workflow=infrastructure/zero-cost-stack/workflows/webhook-to-llm-pipeline.json
          jq -e '
            .active == false and
            ([.nodes[] | select(.name == "Incoming AI Task") | .parameters.authentication // "none"] | length == 1) and
            ([.nodes[] | select(.name == "Validate Input") | .parameters.jsCode] | any(contains("task.length > 12000"))) and
            ([.nodes[] | select(.name == "Validate JSON Result") | .parameters.jsCode] | any(contains("required") and contains("recommendations"))) and
            ([.nodes[] | select(.name == "Local Ollama") | .parameters.url] | any(. == "http://ollama:11434/api/generate"))
          ' "$workflow" >/dev/null
          echo "Workflow remains inactive until an authentication credential is configured; input/output contracts validated."
      - name: Validate Compose configuration
        run: |
          cd infrastructure/zero-cost-stack
          cp .env.example .env
          docker compose config --quiet
