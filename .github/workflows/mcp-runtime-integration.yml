name: MCP Runtime Integration Tests

on:
  pull_request:
    branches:
      - feat/mcp-deployment-owned-rootless-profiles
    paths:
      - "server/mcp-*.mjs"
      - "server/tests/mcp-*.test.mjs"
      - "server/server.mjs"
      - "server/agents.mjs"
      - "server/packs.mjs"
      - "server/tests/packs.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.agent-mesh.yml"
      - "docker-compose.mcp-hardening.yml"
      - "Dockerfile.agentforge"
      - ".github/workflows/mcp-runtime-integration.yml"
  push:
    branches:
      - feat/mcp-hub-admin-integration
    paths:
      - "server/mcp-*.mjs"
      - "server/tests/mcp-*.test.mjs"
      - "server/server.mjs"
      - "server/agents.mjs"
      - "server/packs.mjs"
      - "server/tests/packs.test.mjs"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.agent-mesh.yml"
      - "docker-compose.mcp-hardening.yml"
      - "Dockerfile.agentforge"
      - ".github/workflows/mcp-runtime-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-runtime-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked production dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate MCP runtime deployment Compose overlay
        env:
          MESH_POSTGRES_PASSWORD: ci-placeholder-only
          AGENTFORGE_TELEMETRY_TOKEN: ci-placeholder-only
          AGENTFORGE_MESH_TOKEN: ci-placeholder-only
        run: |
          docker compose -f docker-compose.agent-mesh.yml -f docker-compose.mcp-hardening.yml config --quiet
      - name: Syntax-check MCP runtime and agent gateway
        run: |
          node --check server/server.mjs
          node --check server/agents.mjs
          node --check server/packs.mjs
          for file in server/mcp-*.mjs server/tests/mcp-*.test.mjs; do
            node --check "$file"
          done
      - name: Run MCP runtime and agent pack regression tests
        run: node --import ./server/tests/_env.mjs --test server/tests/mcp-*.test.mjs server/tests/packs.test.mjs

  # Exercise the actual rootless container runtime, not a mocked spawn process.
  mcp-rootless-podman:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install rootless Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          if ! grep -q "^$(id -un):" /etc/subuid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subuid
          fi
          if ! grep -q "^$(id -un):" /etc/subgid; then
            echo "$(id -un):100000:65536" | sudo tee -a /etc/subgid
          fi
      - name: Verify rootless Podman
        run: |
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"
      - name: Build isolated MCP fixture image
        run: |
          podman build --network=host \
            --file server/tests/fixtures/mcp-podman-stdio/Containerfile \
            --tag localhost/agentforge-mcp-fixture:ci \
            server/tests/fixtures/mcp-podman-stdio
          digest="$(podman image inspect --format '{{.Digest}}' localhost/agentforge-mcp-fixture:ci)"
          test -n "$digest"
          echo "MCP_PODMAN_INTEGRATION_IMAGE=localhost/agentforge-mcp-fixture@$digest" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Exercise real rootless Podman MCP lifecycle
        run: node --import ./server/tests/_env.mjs --test server/tests/mcp-podman-rootless.integration.test.mjs
