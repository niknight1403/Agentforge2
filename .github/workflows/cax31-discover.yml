name: CAX31-Discovery (IP-Suche auf Oracle-VM)
on:
  workflow_dispatch:
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nach CAX31-IP-Spuren suchen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "bash -s" <<'EOS'
          echo "== known_hosts (Contabo-Ranges 2.x) =="
          grep -oE "2\.[0-9]+\.[0-9]+\.[0-9]+" ~/.ssh/known_hosts 2>/dev/null | sort -u
          echo "== bash_history ssh-Zeilen mit IPs =="
          grep -oE "ssh[^\n]*2\.[0-9]+\.[0-9]+\.[0-9]+" ~/.bash_history 2>/dev/null | grep -oE "2\.[0-9]+\.[0-9]+\.[0-9]+" | sort -u
          echo "== sudo bash_history =="
          sudo grep -oE "2\.[0-9]+\.[0-9]+\.[0-9]+" /root/.bash_history 2>/dev/null | sort -u
          echo "== UFW-Regeln Port 11434 =="
          sudo ufw status 2>/dev/null | grep 11434
          echo "== auth.log: Accept-Quellen der letzten 7 Tage (unique) =="
          sudo journalctl -u ssh --since "7 days ago" --no-pager 2>/dev/null | grep -oE "from [0-9.]+" | sort | uniq -c | sort -rn | head -12
          echo "== Hub-DB: alle Routen =="
          python3 -c "
          import sqlite3
          con = sqlite3.connect('/opt/villaforge/server/data/villaforge.db')
          for r in con.execute('SELECT name, base_url, model, enabled, priority FROM routes ORDER BY priority').fetchall():
              print('  ', r)
          "
          EOS
