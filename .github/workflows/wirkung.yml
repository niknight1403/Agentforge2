name: Wirkungsmessung

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Messen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 'echo "" | base64 -d | sudo bash -c "node -"'
