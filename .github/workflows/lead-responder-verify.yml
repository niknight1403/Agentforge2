name: Lead Responder - Verify
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retry- und Zustellpfad auf dem Server pruefen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ServerAliveInterval=15 ubuntu@92.5.177.159 'sudo bash -s' <<'EOS'
          set -uo pipefail
          APP=/opt/lead-responder
          KEY=$(grep -m1 '^ADMIN_API_KEY=' "$APP/.env" | cut -d= -f2-)
          API=http://127.0.0.1:8080/api/v1
          j() { python3 -c "import json,sys;d=json.load(sys.stdin);print($1)" 2>/dev/null || echo "PARSE_ERROR"; }
          echo "== Schritt 1: Mandant mit kaputtem CRM-Webhook =="
          C=$(curl -sS -X POST "$API/clients" -H "x-admin-key: $KEY" -H 'content-type: application/json' -d '{"name":"Verify Retry","system_prompt":"Dachdeckerei Test.","webhook_outbound_url":"https://httpbin.org/status/500"}')
          CID=$(printf '%s' "$C" | j 'd["client"]["id"]')
          CK=$(printf '%s' "$C" | j 'd["api_key"]')
          L1=$(curl -sS -m 40 -X POST "$API/lead/inbound" -H "x-api-key: $CK" -H 'content-type: application/json' -d '{"name":"Retry Test","email":"retry@example.com","inquiry":"Dach ist undicht, Angebot bitte, Aachen."}')
          echo "lead1: $(printf '%s' "$L1" | j 'd.get("status")+" | delivered="+str(d.get("delivered"))+" | degraded="+str(d.get("degraded"))')"
          LID=$(printf '%s' "$L1" | j 'd["lead_id"]')
          echo "== Schritt 2: Webhook reparieren und Cron-Zyklus erzwingen =="
          curl -sS -o /dev/null -X PATCH "$API/clients/$CID" -H "x-admin-key: $KEY" -H 'content-type: application/json' -d '{"webhook_outbound_url":"https://httpbin.org/post"}'
          sleep 80
          echo "scan: $(curl -sS -X POST "$API/admin/scan" -H "x-admin-key: $KEY" | head -c 300)"
          sleep 3
          D=$(curl -sS "$API/leads/$LID" -H "x-admin-key: $KEY")
          echo "lead1 nach Scan: $(printf '%s' "$D" | j 'd["lead"]["status"]+" | last_error="+str(d["lead"].get("last_error"))[:60]')"
          echo "== Schritt 3: Zustellhistorie =="
          curl -sS "$API/admin/deliveries?limit=4" -H "x-admin-key: $KEY" | head -c 700; echo
          echo "== Schritt 4: Stats =="
          curl -sS "$API/stats" -H "x-admin-key: $KEY" | head -c 400; echo
          echo "== Schritt 5: Aufraeumen =="
          curl -sS -o /dev/null -X DELETE "$API/clients/$CID" -H "x-admin-key: $KEY"; echo "verify-client geloescht"
          EOS
