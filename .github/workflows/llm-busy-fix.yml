name: LLM-Busy-Fix (Repo-Deploy, Parallelitaet, Verifikation)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repo laden (enthiel haelt Hub-Snapshot)
        uses: actions/checkout@v4
      - name: Datei pruefen und auf VM uebertragen
        run: |
          set -euo pipefail
          test -f hub-snapshot/agents.mjs
          grep -q "llmBusyWait" hub-snapshot/agents.mjs && echo "Busy-Patch im Snapshot vorhanden"
          grep -q "getSetting('reapMinutes'" hub-snapshot/agents.mjs && echo "Reaper-Patch im Snapshot vorhanden"
          mkdir -p ~/.ssh
          printf '%s\n' "${ORACLE_SSH_KEY}" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          scp -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 hub-snapshot/agents.mjs ubuntu@92.5.177.159:/tmp/agents.mjs.new
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
      - name: Backup, Einsatz, Hub-Env, Neustart
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          F=/opt/villaforge/server/agents.mjs
          echo "== Backup =="
          cp "$F" "$F.bak-$(date +%Y%m%d-%H%M%S)" && ls -1 "$F".bak-* | tail -1
          echo "== Syntax-Check des neuen Moduls =="
          node --check /tmp/agents.mjs.new && echo "Node-Syntax OK"
          echo "== Einsatz =="
          cp /tmp/agents.mjs.new "$F"
          grep -c "llmBusyWait" "$F"
          echo "== Hub-Env: OLLAMA_MAX_PARALLEL=2 =="
          mkdir -p /etc/systemd/system/villaforge-hub.service.d
          printf '[Service]\nEnvironment="OLLAMA_MAX_PARALLEL=2"\n' > /etc/systemd/system/villaforge-hub.service.d/llmparallel.conf
          systemctl daemon-reload
          systemctl restart villaforge-hub.service
          sleep 25
          systemctl is-active villaforge-hub.service
          curl -s -m 10 http://localhost:12000/api/health -o /dev/null -w "Health HTTP %{http_code}\n"
          EOS
      - name: "Ollama-Knoten: OLLAMA_NUM_PARALLEL=2"
        env:
          CAX_SSH_KEY: ${{ secrets.CAX_SSH_KEY }}
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$CAX_SSH_KEY" > ~/.ssh/cax_key
          chmod 600 ~/.ssh/cax_key
          for N in 2.31.45.241 2.31.64.65 2.28.12.63 2.31.77.72; do
            if ssh -i ~/.ssh/cax_key -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@$N \
              "mkdir -p /etc/systemd/system/ollama.service.d && printf '[Service]\nEnvironment=\"OLLAMA_NUM_PARALLEL=2\"\n' > /etc/systemd/system/ollama.service.d/numparallel.conf && systemctl daemon-reload && systemctl restart ollama && sleep 3 && systemctl is-active ollama"; then
              echo "  $N: OK"
            else
              echo "  $N: FEHLGESCHLAGEN (weiter)"
            fi
          done
      - name: 12-Min-Verifikation
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ServerAliveInterval=15 -o ServerAliveCountMax=60 ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          sleep 300
          cat > /tmp/verify.py <<'PYV'
          import sqlite3
          con = sqlite3.connect('/opt/villaforge/server/data/villaforge.db')
          cur = con.cursor()
          print("Villen:", cur.execute("SELECT status, COUNT(*) FROM villas GROUP BY status").fetchall())
          done = cur.execute("SELECT COUNT(*) FROM tasks WHERE status='DONE' AND (updated_at > datetime('now','-12 minutes') OR updated_at > strftime('%Y-%m-%dT%H:%M','now','-12 minutes'))").fetchone()[0]
          print("DONE letzte 12 Min:", done)
          print("RUNNING-Tasks je Villa:", cur.execute("SELECT villa_id, COUNT(*) FROM tasks WHERE status='RUNNING' GROUP BY villa_id").fetchall())
          PYV
          python3 /tmp/verify.py
          sleep 240
          echo "--- Zweite Messung ---"
          python3 /tmp/verify.py
          echo "== Hub-Log (BUSY-Meldungen jetzt sichtbar?) =="
          journalctl -u villaforge-hub.service --since "13 min ago" --no-pager | grep -iE "BUSY|drossel|dauerentw|reaper" | tail -12
          EOS
