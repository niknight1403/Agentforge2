name: HF-Route (Hugging Face Router in die Kaskade)
on:
  workflow_dispatch:
jobs:
  hf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: HF-Route anlegen und pruefen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 ubuntu@92.5.177.159 "sudo bash -s" <<'EOS'
          set -uo pipefail
          # HF-Router als freie Cloud-Fallback-Stufe (P50, NACH den lokalen Routen —
          # Local-First bleibt: 3B/7B/32B lokal, HF nur wenn alle lokalen gesaettigt).
          python3 - <<'PYV'
          import sqlite3
          con = sqlite3.connect('/opt/villaforge/server/data/villaforge.db')
          cur = con.cursor()
          cur.execute("DELETE FROM routes WHERE name='HF Router'")
          cur.execute("""INSERT INTO routes (name, provider, base_url, model, key_env, is_free, enabled, priority, weight, status, ok, fail, last_used)
                         VALUES ('HF Router','huggingface','https://router.huggingface.co/v1','meta-llama/Llama-3.3-70B-Instruct','HF_TOKEN',1,1,50,1,'OK',1,0,0)""")
          con.commit()
          print("HF-Route:", cur.execute("SELECT id,name,base_url,model,key_env,priority,enabled FROM routes WHERE name='HF Router'").fetchone())
          print("Kaskade:", cur.execute("SELECT id,name,priority,enabled FROM routes ORDER BY priority").fetchall())
          tok = cur.execute("SELECT COUNT(*) FROM secrets WHERE name='HF_TOKEN'").fetchone()[0]
          print("HF_TOKEN in Secrets-Store:", bool(tok))
          PYV
          echo "== HF_TOKEN im Hub-Environment? =="
          systemctl show villaforge-hub.service -p Environment | grep -o "HF_TOKEN" || echo "nicht gesetzt (Route wartet auf Token, Kaskade ueberspringt sie automatisch)"
          EOS
