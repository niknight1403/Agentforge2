name: Oracle Ops
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag, bootstrap, extern, routes, tune, apitune, agivilla, cybervilla, seed, cmd, token oder sys'
        default: 'diag'
        required: true
      command:
        description: 'SSH-Befehl fuer mode=cmd'
        default: ''
        required: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd
      - name: Setup Hub-Login
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: |
          VF=$(curl -s -m 30 -X POST -H "Content-Type: application/json" \
            -d "{\"email\":\"$VF_ADMIN_EMAIL\",\"password\":\"$VF_ADMIN_PASSWORD\"}" \
            https://hub.cybersarah-ki.com/api/auth/login \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("token",""))' 2>/dev/null || echo "")
          echo "VF=$VF" >> "$GITHUB_ENV"
          if [ -z "$VF" ]; then echo "Hub-Login fehlgeschlagen"; fi
      - name: Diagnose (diag)
        if: ${{ github.event.inputs.mode == 'diag' }}
        run: |
          bash /tmp/sshcmd "echo '== cloud-init =='; sudo cloud-init status 2>&1 | head -2; echo '== /opt =='; ls /opt/villaforge 2>&1 | head -6; echo '== Dienste =='; systemctl is-active villaforge-hub ollama 2>&1; echo '== Status-Datei =='; sudo cat /var/lib/ollama-bootstrap.status 2>&1; true"
      - name: Bootstrap starten (detached)
        if: ${{ github.event.inputs.mode == 'bootstrap' }}
        env:
          ORACLE_BOOTSTRAP: ${{ secrets.ORACLE_BOOTSTRAP }}
        run: |
          printf '%s' "$ORACLE_BOOTSTRAP" > /tmp/boot.sh
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i ~/.ssh/oracle_key /tmp/boot.sh ubuntu@92.5.177.159:/tmp/boot.sh
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "chmod +x /tmp/boot.sh && sudo setsid nohup bash /tmp/boot.sh >/dev/null 2>&1 < /dev/null & sleep 3; pgrep -af boot.sh | head -3; echo BOOTSTART-OK"
          echo "Bootstrap laeuft jetzt abgekoppelt auf der Instanz"
      - name: Routen-Check (routes)
        if: ${{ github.event.inputs.mode == 'routes' }}
        run: |
          echo '---VILLAS---'
          curl -s -m 20 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/villas | head -c 600
          echo; echo '---ROUTES---'
          curl -s -m 20 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/routes
          echo; true
      - name: Route tunen (tune)
        if: ${{ github.event.inputs.mode == 'tune' }}
        run: |
          for ID in $(curl -s -m 20 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/routes | python3 -c 'import json,sys; print(" ".join(str(r["id"]) for r in json.load(sys.stdin) if "ollama" in r["base_url"].lower()))'); do
            curl -s -m 20 -X PATCH -H "Authorization: Bearer $VF" -H "Content-Type: application/json" -d '{"priority": 40}' https://hub.cybersarah-ki.com/api/routes/$ID; echo
          done
          echo '--- ROUTES NACH TUNING ---'
          curl -s -m 20 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/routes | python3 -c 'import json,sys; [print(r["id"], r["name"], "Prio", r["priority"]) for r in json.load(sys.stdin)]'; true
      - name: API-Tuning (apitune)
        if: ${{ github.event.inputs.mode == 'apitune' }}
        run: |
          echo "== Routes via oeffentliche API (Timeout 150s) =="
          ROUTES=$(curl -s -m 150 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/routes) || true
          echo "$ROUTES" | head -c 300; echo
          IDS=$(echo "$ROUTES" | python3 -c 'import json,sys; rs=json.load(sys.stdin); print(" ".join(str(r["id"]) for r in rs if "ollama" in r.get("base_url","").lower() and r.get("priority",0) < 40))' 2>/dev/null || true)
          echo "Zu tiefpriorisierende Ollama-Routen: $IDS"
          for ID in $IDS; do
            curl -s -m 150 -X PATCH -H "Authorization: Bearer $VF" -H "Content-Type: application/json" -d '{"priority": 40}' "https://hub.cybersarah-ki.com/api/routes/$ID"; echo
          done
          echo "== Routes danach =="
          curl -s -m 150 -H "Authorization: Bearer $VF" https://hub.cybersarah-ki.com/api/routes | python3 -c 'import json,sys; [print(r["id"], r["name"], "Prio", r["priority"]) for r in json.load(sys.stdin)]' 2>/dev/null || echo "(Lesefehler)"

      - name: Checkout fuer Villa-Setups
        if: ${{ github.event.inputs.mode == 'agivilla' || github.event.inputs.mode == 'cybervilla' }}
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: AGI-Villa einrichten (agivilla)
        if: ${{ github.event.inputs.mode == 'agivilla' }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key ops/mk-agi-villa.sh ubuntu@92.5.177.159:/tmp/mk-agi-villa.sh
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key ops/agi-villa.json ubuntu@92.5.177.159:/tmp/agi-villa.json
          bash /tmp/sshcmd "chmod +x /tmp/mk-agi-villa.sh && rm -f /tmp/agi-status.txt && sudo setsid nohup bash /tmp/mk-agi-villa.sh >/tmp/agi-setup.log 2>&1 < /dev/null & echo Setup im Hintergrund gestartet"
      - name: CyberSarah-Villa einrichten (cybervilla)
        if: ${{ github.event.inputs.mode == 'cybervilla' }}
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key ops/mk-cybersarah-villa.sh ubuntu@92.5.177.159:/tmp/mk-cybersarah-villa.sh
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key ops/cybersarah-villa.json ubuntu@92.5.177.159:/tmp/cybersarah-villa.json
          bash /tmp/sshcmd "chmod +x /tmp/mk-cybersarah-villa.sh && rm -f /tmp/cybersarah-status.txt && sudo setsid nohup bash /tmp/mk-cybersarah-villa.sh >/tmp/cybersarah-setup.log 2>&1 < /dev/null & echo Setup im Hintergrund gestartet"
      - name: Hub seeden (seed)
        if: ${{ github.event.inputs.mode == 'seed' }}
        env:
          VF_HUBENV: ${{ secrets.VF_HUBENV }}
          VF_SYNCSRC: ${{ secrets.VF_SYNCSRC }}
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: |
          printf '%s' "$VF_HUBENV" > /tmp/old-hub.env
          printf '%s' "$VF_SYNCSRC" > /tmp/villa-sync.mjs
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/old-hub.env /tmp/villa-sync.mjs ubuntu@92.5.177.159:/tmp/
          cat > /tmp/seed.sh <<'SEED'
          set -e
          DEST=/opt/villaforge
          # 1) Login am lokalen Hub
          TOK=$(curl -s -m 15 -X POST -H 'Content-Type: application/json' \
            -d "{\"email\":\"$(sudo grep '^VF_ADMIN_EMAIL=' $DEST/hub.env | cut -d= -f2)\",\"password\":\"$(sudo grep '^VF_ADMIN_PASSWORD=' $DEST/hub.env | cut -d= -f2)\"}" \
            http://127.0.0.1:12000/api/auth/login | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          [ -n "$TOK" ] || { echo LOGIN-FEHLGESCHLAGEN; exit 1; }
          echo LOGIN-OK
          # 2) LLM-Keys aus altem hub.env in Secrets-Store pflanzen
          for NAME in GROQ_API_KEY GEMINI_API_KEY CEREBRAS_API_KEY MISTRAL_API_KEY TOGETHER_API_KEY OPENROUTER_API_KEY; do
            VAL=$(grep "^${NAME}=" /tmp/old-hub.env | head -1 | cut -d= -f2-)
            if [ -n "$VAL" ]; then
              python3 - "$NAME" "$VAL" "$TOK" <<'PY'
          import json, sys, urllib.request
          name, val, tok = sys.argv[1], sys.argv[2], sys.argv[3]
          req = urllib.request.Request('http://127.0.0.1:12000/api/secrets',
              data=json.dumps({'name': name, 'value': val}).encode(), method='POST',
              headers={'Authorization': 'Bearer ' + tok, 'Content-Type': 'application/json'})
          print('SECRET', name, 'gesetzt:', urllib.request.urlopen(req).status)
          PY
            else
              echo "SECRET $NAME nicht im alten hub.env gefunden"
            fi
          done
          # 3) Secrets-Store anzeigen (nur Namen)
          curl -s -m 10 -H "Authorization: Bearer $TOK" http://127.0.0.1:12000/api/secrets; echo
          # 4) villa-sync.mjs installieren + Timer (10 Min)
          sudo mv /tmp/villa-sync.mjs $DEST/villa-sync.mjs
          sudo chmod 644 $DEST/villa-sync.mjs
          sudo tee /etc/systemd/system/villaforge-sync.service >/dev/null <<UNIT2
          [Unit]
          Description=VillaForge AutoDev Sync
          After=villaforge-hub.service network-online.target
          [Service]
          Type=oneshot
          ExecStart=$(command -v node) $DEST/villa-sync.mjs
          TimeoutStartSec=25min
          UNIT2
          sudo tee /etc/systemd/system/villaforge-sync.timer >/dev/null <<UNIT3
          [Unit]
          Description=VillaForge AutoDev Sync Takt
          [Timer]
          OnBootSec=3min
          OnUnitActiveSec=10min
          [Install]
          WantedBy=timers.target
          UNIT3
          sudo systemctl daemon-reload
          sudo systemctl enable --now villaforge-sync.timer
          systemctl is-active villaforge-sync.timer
          # 5) Beide Villas orchestrieren (Rat aktiv)
          for VID in $(curl -s -m 10 -H "Authorization: Bearer $TOK" http://127.0.0.1:12000/api/villas | python3 -c 'import json,sys; print(" ".join(str(v["id"]) for v in json.load(sys.stdin)))'); do
            echo "Orchestriere Villa #$VID:"; curl -s -m 20 -X POST -H "Authorization: Bearer $TOK" http://127.0.0.1:12000/api/villas/$VID/orchestrate | head -c 120; echo
          done
          echo SEED-FERTIG
          SEED
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/seed.sh ubuntu@92.5.177.159:/tmp/seed.sh
          bash /tmp/sshcmd "bash /tmp/seed.sh"
      - name: Beliebiger SSH-Befehl (cmd)
        if: ${{ github.event.inputs.mode == 'cmd' }}
        run: |
          CMD="\${{ github.event.inputs.command }}"
          if [ -z "$CMD" ]; then echo "Kein command-Input gegeben."; exit 1; fi
          bash /tmp/sshcmd "$CMD"
      - name: Hub-Status (token)
        if: ${{ github.event.inputs.mode == 'token' }}
        run: |
          bash /tmp/sshcmd "systemctl is-active villaforge-hub; curl -s -m 8 http://127.0.0.1:12000/api/health | head -c 300; true"
          echo; echo "== Oeffentlich =="
          curl -s -m 10 https://hub.cybersarah-ki.com/api/health | head -c 300
          true
      - name: Ollama-Systemcheck (sys)
        if: ${{ github.event.inputs.mode == 'sys' }}
        run: |
          bash /tmp/sshcmd "echo '== Lokaler Hub =='; curl -s -m 5 http://127.0.0.1:12000/api/health; echo; echo '== Dienst =='; sudo systemctl is-active villaforge-hub; sudo systemctl is-active ollama; echo '== Ollama-Modelle =='; curl -s -m 8 http://127.0.0.1:11434/api/tags | head -c 500; echo; echo '== Public IP =='; curl -s -m 8 https://ifconfig.me; echo"
      - name: Extern-Check (extern)
        if: ${{ github.event.inputs.mode == 'extern' }}
        run: |
          echo "== Hub von aussen (HTTPS) =="
          curl -s -m 10 https://hub.cybersarah-ki.com/api/health || echo "Hub von aussen NICHT erreichbar"
          echo
          echo "== Ollama von aussen (HTTPS, 401 ohne Token erwartet) =="
          curl -s -m 10 -o /dev/null -w "HTTP %{http_code}\n" https://ollama.cybersarah-ki.com/v1/models || true
