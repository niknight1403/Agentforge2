name: Oracle Ops
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diag, bootstrap, extern oder sys'
        default: 'diag'
        required: true

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@152.70.8.227 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd
      - name: Diagnose (diag)
        if: ${{ github.event.inputs.mode == 'diag' }}
        run: |
          bash /tmp/sshcmd "echo '== cloud-init =='; sudo cloud-init status 2>&1 | head -2; echo '== /opt =='; ls /opt/villaforge 2>&1 | head -6; echo '== Dienste =='; systemctl is-active villaforge ollama 2>&1; echo '== Bootstrap-Log =='; sudo tail -n 8 /var/log/villaforge-bootstrap.log 2>&1; true"
      - name: Bootstrap starten (detached)
        if: ${{ github.event.inputs.mode == 'bootstrap' }}
        env:
          ORACLE_BOOTSTRAP: ${{ secrets.ORACLE_BOOTSTRAP }}
        run: |
          printf '%s' "$ORACLE_BOOTSTRAP" > /tmp/boot.sh
          scp -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i ~/.ssh/oracle_key /tmp/boot.sh ubuntu@152.70.8.227:/tmp/boot.sh
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -i ~/.ssh/oracle_key ubuntu@152.70.8.227 "chmod +x /tmp/boot.sh && sudo setsid nohup bash /tmp/boot.sh >/dev/null 2>&1 < /dev/null & sleep 3; pgrep -af boot.sh | head -3; echo BOOTSTART-OK"
          echo "Bootstrap laeuft jetzt abgekoppelt auf der Instanz"
      - name: Routen-Check (routes)
        if: ${{ github.event.inputs.mode == 'routes' }}
        run: |
          bash /tmp/sshcmd "VF=\$(grep '^VF_TOKEN=' /opt/villaforge/hub.env | cut -d= -f2); \
            curl -s -m 8 -H \"Authorization: Bearer \$VF\" http://127.0.0.1:12000/api/routes; \
            echo; echo '---VILLAS---'; \
            curl -s -m 8 -H \"Authorization: Bearer \$VF\" http://127.0.0.1:12000/api/villas | head -c 600; true"
      - name: Route tunen (tune)
        if: ${{ github.event.inputs.mode == 'tune' }}
        run: |
          bash /tmp/sshcmd "VF=\$(grep '^VF_TOKEN=' /opt/villaforge/hub.env | cut -d= -f2); \
            for ID in \$(curl -s -m 8 -H \"Authorization: Bearer \$VF\" http://127.0.0.1:12000/api/routes | python3 -c 'import json,sys; print(\" \".join(str(r[\"id\"]) for r in json.load(sys.stdin) if \"ollama\" in r[\"base_url\"].lower()))'); do \
              curl -s -m 8 -X PATCH -H \"Authorization: Bearer \$VF\" -H \"Content-Type: application/json\" -d \'{\"priority\": 40}\' http://127.0.0.1:12000/api/routes/\$ID; echo; done; \
            echo '--- ROUTES NACH TUNING ---'; \
            curl -s -m 8 -H \"Authorization: Bearer \$VF\" http://127.0.0.1:12000/api/routes | python3 -c 'import json,sys; [print(r[\"id\"], r[\"name\"], \"Prio\", r[\"priority\"]) for r in json.load(sys.stdin)]'; true"
      - name: API-Tuning (apitune)
        if: ${{ github.event.inputs.mode == 'apitune' }}
        env:
          VF: ${{ secrets.VF_HUBTOKEN }}
        run: |
          echo "== Routes via public API (Timeout 150s) =="
          ROUTES=$(curl -s -m 150 -H "Authorization: Bearer $VF" http://152.70.8.227:12000/api/routes) || true
          echo "$ROUTES" | head -c 400; echo
          IDS=$(echo "$ROUTES" | python3 -c 'import json,sys
try:
    rs = json.load(sys.stdin)
    print(" ".join(str(r["id"]) for r in rs if "ollama" in r.get("base_url","").lower() and r.get("priority",0) < 40))
except Exception:
    pass')
          echo "Zu tiefpriorisierende Ollama-Routen: $IDS"
          for ID in $IDS; do
            curl -s -m 150 -X PATCH -H "Authorization: Bearer $VF" -H "Content-Type: application/json" \
              -d '{"priority": 40}' "http://152.70.8.227:12000/api/routes/$ID"; echo
          done
          echo "== Routes danach =="
          curl -s -m 150 -H "Authorization: Bearer $VF" http://152.70.8.227:12000/api/routes | \
            python3 -c 'import json,sys
try:
    [print(r["id"], r["name"], "Prio", r["priority"]) for r in json.load(sys.stdin)]
except Exception as e:
    print("Lesefehler", e)'
      - name: Token lesen (token)
        if: ${{ github.event.inputs.mode == 'token' }}
        run: |
          bash /tmp/sshcmd "grep '^VF_TOKEN=' /opt/villaforge/hub.env 2>&1; systemctl is-active villaforge; curl -s -m 8 http://127.0.0.1:12000/api/health | head -c 300; true"
      - name: Ollama-Systemcheck (sys)
        if: ${{ github.event.inputs.mode == 'sys' }}
        run: |
          bash /tmp/sshcmd "echo '== Lokaler Hub =='; curl -s -m 5 http://127.0.0.1:12000/api/health; echo; echo '== Dienst =='; sudo systemctl is-active villaforge; sudo systemctl is-active ollama; echo '== iptables INPUT =='; sudo iptables -L INPUT -n --line-numbers | head -12; echo '== Public IP =='; curl -s -m 8 https://ifconfig.me; echo" 
      - name: Extern-Check (extern)
        if: ${{ github.event.inputs.mode == 'extern' }}
        run: |
          echo "== Hub von aussen =="
          curl -s -m 10 http://152.70.8.227:12000/api/health || echo "Hub von aussen NICHT erreichbar (Ingress fehlt?)"
          echo
          echo "== Ollama-Route pruefen =="
          curl -s -m 10 http://152.70.8.227:12000/api/health | head -c 400 || true
