name: VM PG-Status
on:
  workflow_dispatch: {}
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: VM per SSH pruefen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          SSHO="ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159"
          $SSHO "uptime; echo ---; df -h /; echo ---; free -m | head -2; echo ---; sudo systemctl is-active nginx postgresql@16-main 2>&1; echo ---; sudo -u postgres pg_isready -h 127.0.0.1 -p 5432 2>&1; echo ---; sudo ss -tlnp | grep -E ':(5432|443)' || echo KEIN-5432-443-LISTEN; echo ---; sudo -u postgres psql -Atq -d cybersarah -c 'SELECT count(*) FROM users;' 2>&1 | head -3; echo ---; sudo -u postgres tail -n 8 /var/log/postgresql/postgresql-16-main.log 2>&1 | tail -8; echo ---; sudo journalctl -k --since '4 hours ago' --no-pager 2>/dev/null | grep -iE 'oom|out of memory|killed process' | tail -4; echo ---; sudo du -shx /var/log /opt /var/lib/postgresql 2>/dev/null | tail -4"
