name: Lead Responder - Followup pruefen
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 24h-Follow-up live ausloesen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ServerAliveInterval=20 ubuntu@92.5.177.159 'sudo bash -s' <<'EOS'
          set -uo pipefail
          APP=/opt/lead-responder
          KEY=$(grep -m1 '^ADMIN_API_KEY=' "$APP/.env" | cut -d= -f2-)
          API=http://127.0.0.1:8080/api/v1
          DB=$APP/data/lead-responder.sqlite
          j() { python3 -c "import json,sys;d=json.load(sys.stdin);print($1)" 2>/dev/null || echo PARSE_ERROR; }
          echo "== Schema der leads-Tabelle =="
          node -e 'const {DatabaseSync}=require("node:sqlite");const db=new DatabaseSync(process.argv[1]);console.log(db.prepare("PRAGMA table_info(leads)").all().map(c=>c.name).join(", "))' "$DB"
          C=$(curl -sS -X POST "$API/clients" -H "x-admin-key: $KEY" -H 'content-type: application/json' -d '{"name":"Followup Verify","system_prompt":"Solar-Installateur Testbetrieb.","webhook_outbound_url":"https://httpbin.org/post"}')
          CID=$(printf '%s' "$C" | j 'd["client"]["id"]')
          CK=$(printf '%s' "$C" | j 'd["api_key"]')
          L=$(curl -sS -m 40 -X POST "$API/lead/inbound" -H "x-api-key: $CK" -H 'content-type: application/json' -d '{"name":"Followup Test","email":"fu@example.com","inquiry":"Wärmepumpe Angebot, Reihenhaus Aachen."}')
          LID=$(printf '%s' "$L" | j 'd["lead_id"]')
          printf '%s' "$L" | j '"lead="+d["lead_id"]+" status="+str(d.get("status"))+" delivered="+str(d.get("delivered"))'
          echo "== sent_at um 25h zurueckdatieren (Testlead) =="
          node -e '
          const {DatabaseSync}=require("node:sqlite");
          const db=new DatabaseSync(process.argv[1]);
          const id=process.argv[2];
          const cols=db.prepare("PRAGMA table_info(leads)").all().map(c=>c.name);
          const past=new Date(Date.now()-25*3600*1000).toISOString();
          const sets=[];
          if (cols.includes("sent_at")) sets.push("sent_at = ?");
          if (cols.includes("followup_due_at")) sets.push("followup_due_at = ?");
          if (cols.includes("next_followup_at")) sets.push("next_followup_at = ?");
          if (cols.includes("followup_sent_at")) sets.push("followup_sent_at = NULL");
          const stmt=db.prepare("UPDATE leads SET "+sets.join(", ")+(cols.includes("updated_at")?", updated_at = ?":"")+" WHERE id = ?");
          const params=[];
          for (const s of sets) params.push(past);
          if (cols.includes("updated_at")) params.push(new Date().toISOString());
          params.push(id);
          stmt.run(...params);
          const row=db.prepare("SELECT status, sent_at, replied_at, followup_sent_at FROM leads WHERE id = ?").get(id);
          console.log("nach Update:", JSON.stringify(row));
          ' "$DB" "$LID"
          echo "== Cron-Zyklus ausloesen und Ergebnis lesen =="
          sleep 2
          echo "scan: $(curl -sS -X POST "$API/admin/scan" -H "x-admin-key: $KEY" | j 'str(d["scan"]["followups"])')"
          curl -sS "$API/leads/$LID" -H "x-admin-key: $KEY" | j '"lead danach: status="+str(d["lead"]["status"])+" followup_sent_at="+str(d["lead"].get("followup_sent_at"))'
          echo "== Zustellereignisse =="
          curl -sS "$API/admin/deliveries?lead_id=$LID&limit=10" -H "x-admin-key: $KEY" | j '"total="+str(d["total"])+"\n"+"\n".join("  "+e["type"]+" kind="+str(e["detail"].get("kind")) for e in d["events"])'
          echo "== Webhook-Payload-Kind pruefen (httpbin liefert echo nicht zurueck, daher nur Status) =="
          curl -sS "$API/leads/$LID" -H "x-admin-key: $KEY" | python3 -c "import json,sys;d=json.load(sys.stdin);print('antwort:', (d['lead'].get('response') or d['lead'].get('generated_response') or '')[:160])"
          curl -sS -o /dev/null -X DELETE "$API/clients/$CID" -H "x-admin-key: $KEY"; echo "verify-client geloescht"
          EOS
