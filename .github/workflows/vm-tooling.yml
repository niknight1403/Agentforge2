name: VM-Tooling (Phase 1+2: Ressourcen-Validierung und lokale Coder-Modelle)

# Ressourcen- und Modell-Layer der VillaForge-Produktions-VM pruefen und
# erweitern: System-Specs (CPU/RAM/Disk/Docker), Ollama-Modellbestand,
# und Bereitstellung eines lokalen Coding-Modells (qwen2.5-coder) mit
# erweitertem Kontext als starke, quota-freie Route in der LLM-Kaskade.
on:
  workflow_dispatch:
    inputs:
      pull_model:
        description: 'Ollama-Modell pullen (leer = nur Report)'
        required: false
        default: 'qwen2.5-coder:7b'

jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: SSH-Zugang einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd

      - name: System-Ressourcen und Ollama-Modellbestand pruefen
        run: |
          echo "== [1/3] System-Specs =="
          /tmp/sshcmd 'nproc; free -h | head -2; df -h / | tail -1; docker ps --format "{{.Names}} {{.Status}}" 2>/dev/null | head -8 || echo "docker ps nicht verfuegbar"; nvidia-smi -L 2>/dev/null || echo "Keine GPU (ARM-CPU-Betrieb)"'
          echo "== [2/3] Ollama-Modellbestand =="
          /tmp/sshcmd 'ollama list 2>/dev/null || sudo -u ollama ollama list'

      - name: Coder-Modell bereitstellen
        env:
          MODEL: ${{ github.event.inputs.pull_model }}
        run: |
          if [ -z "$MODEL" ] || [ "$MODEL" = "''" ]; then echo "Kein Modell angegeben — nur Report."; exit 0; fi
          echo "== [3/3] Pruefen/Pullen: $MODEL =="
          /tmp/sshcmd "bash -s" << EOS
          set -e
          if ollama list 2>/dev/null | grep -q "$MODEL"; then
            echo "Modell $MODEL bereits installiert."
          else
            FREE_GB=\$(df -BG / | tail -1 | awk '{print \$4}' | tr -dc '0-9')
            if [ "\$FREE_GB" -lt 8 ]; then
              echo "ABBRUCH: Nur \$FREE_GB GB frei — Pull von $MODEL (ca. 5 GB) uebersprungen."
              exit 0
            fi
            echo "Platz: \$FREE_GB GB frei — pull $MODEL ..."
            ollama pull $MODEL || sudo -u ollama ollama pull $MODEL
          fi
          echo "== Verifikation: Test-Prompt gegen $MODEL (Kontext-Check) =="
          ollama run $MODEL --verbose "Antworte nur mit: ok" 2>/dev/null | head -3 || sudo -u ollama ollama run $MODEL "Antworte nur mit: ok" | head -3
          ollama list | head -8
          EOS
