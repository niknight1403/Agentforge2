name: LLM-Failover-Aufbau

# SRE-Auftrag 2026-10-18: Redundantes, 100 % kostenloses LLM-Failover:
# LiteLLM-Proxy (Port 4000) mit Kaskade 1. Groq Free -> 2. Ollama lokal
# (llama3.2:3b, keep_alive -1, Timeout 5 s, Cooldown 30 s) + Systemd-Watchdog
# (alle 15 s Health-Checks, automatische Neustarts).

on:
  workflow_dispatch:

jobs:
  failover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: SSH-Zugang einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd

      - name: 1) Ollama pruefen + Keep-Alive -1
        run: |
          /tmp/sshcmd 'bash -s' << 'EOS'
          set -e
          echo "== Ollama-Status =="
          if ! curl -sf -m 5 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "Ollama nicht erreichbar - installiere ..."
            curl -fsSL https://ollama.com/install.sh | sh
          else
            echo "Ollama laeuft bereits."
          fi
          echo "== Modell-Check (llama3.2:3b) =="
          if ! curl -sf -m 10 http://127.0.0.1:11434/api/tags | grep -q "llama3.2:3b"; then
            echo "Modell wird gezogen ..."
            ollama pull llama3.2:3b
          else
            echo "llama3.2:3b vorhanden."
          fi
          echo "== Keep-Alive dauerhaft (-1) via Systemd-Override =="
          sudo mkdir -p /etc/systemd/system/ollama.service.d
          printf '%s\n' '[Service]' 'Environment="OLLAMA_KEEP_ALIVE=-1"' 'Environment="OLLAMA_FLASH_ATTENTION=1"' | sudo tee /etc/systemd/system/ollama.service.d/override.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart ollama
          sleep 3
          curl -sf -m 5 http://127.0.0.1:11434/api/tags >/dev/null && echo "Ollama mit keep_alive=-1 aktiv."
          EOS

      - name: 2) LiteLLM-Proxy installieren (Kaskade Groq -> Ollama)
        run: |
          /tmp/sshcmd 'bash -s' << 'EOS'
          set -e
          if [ ! -d /home/ubuntu/litellm-venv ]; then
            sudo apt-get -qq update >/dev/null 2>&1 || true
            sudo apt-get -qq install -y python3-venv python3-pip >/dev/null 2>&1 || true
            python3 -m venv /home/ubuntu/litellm-venv
          fi
          echo "== LiteLLM installieren/aktualisieren (evtl. einige Minuten) =="
          /home/ubuntu/litellm-venv/bin/pip install -q --upgrade 'litellm[proxy]' 2>&1 | tail -2 || true
          /home/ubuntu/litellm-venv/bin/litellm --version || echo "Versionsabfrage fehlgeschlagen - pruefe Installation"
          echo "== GROQ_API_KEY aus Hub-Secrets-Store nach hub.env synchronisieren =="
          tee /tmp/sync-groq.mjs >/dev/null << 'NODEJS'
          import { DatabaseSync } from 'node:sqlite';
          import { readFileSync, writeFileSync } from 'node:fs';
          const db = new DatabaseSync('/opt/villaforge/server/data/villaforge.db', { readOnly: true });
          const row = db.prepare("SELECT value FROM secrets WHERE name = 'GROQ_API_KEY'").get();
          if (!row || !row.value) { console.log('Kein GROQ_API_KEY im Hub-Store - ueberspringe Sync'); process.exit(0); }
          const envPath = '/opt/villaforge/hub.env';
          let env = readFileSync(envPath, 'utf8');
          const line = 'GROQ_API_KEY=' + row.value;
          if (/^GROQ_API_KEY=/m.test(env)) env = env.replace(/^GROQ_API_KEY=.*$/m, line);
          else env = env.trimEnd() + '\n' + line + '\n';
          writeFileSync(envPath, env);
          console.log('hub.env: GROQ_API_KEY synchronisiert (' + row.value.slice(0, 8) + '...)');
          NODEJS
          sudo node /tmp/sync-groq.mjs && rm -f /tmp/sync-groq.mjs

          echo "== Kaskaden-Konfiguration schreiben =="
          cat > /home/ubuntu/litellm.yaml << 'YAML'
          model_list:
            # Stufe 1: Groq Free Tier (gueltiger Key, Millisekunden-Latenz, grosses Kontingent)
            - model_name: villa-kaskade
              litellm_params:
                model: groq/openai/gpt-oss-120b
                api_key: os.environ/GROQ_API_KEY
                timeout: 10
                max_retries: 0
            # Stufe 2: Google Gemini Free Tier (Zweit-Kontingent)
            - model_name: villa-kaskade
              litellm_params:
                model: gemini/gemini-flash-lite-latest
                api_key: os.environ/GEMINI_API_KEY
                timeout: 10
                max_retries: 0
            # Stufe 3: lokales Offline-Backup (Ollama, unbegrenzt, kostenlos)
            - model_name: villa-kaskade
              litellm_params:
                model: ollama_chat/llama3.2:3b
                api_base: http://127.0.0.1:11434
                keep_alive: -1
                timeout: 240
            # Nur fuer den Failover-Akzeptanztest: absichtlich kaputter Primaer-Schluesse
            - model_name: villa-failtest
              litellm_params:
                model: groq/openai/gpt-oss-120b
                api_key: os.environ/BROKEN_TEST_KEY
                timeout: 10
                max_retries: 0
            - model_name: villa-failtest
              litellm_params:
                model: ollama_chat/llama3.2:3b
                api_base: http://127.0.0.1:11434
                keep_alive: -1
                timeout: 240
          litellm_settings:
            drop_params: true
            num_retries: 0
            request_timeout: 120
          router_settings:
            routing_strategy: simple-shuffle
            num_retries: 3
            timeout: 120
            cooldown_time: 30
            allowed_fails: 2
          general_settings:
            master_key: sk-villaforge-local
          YAML
          echo "Konfiguration: /home/ubuntu/litellm.yaml"
          EOS

      - name: 3) Systemd-Dienste + Watchdog (15-Sekunden-Health-Checks)
        run: |
          /tmp/sshcmd 'bash -s' << 'EOS'
          set -e
          echo "== LiteLLM als Systemd-Dienst (Restart=always) =="
          sudo tee /etc/systemd/system/litellm.service >/dev/null << 'UNIT'
          [Unit]
          Description=LiteLLM LLM-Proxy (Kaskade Groq -> Gemini -> Ollama)
          After=network.target ollama.service
          [Service]
          Type=simple
          User=ubuntu
          EnvironmentFile=/opt/villaforge/hub.env
          Environment=BROKEN_TEST_KEY=gpt-invalid-failover-test
          ExecStart=/home/ubuntu/litellm-venv/bin/litellm --config /home/ubuntu/litellm.yaml --port 4000 --host 127.0.0.1
          Restart=always
          RestartSec=3
          [Install]
          WantedBy=multi-user.target
          UNIT
          echo "== Watchdog-Skript =="
          sudo tee /opt/villaforge/llm-watchdog.sh >/dev/null << 'WD'
          #!/bin/bash
          # Prueft alle 15 s (via Timer) Ollama und LiteLLM; haengende
          # Instanzen werden hart neu gestartet.
          # Achtung: unter Last braucht /api/tags bis ~10 s - 3 s waere ein
          # Fehlalarm und wuerde laufende Generierungen per Neustart killen.
          if ! curl -sf -m 10 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            LAST=$(cat /var/tmp/ollama-last-restart 2>/dev/null || echo 0)
            NOW=$(date +%s)
            if [ $((NOW - LAST)) -ge 300 ]; then
              logger -t llm-watchdog "Ollama haengt - Neustart (Rate-Limit 5 Min)"
              echo $NOW > /var/tmp/ollama-last-restart
              systemctl restart ollama
            else
              logger -t llm-watchdog "Ollama langsam - Neustart gesperrt (Rate-Limit)"
            fi
          fi
          if ! curl -sf -m 5 http://127.0.0.1:4000/health/liveliness >/dev/null 2>&1; then
            logger -t llm-watchdog "LiteLLM haengt - Neustart"
            systemctl restart litellm
          fi
          WD
          sudo chmod +x /opt/villaforge/llm-watchdog.sh
          echo "== Watchdog-Dienst + Timer (alle 15 Sekunden) =="
          sudo tee /etc/systemd/system/llm-watchdog.service >/dev/null << 'WDS'
          [Service]
          Type=oneshot
          ExecStart=/opt/villaforge/llm-watchdog.sh
          WDS
          sudo tee /etc/systemd/system/llm-watchdog.timer >/dev/null << 'WDT'
          [Timer]
          OnBootSec=15
          OnUnitActiveSec=15
          [Unit]
          Description=LLM-Watchdog alle 15 Sekunden
          WDT
          sudo systemctl daemon-reload
          sudo systemctl enable litellm.service
          sudo systemctl restart litellm.service
          sudo systemctl enable --now llm-watchdog.timer
          sleep 12
          sudo systemctl --no-pager --lines=5 status litellm.service | head -8 || true
          EOS

      - name: "4) Hub-Lastbalance: Villa-Parallelitaet + Kaskaden-Bucket"
        run: |
          /tmp/sshcmd 'bash -s' << 'EOS'
          set -e
          UNIT=$(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -iE '^(hub|villaforge)' | head -1 || true)
          UNIT=${UNIT:-villaforge.service}
          echo "== Hub-Unit: $UNIT =="
          sudo rm -f /etc/systemd/system/villaforge.service.d/limits.conf
          sudo mkdir -p "/etc/systemd/system/${UNIT}.d"
          printf '[Service]\nEnvironment=VF_MAX_CONCURRENCY=2\n' | sudo tee "/etc/systemd/system/${UNIT}.d/concurrency.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart "$UNIT"
          echo "VF_MAX_CONCURRENCY=2 aktiv - $UNIT neu gestartet"
          echo "== Kaskaden-Routenname: Groq-Bucket statt Gemini-Bucket =="
          tee /tmp/rename-route.mjs >/dev/null << 'NODEJS'
          import { DatabaseSync } from 'node:sqlite';
          const db = new DatabaseSync('/opt/villaforge/server/data/villaforge.db');
          db.prepare("UPDATE routes SET name = 'LiteLLM Kaskade (Groq->Gemini->Ollama, lokal)' WHERE id = 11").run();
          console.log('Route 11 umbenannt -> Groq-Bucket (20 RPM)');
          NODEJS
          sudo node /tmp/rename-route.mjs && rm -f /tmp/rename-route.mjs
          sleep 8
          EOS

      - name: "5) Verifikation - Health-Checks + Failover-Akzeptanztest"
        run: |
          /tmp/sshcmd 'bash -s' << 'EOS'
          echo "== Health-Checks =="
          echo -n "Ollama  /api/tags:        HTTP "; curl -s -m 5 -o /dev/null -w "%{http_code}\n" http://127.0.0.1:11434/api/tags
          echo -n "LiteLLM /health/liveliness: HTTP "; curl -s -m 5 -o /dev/null -w "%{http_code}\n" http://127.0.0.1:4000/health/liveliness
          echo "== Kaskaden-Test (Normalbetrieb: Groq primaer) =="
          time curl -s -m 150 http://127.0.0.1:4000/v1/chat/completions \
            -H "Authorization: Bearer sk-villaforge-local" -H "Content-Type: application/json" \
            -d '{"model":"villa-kaskade","messages":[{"role":"user","content":"Antworte nur mit: ok"}],"max_tokens":10}' | head -c 400
          echo ""
          echo "== FAILOVER-TEST: kaputter Primaer-Schluessel -> muss auf Ollama springen (3-5 s) =="
          time curl -s -m 150 http://127.0.0.1:4000/v1/chat/completions \
            -H "Authorization: Bearer sk-villaforge-local" -H "Content-Type: application/json" \
            -d '{"model":"villa-failtest","messages":[{"role":"user","content":"Antworte nur mit: ok"}],"max_tokens":10}' | head -c 400
          echo ""
          echo "== Watchdog-Timer aktiv? =="
          systemctl is-active llm-watchdog.timer
          EOS
