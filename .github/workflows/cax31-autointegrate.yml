name: CAX31-Autointegration (Secrets-basiert)
on:
  workflow_dispatch:
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: CAX31-IP aus Secrets ermitteln
        id: discover
        env:
          HETZNER_NODES: ${{ secrets.HETZNER_NODES }}
          HETZNER_API_TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          set -euo pipefail
          KNOWN="92.5.177.159 2.28.12.63 2.31.45.241 2.31.64.65 167.233.196.20 167.233.118.190"
          IPS=$(printf '%s' "$HETZNER_NODES" | grep -oE "[0-9]{1,3}(\.[0-9]{1,3}){3}" | sort -u || true)
          # Fallback: Hetzner-Cloud-API nach Server-IPs befragen (nur Lesezugriff)
          if [ -z "$IPS" ] && [ -n "$HETZNER_API_TOKEN" ]; then
            IPS=$(curl -s -m 20 -H "Authorization: Bearer $HETZNER_API_TOKEN" \
              "https://api.hetzner.cloud/v1/servers" \
              | python3 -c "import json,sys; print('\n'.join(s['public_net']['ipv4']['ip'] for s in json.load(sys.stdin).get('servers',[])))" 2>/dev/null | sort -u || true)
          fi
          NEW=""
          for ip in $IPS; do
            skip=0
            for k in $KNOWN; do [ "$ip" = "$k" ] && skip=1; done
            [ "$skip" -eq 0 ] && NEW="$NEW $ip"
          done
          NEW=$(echo $NEW | xargs)
          echo "Neue Kandidaten: ${NEW:-keine}"
          if [ -z "$NEW" ]; then echo "FEHLER: keine neue Knoten-IP in Secrets gefunden"; exit 1; fi
          echo "candidates<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Knoten identifizieren (SSH-Test, Specs)
        id: probe
        env:
          CAX_SSH_KEY: ${{ secrets.CAX_SSH_KEY }}
          CANDIDATES: ${{ steps.discover.outputs.candidates }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$CAX_SSH_KEY" > ~/.ssh/cax_key && chmod 600 ~/.ssh/cax_key
          CAX31=""
          for ip in $CANDIDATES; do
            echo "== Teste $ip =="
            OUT=$(ssh -i ~/.ssh/cax_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 root@$ip \
              "echo SPECS; nproc; free -m | awk '/Mem:/{print \$2}'; uname -m; which ollama >/dev/null 2>&1 && echo OLLAMA_DA || echo OLLAMA_NEIN" 2>&1) || { echo "  SSH fehlgeschlagen: $ip"; continue; }
            CPU=$(echo "$OUT" | sed -n 's/^SPECS$//;2p')
            MEM=$(echo "$OUT" | sed -n '3p')
            ARCH=$(echo "$OUT" | sed -n '4p')
            OLL=$(echo "$OUT" | sed -n '5p')
            echo "  CPU=$CPU MEM=${MEM}MB ARCH=$ARCH OLLAMA=$OLL"
            # CAX31: >=8 vCPU, >=30000 MB RAM
            if [ "${CPU:-0}" -ge 8 ] && [ "${MEM:-0}" -ge 30000 ]; then
              CAX31="$ip"; echo "  -> als CAX31 identifiziert"; break
            fi
          done
          if [ -z "$CAX31" ]; then echo "FEHLER: kein Kandidat erfuellt CAX31-Spezifikation (8 vCPU / 32 GB)"; exit 1; fi
          echo "cax31=$CAX31" >> "$GITHUB_OUTPUT"
      - name: Ollama + 14B-Modell installieren und haerten
        env:
          CAX_SSH_KEY: ${{ secrets.CAX_SSH_KEY }}
          SIP: ${{ steps.probe.outputs.cax31 }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/cax_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 root@$SIP"
          echo "== Ollama-Installationsstand pruefen =="
          if ! $SSH "which ollama >/dev/null 2>&1"; then
            echo "== Ollama installieren =="
            $SSH "curl -fsSL https://ollama.com/install.sh | sh" 2>&1 | tail -2
            $SSH "mkdir -p /etc/systemd/system/ollama.service.d && printf '[Service]\nEnvironment=\"OLLAMA_HOST=0.0.0.0:11434\"\n' > /etc/systemd/system/ollama.service.d/host.conf && systemctl daemon-reload && systemctl restart ollama && sleep 3 && systemctl is-active ollama"
          else
            $SSH "mkdir -p /etc/systemd/system/ollama.service.d && printf '[Service]\nEnvironment=\"OLLAMA_HOST=0.0.0.0:11434\"\n' > /etc/systemd/system/ollama.service.d/host.conf && systemctl daemon-reload && systemctl restart ollama && sleep 2 && systemctl is-active ollama"
          fi
          echo "== Modell ziehen: qwen2.5-coder:14b =="
          $SSH "ollama pull qwen2.5-coder:14b 2>&1 | tail -2"
          $SSH "ollama list"
          echo "== UFW haerten =="
          $SSH "apt-get install -y -qq ufw >/dev/null 2>&1; ufw allow 22/tcp >/dev/null; ufw allow from 92.5.177.159 to any port 11434 proto tcp >/dev/null; ufw allow from 167.233.196.20 to any port 11434 proto tcp >/dev/null; ufw allow from 167.233.118.190 to any port 11434 proto tcp >/dev/null; echo y | ufw enable >/dev/null; ufw status | head -8"
      - name: Route in Hub integrieren + Verifikation (Oracle-VM)
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          C31: ${{ steps.probe.outputs.cax31 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key && chmod 600 ~/.ssh/oracle_key
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash -s" <<EOS
          set -uo pipefail
          echo "== Erreichbarkeit CAX31 (\$C31) =="
          curl -s -m 15 "http://\$C31:11434/api/tags" | head -c 300; echo
          if ! curl -s -m 10 "http://\$C31:11434/api/tags" | grep -q "qwen2.5-coder:14b"; then
            echo "FEHLER: qwen2.5-coder:14b auf CAX31 nicht erreichbar"; exit 1
          fi
          echo "== Route in Hub-DB integrieren =="
          python3 - <<'PYV'
          import sqlite3
          con = sqlite3.connect("/opt/villaforge/server/data/villaforge.db")
          cur = con.cursor()
          row = cur.execute("SELECT provider, priority FROM routes WHERE base_url LIKE '%11434%' ORDER BY priority LIMIT 1").fetchone()
          prov = row[0] if row else "ollama"
          basep = (row[1] if row else 5) + 1
          import os
          c31 = os.environ.get("C31", "")
          nodes = [
              ("Cascade: Ollama CAX11 (3B)", "http://2.28.12.63:11434", "qwen2.5-coder:3b", basep),
              ("Cascade: Ollama CAX21-1 (7B)", "http://2.31.45.241:11434", "qwen2.5-coder:7b", basep + 1),
              ("Cascade: Ollama CAX21-2 (7B)", "http://2.31.64.65:11434", "qwen2.5-coder:7b", basep + 2),
              ("Cascade: Ollama CAX31 (14B)", "http://{}:11434".format(c31), "qwen2.5-coder:14b", basep + 3),
          ]
          for name, url, model, prio in nodes:
              ex = cur.execute("SELECT id FROM routes WHERE base_url=?", (url,)).fetchone()
              if ex:
                  cur.execute("UPDATE routes SET model=?, enabled=1, status='IDLE', dead=0, cooldown_until=0 WHERE id=?", (model, ex[0]))
                  print("aktualisiert:", name)
              else:
                  cur.execute("INSERT INTO routes (name, provider, base_url, model, key_env, is_free, enabled, priority, weight, status, ok, fail, last_used, cooldown_until, lat_ms, tokens, dead) VALUES (?,?,?,?,?,1,1,?,0.2,'IDLE',0,0,0,0,0,0,0)", (name, prov, url, model, prio))
                  print("eingefuegt:", name, "Prioritaet", prio)
          con.commit()
          for r in cur.execute("SELECT name, priority, enabled FROM routes WHERE name LIKE 'Cascade: Ollama CAX%' ORDER BY priority").fetchall():
              print("  ", r)
          PYV
          echo "== Hub-Neustart =="
          systemctl restart villaforge-hub 2>/dev/null || systemctl restart villaforge 2>/dev/null || true
          sleep 12
          systemctl is-active villaforge-hub 2>/dev/null || systemctl is-active villaforge 2>/dev/null || true
          echo "== Verifikation =="
          TOK=\$(curl -s -m 10 -X POST http://127.0.0.1:12000/api/auth/login -H "Content-Type: application/json" -d '{"email":"niko.oeben@gmail.com","password":"Niko6529!"}' | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
          curl -s -m 10 -X POST -H "Authorization: Bearer \$TOK" http://127.0.0.1:12000/api/routeforge/tick | head -c 200; echo
          sleep 10
          curl -s -m 10 http://127.0.0.1:12000/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); l=d.get('llm',{}); print('LLM:', l.get('eligibleRoutes'), '/', l.get('configuredRoutes'), 'state:', l.get('state'))"
          echo "== Testantwort vom CAX31 (14B) =="
          curl -s -m 90 "http://\$C31:11434/api/generate" -d '{"model":"qwen2.5-coder:14b","prompt":"Antworte mit einem Wort: Hallo","stream":false}' | head -c 200; echo
          EOS
