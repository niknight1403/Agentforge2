name: VM Postgres Init (CyberSarah-App-DB)

# Einrichtungs-Workflow: PostgreSQL auf der Oracle-VM als Ersatz fuer die
# quota-blockierte Neon-DB. Idempotent; Passwort kommt aus VM_PG_PW-Secret.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vm-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH-Key einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Init-Skript entpacken und Passwort injizieren
        env:
          VM_PG_PW: ${{ secrets.VM_PG_PW }}
          PG_INIT_B64: 
        run: |
          printf '%s' "$PG_INIT_B64" | base64 -d > /tmp/pg-init.sh
          sed -i "s|__PGPW__|$VM_PG_PW|" /tmp/pg-init.sh
          test -s /tmp/pg-init.sh && echo "Skript bereit: $(wc -l < /tmp/pg-init.sh) Zeilen"

      - name: Skript auf VM ausfuehren
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/pg-init.sh ubuntu@92.5.177.159:/tmp/pg-init.sh
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash /tmp/pg-init.sh"

      - name: Erreichbarkeit von aussen pruefen (Render-Sicht)
        run: |
          if timeout 8 bash -c 'cat < /dev/null > /dev/tcp/92.5.177.159/5432' 2>/dev/null; then
            echo "PORT-5432: VON AUSSEN ERREICHBAR"
          else
            echo "PORT-5432: BLOCKIERT (OCI-Security-List oder iptables)"
          fi
