name: VM Postgres Init (CyberSarah-App-DB)

# Einrichtungs-Workflow: PostgreSQL auf der Oracle-VM als Ersatz fuer die
# quota-blockierte Neon-DB. Idempotent; Passwort kommt aus VM_PG_PW-Secret.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  vm-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH-Key einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Postgres-Init-Skript bauen
        env:
          VM_PG_PW: ${{ secrets.VM_PG_PW }}
        run: |
          cat > /tmp/pg-init.sh <<'PGSCRIPT'
#!/bin/bash
set -euo pipefail
PW='__PGPW__'
PGUSER_APP=ccc_app
DB=cybersarah
export DEBIAN_FRONTEND=noninteractive
echo "[1/8] Postgres installieren ..."
apt-get update -qq >/dev/null 2>&1 || true
apt-get install -y -qq postgresql postgresql-contrib >/dev/null 2>&1
PGVER=$(ls /etc/postgresql | head -1)
PGCONF=/etc/postgresql/$PGVER/main
echo "[2/8] Postgres $PGVER — Rolle + DB anlegen (idempotent) ..."
sudo -u postgres psql -qc "CREATE ROLE ${PGUSER_APP} LOGIN PASSWORD '${PW}';" >/dev/null 2>&1 || sudo -u postgres psql -qc "ALTER ROLE ${PGUSER_APP} PASSWORD '${PW}';"
sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='${DB}'" | grep -q 1 || sudo -u postgres createdb -O ${PGUSER_APP} ${DB}
sudo -u postgres psql -qc "GRANT ALL PRIVILEGES ON DATABASE ${DB} TO ${PGUSER_APP};"
echo "[3/8] TLS-Zertifikat (Let's Encrypt vom Hub) ..."
CERTDIR=""
for d in /etc/letsencrypt/live/hub.cybersarah-ki.com /root/.local/share/caddy/certificates/acme-v02.api.letsencrypt.org-directory/hub.cybersarah-ki.com; do
  [ -f "$d/fullchain.pem" ] || [ -f "$d/fullchain.cer" ] && CERTDIR="$d" && break
done
if [ -z "$CERTDIR" ]; then
  FULLCHAIN=$(find /root/.local/share/caddy /etc/letsencrypt /var/lib/caddy -name 'fullchain*' -path '*cybersarah*' 2>/dev/null | head -1)
  [ -n "$FULLCHAIN" ] && CERTDIR=$(dirname "$FULLCHAIN")
fi
if [ -z "$CERTDIR" ]; then echo "FEHLER: Kein LE-Zertifikat gefunden"; exit 3; fi
FULLCHAIN=$(ls "$CERTDIR"/fullchain.pem "$CERTDIR"/fullchain.cer 2>/dev/null | head -1)
PRIVKEY=$(ls "$CERTDIR"/privkey.pem "$CERTDIR"/privkey.key "$CERTDIR"/hub.cybersarah-ki.com.key 2>/dev/null | head -1)
if [ -z "$PRIVKEY" ]; then PRIVKEY=$(ls "$CERTDIR" | grep -iv fullchain | grep -iE 'key|priv' | head -1 | xargs -I{} echo "$CERTDIR/{}"); fi
echo "   Zertifikat: $FULLCHAIN / $PRIVKEY"
mkdir -p /var/lib/postgresql/ssl
cp "$FULLCHAIN" /var/lib/postgresql/ssl/pg.crt
cp "$PRIVKEY" /var/lib/postgresql/ssl/pg.key
chown postgres:postgres /var/lib/postgresql/ssl/pg.*
chmod 600 /var/lib/postgresql/ssl/pg.key
if [ -d /etc/letsencrypt/renewal-hooks ]; then
cat > /etc/letsencrypt/renewal-hooks/deploy/postgres-ssl.sh <<'HOOK'
#!/bin/bash
cp "__CERTDIR__/fullchain.pem" /var/lib/postgresql/ssl/pg.crt 2>/dev/null || true
cp $(ls __CERTDIR__ | grep -i priv | head -1 | xargs -I{} echo __CERTDIR__/{}) /var/lib/postgresql/ssl/pg.key 2>/dev/null || true
chown postgres:postgres /var/lib/postgresql/ssl/pg.*
chmod 600 /var/lib/postgresql/ssl/pg.key
systemctl reload postgresql 2>/dev/null || systemctl restart postgresql
HOOK
sed -i "s|__CERTDIR__|$CERTDIR|g" /etc/letsencrypt/renewal-hooks/deploy/postgres-ssl.sh
chmod +x /etc/letsencrypt/renewal-hooks/deploy/postgres-ssl.sh
fi
echo "[4/8] postgresql.conf (listen + ssl) ..."
grep -q "### villaforge-pg" $PGCONF/postgresql.conf || cat >> $PGCONF/postgresql.conf <<'CONF'
### villaforge-pg
listen_addresses = '*'
ssl = on
ssl_cert_file = '/var/lib/postgresql/ssl/pg.crt'
ssl_key_file = '/var/lib/postgresql/ssl/pg.key'
password_encryption = 'scram-sha-256'
CONF
echo "[5/8] pg_hba.conf (nur SSL, nur diese DB) ..."
grep -q "villaforge-pg" $PGCONF/pg_hba.conf || cat >> $PGCONF/pg_hba.conf <<'HBA'
# villaforge-pg: CyberSarah-App-DB — nur TLS-Zugriff
hostssl  cybersarah  ccc_app  0.0.0.0/0  scram-sha-256
hostssl  cybersarah  ccc_app  ::/0       scram-sha-256
HBA
echo "[6/8] VM-Firewall (iptables 5432) ..."
iptables -C INPUT -p tcp --dport 5432 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport 5432 -j ACCEPT
netfilter-persistent save >/dev/null 2>&1 || iptables-save > /etc/iptables/rules.v4 2>/dev/null || true
echo "[7/8] Postgres neu starten ..."
systemctl restart postgresql
sleep 3
sudo -u postgres pg_isready -q && echo "   pg_isready: OK"
echo "[8/8] TLS-Verbindungstest ..."
PGPASSWORD="${PW}" psql -h 127.0.0.1 -U ${PGUSER_APP} -d ${DB} -c "SELECT 1 AS ok" >/dev/null 2>&1 || PGPASSWORD="${PW}" psql "host=127.0.0.1 sslmode=require dbname=${DB} user=${PGUSER_APP}" -c "SELECT 1 AS ok" >/dev/null 2>&1 || { echo "   FEHLER beim Verbindungstest"; exit 4; }
echo "POSTGRES-SETUP: ALLES OK (Rolle+DB+TLS+Firewall aktiv)"
PGSCRIPT
          sed -i "s|__PGPW__|$VM_PG_PW|" /tmp/pg-init.sh
          test -s /tmp/pg-init.sh

      - name: Skript auf VM ausfuehren
        run: |
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/pg-init.sh ubuntu@92.5.177.159:/tmp/pg-init.sh
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo bash /tmp/pg-init.sh"

      - name: Erreichbarkeit von aussen pruefen (Render-Sicht)
        run: |
          if timeout 8 bash -c 'cat < /dev/null > /dev/tcp/92.5.177.159/5432' 2>/dev/null; then
            echo "PORT-5432: VON AUSSEN ERREICHBAR"
          else
            echo "PORT-5432: BLOCKIERT (OCI-Security-List oder iptables)"
          fi
