name: Villa-Prompt-Audit (Prompts + Integrationsdaten)
on:
  workflow_dispatch:
  push:
    branches: [work/villa-configuration-audit]
    paths:
      - '.github/workflows/villa-prompt-audit.yml'
      - 'scripts/audit-villas.mjs'
  workflow_run:
    workflows: [Hub-Deploy]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: villa-configuration-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Alle Villen lesend pruefen (keine Modellkosten oder Projektstarts)
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: node scripts/audit-villas.mjs
      - name: Sicheren Befundbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: villa-configuration-audit
          path: artifacts/villa-configuration/report.json
          if-no-files-found: warn
          retention-days: 30
