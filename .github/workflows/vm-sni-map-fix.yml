name: VM SNI Map Fix (kein SNI -> Postgres)

# libpq (Postgres-Client) sendet kein SNI. Routing daher: leer/www -> Postgres,
# alles andere (Browser, Mobile-App, Webhooks mit SNI) -> Web.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mapfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Key einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

      - name: Map-Fix auf VM ausfuehren
        env:
          FIX_B64: 
          VM_PG_PW: ${{ secrets.VM_PG_PW }}
        run: |
          printf '%s' "$FIX_B64" | base64 -d > /tmp/map-fix.sh
          scp -o StrictHostKeyChecking=no -i ~/.ssh/oracle_key /tmp/map-fix.sh ubuntu@92.5.177.159:/tmp/map-fix.sh
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo VM_PG_PW='$VM_PG_PW' bash /tmp/map-fix.sh"

      - name: Externer Test (Render-Sicht)
        env:
          VM_PG_PW: ${{ secrets.VM_PG_PW }}
        run: |
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1
          PGPASSWORD="$VM_PG_PW" psql "host=www.cybersarah-ki.com port=443 user=ccc_app dbname=cybersarah sslmode=require" -tAc "SELECT 'EXTERN-PG-443: '||current_database()" && echo "RENDER-SICHT: POSTGRES UEBER 443 ERREICHBAR" || echo "FEHLER: extern nicht erreichbar"
