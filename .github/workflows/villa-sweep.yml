name: Villa-Sweep
# Nimmt blockierte Villen auf ausdruecklichen Start hin ab: echter Build-Nachweis,
# echte Abnahme, bei Bedarf Reparaturaufgabe samt Autonomie-Freigabe.
# Start nur manuell. Frueher hing der Lauf zusaetzlich am Hub-Deploy und setzte dabei
# einen Projekt-Fokus auf Villa 38; dieser Fokus wies alle anderen Villen mit
# HTTP 409 FOCUS_ACTIVE ab und leerte die Warteschlange. Der 30-Minuten-Cron entfaellt
# ebenfalls, damit kein Sweep unerwartet Villen anhaelt.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Villen pro Lauf'
        default: '2'
        required: false
      villa_id:
        description: 'Nur diese Villa pruefen (0 = alle; NexusSphere = 38)'
        default: '34'
        required: false
      dry_run:
        description: 'nur anzeigen (true/false)'
        default: 'false'
        required: false

concurrency:
  group: villa-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Villen abnehmen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          VILLA_ID: ${{ github.event.inputs.villa_id || '34' }}
          LIMIT: ${{ github.event.inputs.limit || '2' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          [[ "$VILLA_ID" =~ ^(0|[1-9][0-9]*)$ ]] || { echo "Ungueltige Villa-ID"; exit 2; }
          # Kein Projekt-Fokus in diesem Workflow: der Sweep prueft einzelne Villen,
          # darf die uebrigen aber nicht mit 409 FOCUS_ACTIVE aussperren.
          # NexusSphere enthaelt einen echten Rust-Core. Der produktive Sweep muss
          # deshalb dieselbe Systemvoraussetzung wie die NexusSphere-CI besitzen.
          if [ "$VILLA_ID" = "38" ]; then
            ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 \
              'if ! command -v cargo >/dev/null 2>&1; then sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq cargo rustc; fi; cargo --version; rustc --version'
          fi
          ZUSATZ="--villa-id=$VILLA_ID"
          if [ "$DRY" = "true" ]; then ZUSATZ="$ZUSATZ --dry-run"; fi
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 \
            "NODE=\$(command -v node || echo /usr/bin/node); cd /opt/villaforge && git log -1 --format='Code %h' && sudo \"\$NODE\" scripts/ops/villa-sweep.mjs --limit=$LIMIT $ZUSATZ"
