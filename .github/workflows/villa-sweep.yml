name: Villa-Sweep
# Nimmt blockierte Villen automatisch nacheinander ab: echter Build-Nachweis,
# echte Abnahme, bei Bedarf Reparaturaufgabe samt Autonomie-Freigabe.
on:
  workflow_run:
    workflows: [Hub-Deploy]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Villen pro Lauf'
        default: '2'
        required: false
      villa_id:
        description: 'Nur diese Villa pruefen (0 = alle; NexusSphere = 38)'
        default: '34'
        required: false
      dry_run:
        description: 'nur anzeigen (true/false)'
        default: 'false'
        required: false

concurrency:
  group: villa-sweep
  cancel-in-progress: false

jobs:
  sweep:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Villen abnehmen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          VILLA_ID: ${{ github.event_name == 'workflow_run' && '38' || github.event.inputs.villa_id || '34' }}
          LIMIT: ${{ github.event_name == 'workflow_run' && '1' || github.event.inputs.limit || '2' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          [[ "$VILLA_ID" =~ ^(0|[1-9][0-9]*)$ ]] || { echo "Ungueltige Villa-ID"; exit 2; }
          # Der automatische workflow_run ist absichtlich exklusiv auf NexusSphere begrenzt.
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            [ "$VILLA_ID" = "38" ] && [ "$LIMIT" = "1" ] || { echo "Unsichere automatische Sweep-Konfiguration"; exit 3; }
          fi
          ZUSATZ="--villa-id=$VILLA_ID"
          if [ "$DRY" = "true" ]; then ZUSATZ="$ZUSATZ --dry-run"; fi
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 \
            "NODE=\$(command -v node || echo /usr/bin/node); cd /opt/villaforge && git log -1 --format='Code %h' && sudo \"\$NODE\" scripts/ops/villa-sweep.mjs --limit=$LIMIT $ZUSATZ"
