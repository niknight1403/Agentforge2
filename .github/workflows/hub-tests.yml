name: Hub-Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "server/**"
      - "package.json"
      - ".github/workflows/hub-deploy.yml"
      - ".github/workflows/hub-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 23 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Syntax pruefen
        run: |
          node --check server/server.mjs
          node --check server/agents.mjs
          node --check server/llm.mjs
          node --check server/db.mjs

      - name: Secret-Scan
        run: node scripts/check-secrets.mjs

      - name: Unit- und Integrationstests
        run: node --test server/tests/*.test.mjs
