name: Hub-Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/hub-deploy.yml"
      - ".github/workflows/hub-tests.yml"
      - ".github/workflows/codeql.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Node 23 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Syntax, Secrets, Tests und Web-Produktionsbuild
        run: npm run check
