name: DeepAgent Workspace CI

on:
  push:
    branches: [feat/deepagent-live-workspace]
    paths:
      - "server/**"
      - "app/**"
      - ".github/workflows/deepagent-workspace-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "app/**"
      - ".github/workflows/deepagent-workspace-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepagent-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: DeepAgent regression and preview path tests
        run: node --test server/tests/deepagent.test.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Android lint, unit tests and debug APK
        run: gradle :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: deepagent-workspace-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
