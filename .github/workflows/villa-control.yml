name: Villa-Steuerung (Start/Stop/Status direkt in der DB)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pause | resume | pause_all | resume_all | status | set_idea | add_task | delete | task_cleanup | schema | tasks'
        required: true
        default: 'status'
      ids:
        description: 'Villa-IDs, kommasepariert (z.B. 4,7,8) — LEER = alle Villen'
        required: false
        default: ''
      idea:
        description: 'set_idea: Missions-ID | add_task: JSON-Array [{title,description,role,priority}]'
        required: false
        default: ''

jobs:
  steuerung:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH-Zugang einrichten
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          printf '%s\n' 'exec ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=8 -o ConnectTimeout=20 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "$@"' > /tmp/sshcmd
          chmod +x /tmp/sshcmd

      - name: Villa-Status in der Hub-DB setzen
        env:
          IDEA_INPUT: ${{ github.event.inputs.idea }}
        run: |
          MODE='${{ github.event.inputs.mode }}'
          IDS='${{ github.event.inputs.ids }}'
          IDEA_B64=$(printf '%s' "$IDEA_INPUT" | base64 -w0)
          /tmp/sshcmd "sudo bash -s '$MODE' '$IDS' '$IDEA_B64'" << 'EOS'
          set -e
          MODE="$1"; IDS="$2"; IDEA_B64="$3"
          F=/tmp/villa-control-$$.mjs; tee $F >/dev/null << 'NODEJS'
          import { DatabaseSync } from 'node:sqlite';
          const [mode, idsArg, ideaB64] = process.argv.slice(2);
          const idea = ideaB64 ? Buffer.from(ideaB64, 'base64').toString('utf8') : '';
          const db = new DatabaseSync('/opt/villaforge/server/data/villaforge.db');
          const nowSql = () => new Date().toISOString();
          function list(ids) {
            const ph = ids.map(() => '?').join(',');
            const rows = ids.length
              ? db.prepare(`SELECT id, name, status, autonomy FROM villas WHERE id IN (${ph}) ORDER BY id`).all(...ids)
              : db.prepare('SELECT id, name, status, autonomy FROM villas ORDER BY id').all();
            for (const v of rows) console.log(`[${v.id}] ${v.name} | status: ${v.status} | autonomy: ${v.autonomy}`);
            return rows.length;
          }
          if (mode === 'status') {
            console.log('== STATUS ALLER VILLEN ==');
            list([]);
            process.exit(0);
          }
          if (mode === 'task_cleanup') {
            const cids = (idsArg || '').split(',').map((s) => s.trim()).filter(Boolean).map(Number).filter(Boolean);
            if (!cids.length) { console.error('task_cleanup benötigt Villa-IDs.'); process.exit(1); }
            for (const id of cids) {
              const f = db.prepare("DELETE FROM tasks WHERE villa_id = ? AND status = 'FAILED'").run(id);
              const v = db.prepare("DELETE FROM tasks WHERE villa_id = ? AND status = 'PENDING' AND title LIKE '[VERIFICATION]%'").run(id);
              const d = db.prepare("SELECT COUNT(*) c FROM tasks WHERE villa_id = ? AND title LIKE '[VERIFICATION]%'").get(id).c;
              console.log(`CLEANUP V${id}: ${f.changes} FAILED entfernt, ${v.changes} wartende VERIFICATION-Spam entfernt, ${d} verbleiben`);
              const rows = db.prepare("SELECT id, status, title FROM tasks WHERE villa_id = ? ORDER BY id DESC LIMIT 8").all(id);
              for (const r of rows) console.log(`  Task ${r.id} [${r.status}] ${String(r.title).slice(0, 100)}`);
            }
            process.exit(0);
          }
          if (mode === 'delete') {
            const dids = (idsArg || '').split(',').map((s) => s.trim()).filter(Boolean).map(Number).filter(Boolean);
            if (!dids.length) { console.error('delete benötigt Villa-IDs.'); process.exit(1); }
            const allTables = db.prepare("SELECT name FROM sqlite_master WHERE type='table'").all().map((r) => r.name);
            for (const id of dids) {
              const v = db.prepare('SELECT id, name, status FROM villas WHERE id = ?').get(id);
              if (!v) { console.log(`DELETE: Villa ${id} nicht gefunden — uebersprungen.`); continue; }
              db.exec('BEGIN TRANSACTION;');
              try {
                const removed = [];
                for (const tb of allTables) {
                  if (tb === 'villas') continue;
                  let cols = []; try { cols = db.prepare(`PRAGMA table_info(${tb})`).all(); } catch {}
                  if (cols.some((c) => c.name === 'villa_id')) {
                    const c = db.prepare(`DELETE FROM ${tb} WHERE villa_id = ?`).run(id);
                    if (c.changes) removed.push(`${tb}:${c.changes}`);
                  }
                }
                db.prepare('DELETE FROM villas WHERE id = ?').run(id);
                db.exec('COMMIT;');
                console.log(`DELETE: Villa ${id} (${v.name}) entfernt — ` + (removed.join(', ') || 'keine abhaengigen Zeilen'));
              } catch (e) { db.exec('ROLLBACK;'); console.error('DELETE-Fehler Villa ' + id + ': ' + e.message); process.exit(1); }
            }
            process.exit(0);
          }
          if (mode === 'add_task') {
            const tids = (idsArg || '').split(',').map((s) => s.trim()).filter(Boolean).map(Number).filter(Boolean);
            if (!idea || !tids.length) { console.error('add_task benötigt JSON-Aufgaben (idea) und Villa-IDs.'); process.exit(1); }
            let items; try { items = JSON.parse(idea); } catch { console.error('idea ist kein gültiges JSON.'); process.exit(1); }
            if (!Array.isArray(items) || !items.length) { console.error('idea muss ein JSON-Array sein.'); process.exit(1); }
            let n = 0;
            for (const it of items) {
              const title = String(it.title || 'Aufgabe').slice(0, 200);
              const desc = String(it.description || '').slice(0, 4000) + (it.role ? `\nRolle: ${String(it.role).slice(0,20)}.` : '');
              const r = db.prepare('INSERT INTO tasks (villa_id, title, description, status, priority, created_at, updated_at) VALUES (?,?,?,?,?,?,?)').run(tids[0], title, desc, 'PENDING', Number(it.priority) || 5, Date.now(), Date.now());
              if (r.changes) n++;
            }
            console.log('ADD_TASK: ' + n + ' Aufgabe(n) angelegt');
            const rows = db.prepare(`SELECT id, title, status FROM tasks WHERE villa_id IN (${tids.map(() => '?').join(',')}) ORDER BY id DESC LIMIT 10`).all(...tids);
            for (const r of rows) console.log(`  Task ${r.id} [${r.status}] ${r.title}`);
            process.exit(0);
          }
          if (mode === 'tasks') {
            const vids = (idsArg || '').split(',').map((s) => s.trim()).filter(Boolean).map(Number).filter(Boolean);
            const tables = db.prepare("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name").all().map((r) => r.name);
            console.log('== TABELLEN: ' + tables.join(', '));
            if (tables.includes('sources')) {
              console.log('== SOURCES (villa_id -> pfad) ==');
              for (const s of db.prepare('SELECT * FROM sources ORDER BY rowid').all()) console.log(JSON.stringify(s).slice(0, 300));
            }
            console.log('== TASK-STATUS je Villa ==');
            for (const r of db.prepare(`SELECT villa_id, status, COUNT(*) c FROM tasks ${vids.length ? 'WHERE villa_id IN (' + vids.map(() => '?').join(',') + ')' : ''} GROUP BY villa_id, status ORDER BY villa_id, status`).all(...vids)) console.log(`V${r.villa_id} ${r.status}: ${r.c}`);
            console.log('== OFFENE/FEHLGESCHLAGENE Aufgaben (letzte 15, kompakt) ==');
            for (const r of db.prepare(`SELECT id, villa_id, status, retry_count, title FROM tasks WHERE ${vids.length ? 'villa_id IN (' + vids.map(() => '?').join(',') + ') AND ' : ''}status IN ('PENDING','RUNNING','FAILED') ORDER BY rowid DESC LIMIT 15`).all(...vids)) console.log(`Task ${r.id} V${r.villa_id} [${r.status}] retry=${r.retry_count}: ${String(r.title).slice(0, 120)}`);
            for (const v of db.prepare(`SELECT id, name, status, autonomy, mode, auto_rounds, updated_at FROM villas ${vids.length ? 'WHERE id IN (' + vids.map(() => '?').join(',') + ')' : ''}`).all(...vids)) {
              console.log(`VILLA [${v.id}] ${v.name} | status=${v.status} autonomy=${v.autonomy} mode=${v.mode} auto_rounds=${v.auto_rounds} updated=${new Date(v.updated_at).toISOString()}`);
            }
            for (const tb of tables.filter((n) => /task|todo|backlog/i.test(n))) {
              const cols = db.prepare(`PRAGMA table_info(${tb})`).all().map((c) => c.name);
              console.log(`-- TABELLE ${tb} (${cols.join(',')}) --`);
              const vcol = cols.includes('villa_id') ? 'villa_id' : (cols.includes('villaId') ? 'villaId' : null);
              const sql = vcol && vids.length
                ? `SELECT * FROM ${tb} WHERE ${vcol} IN (${vids.map(() => '?').join(',')}) ORDER BY rowid DESC LIMIT 40`
                : `SELECT * FROM ${tb} ORDER BY rowid DESC LIMIT 15`;
              for (const r of db.prepare(sql).all(...vids)) console.log(JSON.stringify(r).slice(0, 400));
            }
            if (tables.includes('messages')) {
              const mcols = db.prepare('PRAGMA table_info(messages)').all().map((c) => c.name);
              console.log(`-- TABELLE messages (${mcols.join(',')}) -- letzte 20 fuer Villa --`);
              const vcol = mcols.includes('villa_id') ? 'villa_id' : null;
              const sql = vcol && vids.length
                ? `SELECT * FROM messages WHERE ${vcol} IN (${vids.map(() => '?').join(',')}) ORDER BY rowid DESC LIMIT 20`
                : `SELECT * FROM messages ORDER BY rowid DESC LIMIT 10`;
              for (const r of db.prepare(sql).all(...vids)) console.log(JSON.stringify(r).slice(0, 500));
            }
            process.exit(0);
          }
          if (mode === 'schema') {
            console.log('== SPALTEN: villas ==');
            for (const c of db.prepare('PRAGMA table_info(villas)').all()) console.log(`${c.cid} ${c.name} ${c.type}`);
            process.exit(0);
          }
          const ids = (idsArg || '').split(',').map((s) => s.trim()).filter(Boolean).map(Number).filter(Boolean);
          const apply = (sql, label) => {
            const r = ids.length
              ? db.prepare(sql + ' WHERE id IN (' + ids.map(() => '?').join(',') + ')').run(...ids)
              : db.prepare(sql).run();
            console.log(label + ': ' + r.changes + ' Villa(n) aktualisiert');
            list(ids);
          };
          if (mode === 'pause') {
            apply(`UPDATE villas SET autonomy = 0, status = 'PAUSED', updated_at = '${nowSql()}'`, 'PAUSE');
          } else if (mode === 'pause_all') {
            apply(`UPDATE villas SET autonomy = 0, status = 'PAUSED', updated_at = '${nowSql()}'`, 'PAUSE_ALL');
          } else if (mode === 'resume') {
            apply(`UPDATE villas SET autonomy = 1, updated_at = '${nowSql()}'`, 'RESUME');
          } else if (mode === 'resume_all') {
            apply(`UPDATE villas SET autonomy = 1, updated_at = '${nowSql()}'`, 'RESUME_ALL');
          } else if (mode === 'set_idea') {
            if (!idea || !ids.length) { console.error('set_idea benötigt idea und Villa-IDs.'); process.exit(1); }
            if (idea.length > 20000) { console.error('Idee zu lang: ' + idea.length); process.exit(1); }
            const r = db.prepare(`UPDATE villas SET idea = ?, updated_at = '${nowSql()}' WHERE id IN (${ids.map(() => '?').join(',')})`).run(idea, ...ids);
            console.log('SET_IDEA: ' + r.changes + ' Villa(n) aktualisiert');
            const rows = db.prepare(`SELECT id, name, length(idea) AS ilen, substr(idea,1,160) AS head FROM villas WHERE id IN (${ids.map(() => '?').join(',')})`).all(...ids);
            for (const v of rows) console.log(`[${v.id}] ${v.name} | idea ${v.ilen} Zeichen | Anfang: ${v.head}`);
          } else {
            console.error('Unbekannter Modus: ' + mode);
            process.exit(1);
          }
          NODEJS
          sudo node $F "$MODE" "$IDS" "$IDEA_B64"
          rm -f $F
          EOS
