name: APK-Release

# Manueller Reparaturweg: haengt das erfolgreiche APK des angegebenen
# Tag-Builds an einen bestehenden Release an. Neue Releases laufen direkt im
# Build-Workflow, damit kein fremder/alter Build an einen Tag geraten kann.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v1.36.0)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Build-Artefakt holen und an Release anhaengen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          RID=$(gh api "repos/niknight1403/Agentforge2/actions/workflows/build-apk.yml/runs" -f branch="$TAG" -f status=success -f per_page=20 --jq '[.workflow_runs[] | select(.head_branch == env.TAG and .conclusion == "success")][0].id')
          [ -z "$RID" ] || [ "$RID" = "null" ] && { echo "Kein erfolgreicher APK-Build fuer $TAG"; exit 1; }
          echo "Build-Lauf: $RID"
          AID=$(gh api "repos/niknight1403/Agentforge2/actions/runs/$RID/artifacts" --jq '[.artifacts[] | select(.name=="villaforge-apk")][0].id')
          [ -z "$AID" ] || [ "$AID" = "null" ] && { echo "APK-Artefakt fehlt im Lauf $RID"; exit 1; }
          gh api "repos/niknight1403/Agentforge2/actions/artifacts/$AID/zip" > art.zip
          python3 -c "import zipfile; zipfile.ZipFile('art.zip').extractall('.')"
          ls -la VillaForge.apk
          gh release view "$TAG" -R niknight1403/Agentforge2 >/dev/null 2>&1 && gh release upload "$TAG" VillaForge.apk -R niknight1403/Agentforge2 --clobber \
            || gh release create "$TAG" VillaForge.apk -R niknight1403/Agentforge2 --title "VillaForge $TAG"
          echo "Release $TAG mit VillaForge.apk versorgt."
