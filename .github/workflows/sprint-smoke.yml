name: Sprint-Smoke (Publishing + Revenue + Rate-Haertung)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    name: Live-Smoke Sprint 8 und Sprint 9
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Publishing, Revenue und Rate-Haertung live pruefen
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: node scripts/sprint-smoke.mjs
