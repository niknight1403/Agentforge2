name: Villa 39 live read-only diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-villa39.mjs'
      - '.github/workflows/diagnose-villa39.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read production Villa39 status without creating tasks
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: node scripts/inspect-villa39.mjs
      - name: Save sanitized operation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: villa39-live-diagnosis-${{ github.run_id }}
          path: villa39-live-diagnostics.json
          if-no-files-found: warn
          retention-days: 14
