name: Lead Responder - Mail Log
on:
  workflow_dispatch:
jobs:
  maillog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log lesen
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 ubuntu@92.5.177.159 'sudo bash -s' <<'EOS'
          set -uo pipefail
          echo "== letzte 25 Logzeilen des Dienstes =="
          journalctl -u lead-responder --since "-25 min" --no-pager -o cat 2>/dev/null | tail -25
          EOS
