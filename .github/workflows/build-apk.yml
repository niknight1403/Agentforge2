name: Build Android APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Android Lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Unit-Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release-APK bauen (R8-minimiert)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk VillaForge.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: villaforge-apk
          path: VillaForge.apk
          if-no-files-found: error


      - name: Android-Prüfberichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: app/build/reports/
          if-no-files-found: warn
