name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'docs/releases/**'
      - '.github/workflows/build-apk.yml'
      - 'server/**'
      - 'scripts/**'
      - 'package.json'

concurrency:
  group: villaforge-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Lint und Unit-Tests
        run: gradle :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release-APK bauen (R8-minimiert)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Release-Tag mit Android-Version abgleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          test "v$APP_VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME passt nicht zur Android-Version $APP_VERSION"; exit 1;
          }

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk VillaForge.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: villaforge-apk
          path: VillaForge.apk
          if-no-files-found: error

      - name: Node 23 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Hub-Laufzeitabhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Gesamte Hub-Qualitaetstore
        run: npm run check

      - name: Browser-Design-Audit
        run: npm run test:design

      - name: Browser-Live-E2E
        run: npm run test:live

      - name: Web-Produktionsbuild erstellen
        run: |
          npm run build:web
          cd dist
          zip -qr ../VillaForge-Web.zip web

      - name: Release-Artefakte mit Build-Provenienz attestieren
        uses: actions/attest@v4
        with:
          subject-path: |
            VillaForge.apk
            VillaForge-Web.zip

      - name: Web-Paket als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: villaforge-web
          path: VillaForge-Web.zip
          if-no-files-found: error

      # LLM-Smoke-Test: laeuft nur, wenn Repository-Secrets hinterlegt sind
      # (Settings → Secrets and variables → Actions). Keys erscheinen nie
      # im Log und liegen nicht im Repo; der Hub liest sie aus der Umgebung.
      - name: LLM-Smoke-Test (nur mit GitHub Secrets)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node server/scripts/llm-smoke.mjs

      - name: GitHub-Release mit getesteter APK erstellen
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TAG="v$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"; fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
              echo "Superseded build; retain artifacts but do not publish a release."
              exit 0
            fi
          fi
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha' 2>/dev/null || true)
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Release tag belongs to another commit; refusing to replace its artifacts."
            exit 1
          fi
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"; fi
            gh release upload "$TAG" VillaForge.apk VillaForge-Web.zip --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" VillaForge.apk VillaForge-Web.zip --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
              --title "VillaForge $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" VillaForge.apk VillaForge-Web.zip --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
              --title "VillaForge $TAG" --generate-notes
          fi
