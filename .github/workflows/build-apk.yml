name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug-APK bauen
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk VillaForge.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: villaforge-apk
          path: VillaForge.apk
          if-no-files-found: error

      - name: Node 23 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Hub-Syntax pruefen (kein Start, keine Schluessel)
        run: node --check server/server.mjs

      # LLM-Smoke-Test: laeuft nur, wenn Repository-Secrets hinterlegt sind
      # (Settings → Secrets and variables → Actions). Keys erscheinen nie
      # im Log und liegen nicht im Repo; der Hub liest sie aus der Umgebung.
      - name: LLM-Smoke-Test (nur mit GitHub Secrets)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node server/scripts/llm-smoke.mjs
