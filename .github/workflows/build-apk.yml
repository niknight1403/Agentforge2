name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [Hub-Deploy]
    types: [completed]
    branches: [main]

concurrency:
  group: villaforge-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  apk:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      VF_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VF_BUILD_SHA }}

      - name: JDK 17 einrichten
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Lint und Unit-Tests
        run: gradle :app:lintDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release-APK bauen (R8-minimiert)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Release-Tag mit Android-Version abgleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          test "v$APP_VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME passt nicht zur Android-Version $APP_VERSION"; exit 1;
          }

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk VillaForge.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: villaforge-apk
          path: VillaForge.apk
          if-no-files-found: error

      - name: Node 24 einrichten
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Hub-Laufzeitabhaengigkeiten installieren
        run: npm ci --no-audit --no-fund

      - name: Gesamte Hub-Qualitaetstore
        run: npm run check

      - name: Browser-Design-Audit
        run: npm run test:design

      - name: Browser-Live-E2E
        run: npm run test:live

      - name: Web-Produktionsbuild erstellen
        run: |
          npm run build:web
          cd dist
          zip -qr ../VillaForge-Web.zip web

      - name: Release-Artefakte mit Build-Provenienz attestieren
        uses: actions/attest@v4
        with:
          subject-path: |
            VillaForge.apk
            VillaForge-Web.zip

      - name: Web-Paket als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: villaforge-web
          path: VillaForge-Web.zip
          if-no-files-found: error

      # Mandatory production LLM gate; missing credentials fail closed.
      # Credentials are supplied through GitHub Secrets and never logged.
      - name: Produktive LLM-Kette und Villa-Produktabnahme prüfen
        env:
          VF_SMOKE_BASE_URL: https://hub.cybersarah-ki.com
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
        run: node scripts/live-llm-smoke.mjs

      - name: GitHub-Release mit getesteter APK erstellen
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then TAG="v$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"; fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            LATEST_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
            if [ "$LATEST_SHA" != "$VF_BUILD_SHA" ]; then
              echo "Superseded build; retain artifacts but do not publish a release."
              exit 0
            fi
          fi
          # gh gibt bei 404/422 den Fehler-Body auf stdout aus; ohne Pruefung
          # gilt "No commit found for SHA: v1.60.6" faelschlich als Tag-SHA und
          # jede frische Version wird verweigert. Nur echte SHAs zaehlen.
          TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha' 2>/dev/null || true)
          printf '%s' "$TAG_SHA" | grep -Eq '^[0-9a-f]{40}$' || TAG_SHA=""
          if [ -n "$TAG_SHA" ] && [ "$TAG_SHA" != "$VF_BUILD_SHA" ]; then
            echo "Release tag $TAG gehoert zu $TAG_SHA, dieser Build ist $VF_BUILD_SHA; Artefakte des anderen Commits bleiben unangetastet."
            exit 1
          fi
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"; fi
            gh release upload "$TAG" VillaForge.apk VillaForge-Web.zip --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" VillaForge.apk VillaForge-Web.zip --target "$VF_BUILD_SHA" --repo "$GITHUB_REPOSITORY" \
              --title "VillaForge $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" VillaForge.apk VillaForge-Web.zip --target "$VF_BUILD_SHA" --repo "$GITHUB_REPOSITORY" \
              --title "VillaForge $TAG" --generate-notes
          fi
