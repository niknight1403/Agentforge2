name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7 einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unit-Tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Release-APK bauen (R8-minimiert)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Release-Tag mit Android-Version abgleichen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP_VERSION=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          test "v$APP_VERSION" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME passt nicht zur Android-Version $APP_VERSION"; exit 1;
          }

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk VillaForge.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: villaforge-apk
          path: VillaForge.apk
          if-no-files-found: error

      - name: Node 23 einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "23"

      - name: Hub-Syntax pruefen (kein Start, keine Schluessel)
        run: node --check server/server.mjs

      # LLM-Smoke-Test: laeuft nur, wenn Repository-Secrets hinterlegt sind
      # (Settings → Secrets and variables → Actions). Keys erscheinen nie
      # im Log und liegen nicht im Repo; der Hub liest sie aus der Umgebung.
      - name: LLM-Smoke-Test (nur mit GitHub Secrets)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node server/scripts/llm-smoke.mjs

      - name: GitHub-Release mit getesteter APK erstellen
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" VillaForge.apk --repo "$GITHUB_REPOSITORY" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" VillaForge.apk --repo "$GITHUB_REPOSITORY" \
              --title "VillaForge $TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" VillaForge.apk --repo "$GITHUB_REPOSITORY" \
              --title "VillaForge $TAG" --generate-notes
          fi
