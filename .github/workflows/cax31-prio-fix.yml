name: CAX31-Kaskadenprioritaet korrigieren (14B als letzte Stufe)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prioritaet auf 47 setzen, Hub neu starten, verifizieren
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          VILLA_ADMIN_EMAIL: ${{ secrets.VILLA_ADMIN_EMAIL }}
          VILLA_ADMIN_PASSWORD: ${{ secrets.VILLA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key && chmod 600 ~/.ssh/oracle_key
          test -n "$VILLA_ADMIN_EMAIL" && test -n "$VILLA_ADMIN_PASSWORD" || { echo "VILLA_ADMIN_EMAIL/PASSWORD secrets fehlen"; exit 1; }
          ADMIN_EMAIL_B64=$(printf %s "$VILLA_ADMIN_EMAIL" | base64 -w0)
          ADMIN_PASSWORD_B64=$(printf %s "$VILLA_ADMIN_PASSWORD" | base64 -w0)
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -i ~/.ssh/oracle_key ubuntu@92.5.177.159 "sudo ADMIN_EMAIL_B64='$ADMIN_EMAIL_B64' ADMIN_PASSWORD_B64='$ADMIN_PASSWORD_B64' bash -s" <<'EOS'
          set -uo pipefail
          python3 - <<'PYV'
          import sqlite3
          con = sqlite3.connect("/opt/villaforge/server/data/villaforge.db")
          cur = con.cursor()
          row = cur.execute("SELECT id FROM routes WHERE name LIKE 'Cascade: Ollama CAX31%'").fetchone()
          if not row:
              raise SystemExit("FEHLER: CAX31-Route nicht gefunden")
          cur.execute("UPDATE routes SET priority=47 WHERE id=?", (row[0],))
          con.commit()
          for r in cur.execute("SELECT name, priority FROM routes WHERE name LIKE 'Cascade:%' ORDER BY priority").fetchall():
              print("  ", r)
          PYV
          systemctl restart villaforge-hub 2>/dev/null || systemctl restart villaforge 2>/dev/null || true
          sleep 12
          systemctl is-active villaforge-hub 2>/dev/null || systemctl is-active villaforge 2>/dev/null || true
          TOK=$(curl -fsS -m 10 -X POST http://127.0.0.1:12000/api/auth/login -H "Content-Type: application/json" -d "$(python3 -c 'import base64,json,os; print(json.dumps({"email":base64.b64decode(os.environ["ADMIN_EMAIL_B64"]).decode(),"password":base64.b64decode(os.environ["ADMIN_PASSWORD_B64"]).decode()}))')" | python3 -c "import json,sys; print(json.load(sys.stdin).get('token',''))")
          test -n "$TOK" || { echo "Admin-Login fehlgeschlagen"; exit 1; }
          curl -s -m 10 -X POST -H "Authorization: Bearer $TOK" http://127.0.0.1:12000/api/routeforge/tick | head -c 200; echo
          sleep 8
          curl -s -m 10 http://127.0.0.1:12000/api/health | python3 -c "import json,sys; d=json.load(sys.stdin); l=d.get('llm',{}); print('LLM:', l.get('eligibleRoutes'), '/', l.get('configuredRoutes'), 'state:', l.get('state'))"
          EOS
