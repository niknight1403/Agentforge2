name: Swarm Relay Refresh

# Hourly provider heartbeat for the AGI Swarm Engine relay (GitHub Pages).
# Uses repository secrets only at runtime; values are never printed or committed.
# Base44 backend functions are not called here (they are credit-gated).

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swarm-relay-refresh
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Probe providers
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 gh-relay/probe.py

      - name: Commit results
        run: |
          git config user.name "swarm-relay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/swarm/heartbeat.json docs/swarm/providers.json docs/swarm/metrics.json
          git diff --staged --quiet || git commit -m "chore(swarm-relay): provider heartbeat [skip ci]"
          git push
