name: Lead Responder - Server Recon
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: SSH recon on production host
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 ubuntu@92.5.177.159 'bash -s' <<'EOS'
          set +e
          echo "== hub vhost: server blocks and locations =="
          sudo grep -nE "server \{|server_name|listen |location " /etc/nginx/sites-enabled/villaforge-hub
          echo "== 9443 block detail =="
          sudo awk 'NR>=280 && NR<=380' /etc/nginx/sites-enabled/villaforge-hub
          echo "== anfragepilot =="
          ls /opt/anfragepilot | head -5
          systemctl list-units --all --no-pager | grep -i anfrage
          echo "== node sqlite check =="
          node -e "const {DatabaseSync}=require('node:sqlite'); const d=new DatabaseSync(':memory:'); d.exec('create table t(a)'); console.log('node:sqlite ok')" 2>&1 | tail -2
          EOS
