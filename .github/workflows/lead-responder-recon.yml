name: Lead Responder - Server Recon
on:
  workflow_dispatch:

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: SSH recon on production host
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          ssh -i ~/.ssh/oracle_key -o StrictHostKeyChecking=no -o ConnectTimeout=25 ubuntu@92.5.177.159 'bash -s' <<'EOS'
          set +e
          echo "== node =="; node -v; command -v node
          echo "== os =="; grep PRETTY_NAME /etc/os-release; nproc; free -m | head -2 | tail -1; df -h / | tail -1
          echo "== listening ports =="; ss -ltn 2>/dev/null | awk 'NR>1{print $4}' | sed 's/.*://' | sort -un | tr '\n' ' '; echo
          echo "== running services =="; systemctl list-units --type=service --state=running --no-pager | grep -Ei "hub|cyber|lead|nginx|ollama|caddy" | awk '{print $1}'
          echo "== nginx includes =="; ls /etc/nginx/sites-enabled/ /etc/nginx/conf.d/ 2>/dev/null
          echo "== nginx server blocks =="; sudo nginx -T 2>/dev/null | grep -E "server_name|listen " | head -30
          echo "== nginx locations (hub vhost) =="; sudo nginx -T 2>/dev/null | grep -nE "location |proxy_pass" | head -40
          echo "== tls certs =="; sudo ls /etc/letsencrypt/live 2>/dev/null
          echo "== /opt =="; ls -l /opt 2>/dev/null | head -12
          echo "== sudo =="; sudo -n true && echo "passwordless sudo ok"
          echo "== outbound =="; curl -s -o /dev/null -w "github:%{http_code} " https://github.com; curl -s -o /dev/null -w "groq:%{http_code}\n" https://api.groq.com
          echo "== systemd unit example (hub) =="; systemctl cat villaforge-hub.service 2>/dev/null | head -20
          EOS
