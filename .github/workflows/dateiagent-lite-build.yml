name: Build DateiAgent Lite APK
on:
  push:
    branches:
      - dateiagent-lite-apk
    paths:
      - dateiagent-lite-android/**
      - .github/workflows/dateiagent-lite-build.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile and sign debug APK
        working-directory: dateiagent-lite-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check installable APK
        run: |
          test -s dateiagent-lite-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t dateiagent-lite-android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dateiagent-lite-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DateiAgent-Lite-1.0.1-Android-APK
          path: dateiagent-lite-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish directly downloadable APK on build branch
        run: |
          mkdir -p dateiagent-lite-android/release
          cp dateiagent-lite-android/app/build/outputs/apk/debug/app-debug.apk dateiagent-lite-android/release/DateiAgent-Lite-1.0.1.apk
          sha256sum dateiagent-lite-android/release/DateiAgent-Lite-1.0.1.apk > dateiagent-lite-android/release/SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dateiagent-lite-android/release/DateiAgent-Lite-1.0.1.apk
          git add -f dateiagent-lite-android/release/SHA256SUMS.txt
          git commit -m "Build: verified Android debug APK" || true
          git push origin HEAD:refs/heads/dateiagent-lite-apk
