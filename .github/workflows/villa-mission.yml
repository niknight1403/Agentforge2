name: Villa-Mission (manueller Start + Scheduler-Beobachtung)
on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Explizit zu startende Villa-IDs, kommasepariert; leer = nur beobachten'
        required: false
        default: ''
      create_name:
        description: 'Neue Villa anlegen und starten (nur manuell)'
        required: false
        default: ''
      create_idea:
        description: 'Originalidee fuer die neue Villa'
        required: false
        default: ''
      create_source:
        description: 'Quellpfad der neuen Villa (optional)'
        required: false
        default: ''
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: villa-mission
  cancel-in-progress: false
jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Bewusste Starts erhalten, Scheduler nicht duplizieren
        env:
          VF_ADMIN_EMAIL: ${{ secrets.VF_ADMIN_EMAIL }}
          VF_ADMIN_PASSWORD: ${{ secrets.VF_ADMIN_PASSWORD }}
          VF_MISSION_IDS: ${{ github.event.inputs.ids }}
          VF_MISSION_NAME: ${{ github.event.inputs.create_name }}
          VF_MISSION_IDEA: ${{ github.event.inputs.create_idea }}
          VF_MISSION_SOURCE: ${{ github.event.inputs.create_source }}
        run: bash scripts/villa-mission.sh
