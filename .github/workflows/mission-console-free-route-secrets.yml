name: Mission Console free route secret readiness

on:
  push:
    branches: [codex/mission-console-free-secret-routes]
    paths:
      - '.github/workflows/mission-console-free-route-secrets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
    steps:
      - name: Check free route credentials without inference or secret output
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const routes = [
            { name: 'Groq', key: process.env.GROQ_API_KEY, url: 'https://api.groq.com/openai/v1/models' },
            { name: 'OpenRouter', key: process.env.OPENROUTER_API_KEY, url: 'https://openrouter.ai/api/v1/auth/key' },
            { name: 'Cerebras', key: process.env.CEREBRAS_API_KEY, url: 'https://api.cerebras.ai/v1/models' },
          ];
          const lines = ['## Free route secret readiness', '', '| Route | Secret | Read-only API |', '|---|---|---|'];
          for (const route of routes) {
            if (!route.key) {
              lines.push(`| ${route.name} | missing | skipped |`);
              continue;
            }
            try {
              const response = await fetch(route.url, {
                headers: { Authorization: `Bearer ${route.key}`, Accept: 'application/json' },
                signal: AbortSignal.timeout(8000),
              });
              lines.push(`| ${route.name} | present | HTTP ${response.status} |`);
            } catch {
              lines.push(`| ${route.name} | present | unreachable |`);
            }
          }
          lines.push('', 'GET-only diagnostic. No model inference, billing change, deployment, or secret value output. An HTTP 200 does not prove a free account tariff.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
