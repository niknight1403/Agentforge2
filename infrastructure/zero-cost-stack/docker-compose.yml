name: agentforge-zero-cost

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:?set N8N_DB_USER}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      AP_DB_NAME: ${AP_DB_NAME:-activepieces}
      AP_DB_USER: ${AP_DB_USER:?set AP_DB_USER}
      AP_DB_PASSWORD: ${AP_DB_PASSWORD:?set AP_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-agentforge}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.13.0
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [backend]
    ports: ["127.0.0.1:11434:11434"]
    expose: ["11434"]
    # GPU-specific Compose overrides belong in config/compose.gpu.nvidia.yml
    # or config/compose.gpu.rocm.yml; CPU mode is the safe default.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.1.4
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:?set N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [backend, proxy]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports: ["127.0.0.1:5678:5678"]
    expose: ["5678"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  activepieces:
    image: activepieces/activepieces:0.75.1
    restart: unless-stopped
    environment:
      AP_DB_TYPE: POSTGRES
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: ${AP_DB_NAME:-activepieces}
      AP_POSTGRES_USERNAME: ${AP_DB_USER:?set AP_DB_USER}
      AP_POSTGRES_PASSWORD: ${AP_DB_PASSWORD:?set AP_DB_PASSWORD}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: "6379"
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?set AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET:?set AP_JWT_SECRET}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-http://localhost:8080}
      AP_EXECUTION_MODE: UNSANDBOXED
    networks: [backend, proxy]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["127.0.0.1:8080:80"]
    expose: ["80"]

  languagetool:
    image: silviof/docker-languagetool:latest
    restart: unless-stopped
    environment:
      langtool_languageModel: /ngrams
      Java_Xms: 256m
      Java_Xmx: 1g
    networks: [backend]
    ports: ["127.0.0.1:8010:8010"]
    expose: ["8010"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8010/v2/languages || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "${HTTP_BIND:-127.0.0.1}:80:80"
      - "${HTTPS_BIND:-127.0.0.1}:443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy]
    depends_on: [n8n, activepieces]

networks:
  backend:
    internal: true
  proxy:

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  n8n_data:
  caddy_data:
  caddy_config:
