# Resilienz-Tuning Ollama (llama.cpp-Engine, ARM Ampere A1 4x Neoverse-N1)
# - StartLimitIntervalSec=0 + Restart=always: Absturz => sofortiger Neustart
# - OLLAMA_FLASH_ATTENTION=1: Flash-Attention auf ARM, weniger RAM-Verkehr
# - MemoryMax=21G: Sicherheitsdeckel unter den 24 GB der Instanz, damit
#   ein entfesseltes Modell nicht die ganze Kiste in den OOM treibt
# Threads laesst Ollama automatisch auf die 4 physischen Cores binden;
# Parallelitaet (OLLAMA_NUM_PARALLEL=4) und Keepalive (30m) stehen im
# parallelen Drop-In parallel.conf und bleiben unberuehrt.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
Environment=OLLAMA_FLASH_ATTENTION=1
MemoryMax=21G
