# Resilienz-Tuning VillaForge Hub (Drop-In, idempotent installierbar)
# - StartLimitIntervalSec=0: systemd gibt nie auf, der Hub startet unbegrenzt neu
# - NODE_OPTIONS: GC-Tuning fuer minimalen RAM-Fussabdruck (Free Tier!)
# - MemoryHigh/MemoryMax: cgroup-Deckel, damit der Hub nie den RAM des
#   Ollama-Modellservers erdrueckt (kontrollierter Restart statt System-OOM)
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=3
Environment=NODE_OPTIONS=--max-old-space-size=768
MemoryHigh=900M
MemoryMax=1200M
